# ============================================================================
# Raspberry Pi 4 / BCM2711 — SoDeV disaggregated cockpit on Xen 4.22
# ============================================================================
#
# SIBLING FILE. There is one product yaml per board and moulin has no cross-file
# include, so roughly 750 lines are the same text in both rpi4-sodev.yaml and rpi5-sodev.yaml.
# A block that is not board-specific has to be edited in BOTH. That is not a
# convention anyone can be relied on to remember, so tools/check-yaml-drift.py
# normalises the board-specific tokens and fails on any functional line that differs
# outside its recorded baseline. Run it after touching either file.
#
# The Raspberry Pi 4 sibling of rpi5-sodev.yaml. Same four-domain design — Dom0
# (Zephyr or thin Linux) + dom0less DomD + DomU (AGL cluster) + DomA (AAOS) — with
# every SoC-specific value re-derived for BCM2711: the dtuart path, the passthrough
# node paths, the MMIO addresses, the GIC SPIs and the whole physical memory map.
# Their source is meta-xt-rpi4/BCM2711-DT-TRUTH.md, which records those values as
# measured from the shipped bcm2711-rpi-4-b.dtb. RP1, MIP and SCMI do not exist on
# this SoC and are absent here rather than remapped.
#
# STATUS. Both flavours build and assemble a full.img (`--board=rpi4 --dom0=linux`
# and `--dom0=zephyr`). On hardware, the sending environment booted Dom0(Zephyr) +
# dom0less DomD + DomA on a 4 GiB board, with AAOS reaching sys.boot_completed=1,
# CarLauncher on the panel and touch input reaching the guest. That hardware run has
# NOT been reproduced in the environment this file was contributed from; see
# meta-xt-rpi4/README.md for what is verified where, and for the open items
# (VL805 guest MSI, OP-TEE, A72 two-screen headroom).
#
# NAMING. The layer is meta-xt-rpi4, but the IMAGE RECIPE names stay rpi5-image-*.
# They are recipe names shared with meta-xt-common, not board names, and renaming
# them would touch a dozen unrelated files for no functional gain. Where a comment
# below says "meta-xt-rpi5" it is describing upstream text or the sibling board; the
# layer this yaml loads is meta-xt-rpi4, and the two are never loaded together.
# ============================================================================
desc: "Raspberry Pi 4 + Xen 4.22 — AGL SoDeV disaggregated cockpit (Zephyr or thin-Linux Dom0)"

# Combining model (moulin has NO cross-file include):
#   Dom0/DomD : rpi5 base. Component bodies live in the external/meta-xt-prod-devel-rpi5
#               submodule (rpi5.yaml). The blocks below are thin wiring that reference those
#               layers by path; bump the submodule to follow xen-troops.
#   DomU      : AGL Flutter, built OUTSIDE moulin by build.sh (repo init + bitbake). Not a component here.
#   DomA      : doma / doma_kernel components COPIED verbatim from the V4H AGL SoDeV yaml
#               (external/sodev-demo-workspace/external/meta-rcar-demo/prod-devel-rcar4_new.yaml).
#               Keep their manifest revs in sync via meta-rpi-sodev/scripts/sync-guest-pins.sh.

variables:
  # --- RPi5 base ---
  YOCTOS_WORK_DIR: "yocto"
  DOM0_BUILD_DIR: "build-dom0"
  DOMD_BUILD_DIR: "build-domd"
  DOMU_BUILD_DIR: "build-domu"
  MACHINE: "raspberrypi4-64"   # meta-raspberrypi machine (SOC_FAMILY=rpi, MACHINEOVERRIDES raspberrypi4, DEFAULTTUNE cortexa72-nocrypto)
  # NOTE: this is the workspace's OWN naming variable (fed to the DomD build as
  # RPI_SOC_FAMILY), used only to template the DT file names
  # bcm2711-raspberrypi4-64-*.dts{,o}. meta-raspberrypi itself sets SOC_FAMILY = "rpi"
  # in rpi-base.inc and has no RPI_SOC_FAMILY at all, so nothing upstream conflicts.
  SOC_FAMILY: "bcm2711"
  DOM0_OS: "zephyr"          # default zephyr; overridable: --DOM0_OS {zephyr|linux}. On a new board bring the thin-Linux Dom0 up first: it is a relocatable arm64 Image, so it does not depend on the Zephyr SRAM relink being right.

  # --- Zephyr Dom0 (main branch policy, copied from rpi5.yaml) ---
  ZEPHYR_DOM0_DIR: "zephyr"
  # Zephyr's Raspberry Pi 4 board is spelled rpi_4b (boards/raspberrypi/rpi_4b
  # upstream, boards/arm64/rpi_4b at the pinned xen-troops rev) — NOT "rpi_4".
  # GIC_V2 is unchanged from rpi_5, but the board needs a pl011 node and its SRAM
  # base relinked to Xen's Dom0 bank[0] = 0x20000000. See
  # meta-xt-common/meta-xt-dom0-zephyr/README.md.
  ZEPHYR_DOM0_MACHINE: "rpi_4b"
  ZEPHYR_DOM0_TARGET: "zephyr-dom0-xt"
  ZEPHYR_DOM0_BUILD_DIR: "build-dom0"

  # --- DomZ (Zephyr guest / DomU) ---------------------------------------------
  # DomZ is a SECOND, independent west workspace: the Dom0 one (%{ZEPHYR_DOM0_DIR})
  # only exists in the --DOM0_OS zephyr flavour, and DomZ must build in both. The
  # manifest is the same repository as Dom0's (it is what pins xen-troops/zephyr,
  # the tree that carries the xenvm board), but the application built out of it is
  # this repo's domz/app, referenced by a workspace-relative path: moulin's zephyr
  # builder runs `west build ... $target` from inside the component build-dir, so a
  # target outside the workspace is simply a relative path. That keeps the DomZ
  # application versioned here while the Zephyr checkout stays pristine.
  ZEPHYR_DOMZ_DIR: "zephyr-domz"
  ZEPHYR_DOMZ_MACHINE: "xenvm"      # Zephyr's Xen-guest board (GICv2, Xen PV console)
  ZEPHYR_DOMZ_APP: "../domz/app"
  # Named after the board even though the guest is board-independent (`xenvm`, so the
  # two boards produce the same image): moulin's zephyr builder does not build pristine,
  # and a shared directory would hand whichever board ran last its predecessor's CMake
  # cache -- a cross-board switch then reconfigures in place instead of from scratch.
  # One directory per board keeps `moulin rpi4-sodev.yaml && ninja domz` after an rpi5
  # build honest, and keeps the two boards' artifacts separately inspectable.
  ZEPHYR_DOMZ_BUILD_DIR: "build-domz-rpi4"

  # --- DomD / DomU build dirs + machines + image names (copied from rpi5.yaml) ---
  DOMU_MACHINE: "virtio-armv8-xt"
  XT_XEN_DTBO_NAME: "%{SOC_FAMILY}-%{MACHINE}-xen.dtbo"
  XT_DOMD_DTB_NAME: "%{SOC_FAMILY}-%{MACHINE}-domd.dtb"
  # No XEN_DT_SCMI_NAME here, unlike rpi5-sodev.yaml: BCM2711 has no SCMI at all —
  # clocks and power come from the VideoCore firmware mailbox — so this layer carries
  # neither the SCMI overlays nor the SCMI Kconfig fragment.
  # DomD = V4H sodev pattern (weston + qemu virtio-gpu backend + xen-tools-devd +
  #   V4H helpers) so the DomU/DomA -> DomD weston -> HDMI display chain renders.
  #   The -v4h recipe lives in the linux-dom0-poc layer (added to the domd
  #   component below, alongside the domd layer — exactly as the reference build does).
  XT_DOMD_IMAGE: "rpi5-image-xt-domd-v4h"
  # Informational/unused: the shipping DomU is built by the AGL bitbake
  # (agl-cluster-demo-flutter-guest); this workspace only harvests its kernel Image
  # (see build_target below). The full DomU gfx image (rpi5-image-domu-gfx) moved to
  # the opt-in meta-rpi-sodev-devel layer, so %{XT_DOMU_IMAGE} is not consumed here.
  XT_DOMU_IMAGE: "rpi5-image-domu-gfx"
  DOMD_CAN_TYPE: ""
  # DOMD_ROOTFS_DEV (usb default = /dev/sda1), kept sed-escaped to mirror rpi5.yaml.
  # NOTE: INERT on this board. On rpi5 (xt-rpi-u-boot-scr's only COMPATIBLE_MACHINE)
  # do_compile:raspberrypi5 installs a STATIC board-tuned boot.cmd
  # (meta-xt-rpi4 boot.cmd.xen.{zephyr,linux}-dom0.in) with the DomD cmdline hard-coded;
  # there is no `sed 's/@@..@@/../'` template substitution, so neither this value nor the
  # DOMD_BOOTARGS that references it (below) reaches the boot script. Retained (escaping
  # and all) only to keep the %{DOMD_ROOTFS_DEV} expansion in DOMD_BOOTARGS valid and to
  # mirror rpi5.yaml; edit the .in template to change the real DomD root/cmdline.
  DOMD_ROOTFS_DEV: "\\\\/dev\\\\/sda1"

  # --- DomA (Android) — copied from V4H prod-devel-rcar4_new.yaml ---
  # Board-suffixed, unlike the Pi 5's plain "android"/"android_kernel". A virtio guest
  # still executes on the host cores, so DomA is built for this board's ISA (see
  # ANDROID_DEVICE below) -- the two boards' checkouts are NOT interchangeable. Sharing
  # one directory also hides a mis-specified --aaos-ref: the second board finds the
  # first board's populated checkout, moulin skips the repo init, and the wrong mirror
  # is never exercised until someone builds from a clean tree hours later. A separate
  # directory makes the second board start empty, so a wrong mirror fails at once.
  # The Pi 5 keeps the historical names so an existing checkout is not re-synced.
  ANDROID_KERNEL_DIR: "android_kernel-rpi4"
  DOMA_DIR: "android-rpi4"
  # repo group set for the AOSP/kernel `repo init` (-g). This board's AAOS device is a
  # repo project, not a directory staged from this layer: the manifest names
  # automotive-grade-linux/Android_device_sodev_xenvm-cf at device/sodev/xenvm-cf with
  # groups="notdefault,rpi4", so it is fetched only when the group is asked for. repo
  # REPLACES the group set rather than adding to it, so "default" has to be named too --
  # -g rpi4 alone would sync one project and nothing else. Measured on the pinned
  # revision: 1087 projects with this value, 1086 with the empty one rpi5 uses.
  XT_DOMA_SOURCE_GROUP: "default,rpi4"
  ANDROID_KERNEL_BUILD_CONFIG: "//common-modules/xen-virtual-device:xen_virtual_device_aarch64_dist"
  ANDROID_KERNEL_DEPLOY_DIR: "out/deploy/common-modules/xen-virtual-device/xen_virtual_device_aarch64"
  # Where stage-doma-kernel.sh copies that dist to, relative to the AOSP checkout root, and
  # therefore the prefix the doma builder's TARGET_PREBUILT_* env below uses. It must be a
  # tree-relative path: Android 16 moved filesystem assembly into Soong, which rejects a
  # source path starting with "../" or "/" (build/soong/android/paths.go), so the pre-17
  # "../%{ANDROID_KERNEL_DIR}/..." form now fails soong analysis. Not under device/: that is
  # repo-managed and `repo sync` would delete the copy. The name needs no board suffix --
  # it lives inside this board's own AOSP checkout (DOMA_DIR above).
  ANDROID_KERNEL_STAGE_DIR: "xt-doma-kernel"
  # A Raspberry Pi 4 specific AAOS product, not the upstream one. The AAOS guest is
  # compiled for the ISA of the HOST cores it runs on -- a virtio guest still executes on
  # the host's CPUs -- and the upstream board config resolves to cortex-a53, which is not
  # the Cortex-A72 of a BCM2711. The variant is ADDED, not patched in: it includes the
  # upstream board config and overrides the ISA baseline after it. Its own PRODUCT_DEVICE
  # also keeps the two boards' out/target/product trees apart, so switching --board
  # cannot reuse objects compiled for the other CPU.
  #
  # It arrives with `repo sync`, from the project the manifest carries in the
  # notdefault,rpi4 group (device/sodev/xenvm-cf -- see XT_DOMA_SOURCE_GROUP above), so
  # nothing is copied into the checkout for this board any more. stage-aosp-device.sh
  # still runs between `ninja fetch-doma` and `ninja doma`, but for rpi4 it only checks
  # that the project, its BoardConfig and the two files it installs are there: a
  # forgotten group flag would otherwise surface as `lunch` reporting "Can't find a
  # product spec" with nothing pointing at the flag.
  ANDROID_DEVICE: "xenvm_trout_rpi4_arm64"
  ANDROID_LUNCH_TARGET: "aosp_xenvm_trout_rpi4_arm64-trunk_staging-userdebug"
  # --- DomU (AGL) — informational; actual build is in build.sh ---
  AGL_GUEST_MACHINE: "virtio-aarch64"
  AGL_GUEST_IMAGE_IC: "agl-cluster-demo-flutter-guest"

common_data:
  # === Wrynose 6.0 LTS (component repos) ===========================================
  # Yocto 6.0 (wrynose) deprecated the `poky` combo-repo (frozen at walnascar 5.2).
  # The release ships as separate component repos. moulin's yocto builder hard-codes
  # `poky/oe-init-build-env` and seeds BBLAYERS with `<poky>/meta` only, so we
  # reconstruct a `poky/` directory from the components:
  #   - openembedded-core -> dir:poky  (provides oe-init-build-env + scripts + meta;
  #     its default bblayers.conf.sample seeds only ##OEROOT##/meta = poky/meta)
  #   - bitbake           -> dir:bitbake  (oe-buildenv-internal resolves bitbake at
  #     $OEROOT/../bitbake when poky/bitbake is absent, i.e. yocto/bitbake — verified)
  #   - meta-yocto        -> dir:meta-yocto  (meta-poky[DISTRO=poky] + meta-yocto-bsp;
  #     NOT seeded by the oe-core sample, so added explicitly in common_yocto_layers)
  # bitbake 2.18.0 / oe-core wrynose 5d1aa5c8 / meta-yocto wrynose 24c24cef.
  common_yocto_sources: &COMMON_YOCTO_SOURCES
    - type: git
      url: "https://git.openembedded.org/openembedded-core"
      rev: "5d1aa5c806c061a2994f4decb59016610f093213"
      dir: "poky"
    - type: git
      url: "https://git.openembedded.org/bitbake"
      rev: "acfe02fa38b5da9e6a36c6cedcf91d4fcbefbfbd"
      dir: "bitbake"
    - type: git
      url: "https://git.yoctoproject.org/meta-yocto"
      rev: "24c24cef5d1523fefe43a3e3d34667b37ae551f3"
      dir: "meta-yocto"
    - type: git
      url: "https://git.openembedded.org/meta-openembedded"
      rev: "100027977216601000cbefc42c2ff6cf667e7b5e"
    - type: git
      url: "https://git.yoctoproject.org/meta-virtualization"
      rev: "781735b97ae5013cacabbecd38e6da6b510cf3fb"
    - type: git
      url: "https://git.yoctoproject.org/meta-selinux"
      rev: "1c3a699f363167571ab39fecb0fe6f56691a4e20"
    # xen-troops meta-xt-common has no wrynose branch (scarthgap-only upstream). The
    # wrynose port (LAYERSERIES_COMPAT bump + WORKDIR->UNPACKDIR + inline-python
    # refactor) cannot be carried as .bbappends (layer.conf is not appendable) and
    # moulin has no post-clone patch hook, so the forked layer is VENDORED into this
    # repo under meta-rpi-sodev/meta-xt-common and referenced by path in the layers list
    # below (no upstream clone of it into yocto/).

  # meta-yocto's meta-poky / meta-yocto-bsp are NOT seeded by the oe-core default
  # bblayers.conf.sample (only the poky-bundle's meta-poky template did that), so add
  # them explicitly. They do not match moulin's YOCTO_CORE_LAYERS (../poky/meta-poky),
  # so they are not filtered out.
  common_yocto_layers: &COMMON_YOCTO_LAYERS
    - "../meta-yocto/meta-poky"
    - "../meta-yocto/meta-yocto-bsp"
    - "../meta-openembedded/meta-oe"
    - "../meta-openembedded/meta-python"
    - "../meta-openembedded/meta-networking"
    - "../meta-openembedded/meta-filesystems"
    # meta-xt-common forked layer (vendored): see common_yocto_sources note.
    - "../../meta-rpi-sodev/meta-xt-common/meta-xt-domx"
    - "../meta-selinux"
    - "../meta-virtualization"

  # Conf options for domain that use linux
  linux_domain_conf: &LINUX_DOMAIN_CONF
    # Cache: repo-relative sstate + downloads under common_data (works on a clean
    # clone). For faster rebuilds against a pre-populated cache (e.g. another
    # workspace), export XT_SSTATE_DIR / XT_DL_DIR when running build.sh — they
    # override the portable defaults below (build.sh passes them through to
    # bitbake via BB_ENV_PASSTHROUGH_ADDITIONS). Empty env = the defaults here.
    - [SSTATE_DIR, "${@os.getenv('XT_SSTATE_DIR') or d.expand('${TOPDIR}/../common_data/sstate')}"]
    - [DL_DIR, "${@os.getenv('XT_DL_DIR') or d.expand('${TOPDIR}/../common_data/downloads')}"]
    # DISTRO. With the poky combo-repo gone, meta-poky's poky.conf is added as an
    # explicit layer (common_yocto_layers) and DISTRO must be set here (the
    # poky-bundle local.conf.sample used to default it).
    - [DISTRO, "poky"]
    # Skip warning about missing "virtualization" distro feature
    - [SKIP_META_VIRT_SANITY_CHECK, "1"]
    # [wrynose] patch-status QA: ERROR -> WARN. The xen-troops fork / RPi5-Xen local
    # patch sets (v4h-xen-patches / xen_patchset / qemu 0101-0112 ...) lack
    # Upstream-Status headers and are Inappropriate-to-upstream by nature. Content-
    # neutral; wrynose promoted this QA check to ERROR.
    - [ERROR_QA:remove, "patch-status"]
    - [WARN_QA:append, " patch-status"]
    # [wrynose] do_rootfs log_check exclusion. The dom0-thin / domd images mask
    # Dom0-only units; wrynose systemd's `systemctl preset-all` now PRINTS "Failed to
    # preset all unit: Unit ... is masked" (then "ignoring"). The word "Failed" trips
    # log_check -> spurious do_rootfs ERROR. The masking is intentional and non-fatal.
    # The exclude is a SINGLE whitespace-free regex (spaces written as \s+): the OE-core
    # consumer splits IMAGE_LOG_CHECK_EXCLUDES on whitespace, so a pattern with literal
    # spaces would tokenize into fragments -- and the bare ".*" fragment matches every
    # line, silently disabling log_check entirely. \s+ keeps it one pattern either way.
    - [IMAGE_LOG_CHECK_EXCLUDES, 'Failed\s+to\s+preset\s+all\s+unit:\s+Unit\s+.*\s+is\s+masked']
    # [wrynose] xen-tools qemu RDEPENDS. wrynose's xen_git.bb comes from
    # meta-virtualization, whose xen-tools.inc puts QEMU_SYSTEM_RDEPENDS (default
    # qemu-system-i386) into RDEPENDS:${PN}. That breaks both images: x86 qemu is
    # never built for aarch64 Xen, and the thin dom0 deliberately EXCLUDES qemu (the
    # device-model runs in DomD only) -> dnf conflict. The qemu device-model is
    # IMAGE_INSTALL'd explicitly by the DomD image, so drop the hard RDEPENDS.
    # (The scarthgap xen-troops xen-tools_git recipe structured this differently; the
    # meta-xt-qemu bbappend that fixed it does not attach to meta-virtualization's
    # xen-tools_git, so the fix lives here.)
    - ["QEMU_SYSTEM_RDEPENDS:pn-xen-tools", ""]
    # [wrynose] GL stack = libglvnd dispatch + mesa vendor backend. wrynose mesa
    # (26.0.5) only ships virtual/mesa + virtual/libgbm when 'glvnd' is in
    # DISTRO_FEATURES; libglvnd provides the GL dispatch virtuals. meta-raspberrypi's
    # rpi-default-providers.inc unconditionally pins virtual/{egl,libgles2,libgl}=mesa
    # (?=, parsed as a machine include so it would win), so force the dispatch
    # virtuals to libglvnd with a hard '='. virtual/mesa + virtual/libgbm stay mesa.
    - [DISTRO_FEATURES:append, " glvnd"]
    - ["PREFERRED_PROVIDER_virtual/libgl", "libglvnd"]
    - ["PREFERRED_PROVIDER_virtual/libgles1", "libglvnd"]
    - ["PREFERRED_PROVIDER_virtual/libgles2", "libglvnd"]
    - ["PREFERRED_PROVIDER_virtual/libgles3", "libglvnd"]
    - ["PREFERRED_PROVIDER_virtual/egl", "libglvnd"]
    - ["PREFERRED_PROVIDER_virtual/libgl-native", "libglvnd-native"]
    # glvnd must flow to the nativesdk/native DISTRO_FEATURES filters too, or
    # nativesdk-libglvnd / libglvnd-native fail their REQUIRED_DISTRO_FEATURES check
    # (the oe-core filter whitelists opengl/wayland but not glvnd) and nothing
    # PROVIDES virtual/(nativesdk-)egl for the SDK/native qemu host task.
    - [DISTRO_FEATURES_FILTER_NATIVESDK:append, " glvnd"]
    - [DISTRO_FEATURES_FILTER_NATIVE:append, " glvnd"]
    # SBOM/SPDX generation stays ENABLED by default -- an automotive-grade
    # deliverable should ship one. It can be turned off for a single build with
    #     XT_DISABLE_SPDX=1 ./build.sh ...
    # which is occasionally necessary: on a build root whose qemu sstate predates
    # the qemu package split, poky's create-spdx aborts image do_rootfs with
    # "Unable to find package 'qemu-system-aarch64' in SPDX file" because the
    # cached SPDX document does not contain the split package. A clean build root
    # (or `bitbake -c cleansstate qemu`) fixes that properly; the switch is only an
    # escape hatch. The SBOM itself is a deploy artifact (tmp/deploy/spdx/*.json)
    # and is not part of the rootfs either way.
    - [INHERIT:remove, "${@'create-spdx' if os.getenv('XT_DISABLE_SPDX') else ''}"]
    # [wrynose] BB_DANGLINGAPPENDS_WARNONLY removed in wrynose 5.2. The dangling
    # appends it previously suppressed (shared meta-rpi5-domu/doma image .bbappends in
    # configs lacking the base recipe) resolve cleanly after the Phase2 layer set; no
    # dangling-append errors remain, so no replacement is needed.
    # Init manager
    - [INIT_MANAGER, "systemd"]
    # Do not install kernel image to rootfs to decrease initrd size
    - ["RDEPENDS:${KERNEL_PACKAGE_NAME}-base", ""]
    # Remove features that we are not used
    - [DISTRO_FEATURES:remove,
        "x11 gtk gobject-introspection-data nfc irda zeroconf 3g sysvinit
         alsa argp pcmcia usbgadget ptest multiarch
         sysvinit"]

parameters:
  # DOM0_OS supplies the ENTIRE dom0 component body (build-dir + sources + builder)
  # for the chosen OS, plus the dom0-kernel boot item in images.full. The base dom0
  # component is empty (sources: [] / builder: {} / placeholder build-dir), so exactly
  # one variant's disjoint body is merged in (moulin overrides append to sequences /
  # add-or-replace mapping keys, so an empty base + full-body variant is unambiguous).
  #   zephyr (DEFAULT) = upstream/main policy: west source + zephyr builder, board
  #     rpi_5, XEN_DOMCTL_INTERFACE_VERSION 0x18 (our Xen 4.22). Boot loads
  #     zephyr.bin as dom0. Requires meta-rpi-sodev/meta-xt-common/meta-xt-dom0-zephyr/apply-zephyr-patches.sh after
  #     `west update` (moulin has no apply_patch hook). See rpi5-sodev.yaml (--DOM0_OS zephyr).
  #   linux            = our verified thin control domain: git source + yocto builder,
  #     rpi5-image-xt-dom0-thin. Boot loads the dom0-thin initramfs cpio.gz.
  # NOTE: the variant bodies use the *COMMON_YOCTO_SOURCES / *LINUX_DOMAIN_CONF /
  # *COMMON_YOCTO_LAYERS anchors (defined in common_data), so this whole `parameters`
  # block is placed AFTER common_data (YAML aliases must follow their anchor).
  DOM0_OS:
    desc: "Dom0 OS: zephyr (xenstore-only disaggregated Dom0, pinned rpi5-v0.4.0) or linux (thin Linux control Dom0)"
    zephyr:
      default: true
      overrides:
        variables:
          DOM0_OS: "zephyr"
          # DomU-kernel additional_dep for the dom0 component (used by the shared
          # ENABLE_DOMU=yes override). Flavour-specific: the zephyr builder consumes
          # additional_deps verbatim (workspace-root-relative), so this carries the
          # %{YOCTOS_WORK_DIR}/ prefix -> yocto/build-domu/.../Image.
          DOM0_DOMU_KERNEL_DEP: "%{YOCTOS_WORK_DIR}/%{DOMU_BUILD_DIR}/tmp/deploy/images/%{DOMU_MACHINE}/Image"
        components:
          # Zephyr Dom0 body (from rpi5-sodev.yaml (--DOM0_OS zephyr) dom0 component):
          # zephyr-dom0-xt @ rpi5-v0.4.0, board rpi_5 (bcm2712), west source +
          # zephyr builder. See rpi5-sodev.yaml (--DOM0_OS zephyr) for the full rationale
          # (R1 0x18 ABI, hybrid dom_cfg, apply-zephyr-patches.sh).
          dom0:
            build-dir: "%{ZEPHYR_DOM0_DIR}"
            sources:
              - type: west
                url: "https://github.com/xen-troops/zephyr-dom0-xt.git"
                rev: "rpi5-v0.4.0"
            builder:
              type: zephyr
              board: "%{ZEPHYR_DOM0_MACHINE}"
              target: "%{ZEPHYR_DOM0_TARGET}"
              work_dir: "%{ZEPHYR_DOM0_BUILD_DIR}"
              vars:
                # Volume 0, not 1: on Zephyr 4.4 FF_VOLUMES comes from the number of
                # status-okay devicetree disk nodes, and this Dom0 has exactly one
                # (the inert ramdisk0 that 0019 adds so FatFs compiles at all —
                # the SD belongs to DomD). "1:" would be out of range. 0028 also
                # moves VolToPart[0] from {3, 2} to {0, 2} -- src/storage.c is shared by
                # both boards, so the rpi5 patch fixes it for rpi_4b too: `pd` indexes
                # zfs_diskio.c's
                # pdrv_str[] = {FF_VOLUME_STRS}, which has one entry here, so 3 was an
                # out-of-bounds read. Nothing is lost either way — storage_init() fails
                # earlier, at disk_access_init("SD") with -ENODEV, because the SD
                # controller is DomD's. Redundant with the Kconfig default ("0" if
                # FS_FATFS_MULTI_PARTITION); kept here so the value is visible next to
                # the other Dom0 build vars.
                - "CONFIG_DOM_STORAGE_FATFS_LOGICAL_DRIVE_NAME=\"0\""
                # NB: CONFIG_DOM_STORAGE_FATFS_DIR="" (guest kernels staged at the
                # p1 FAT root, not dom0/) is set in the board .conf —
                # meta-xt-dom0-zephyr/0019 for boards/rpi_4b.conf — NOT as a
                # builder var here, because moulin mangles an empty-string -D
                # value in its `west build -- ...` cmd.
                # [R1] match our Xen 4.22 ABI (0x18). NOTE: this only takes
                # effect together with meta-xt-dom0-zephyr patch 0033, which
                # widens the symbol's Kconfig range to 0x18 -- outside the range
                # kconfiglib discards the value with only a warning and falls
                # back to the default, so the build stays green at 0x17.
                # Keep in sync with the board .conf set by patch 0008 (rpi_5)
                # and patch 0019 (rpi_4b).
                - "CONFIG_XEN_DOMCTL_INTERFACE_VERSION=0x00000018"
                # Enable the SoDeV guests. On rpi_4b these are rpi_4b_sodev_domu /
                # rpi_4b_sodev_doma, added by meta-xt-dom0-zephyr/0020 in
                # src/dom_cfg/rpi_4b.c (CMakeLists.txt selects
                # src/dom_cfg/${BOARD}.c, and `board:` above is rpi_4b).
                # Self-contained gate: the dom_cfg block compiles in only when
                # this is =y, so the vendored patch is never inert on a clean
                # `west update` checkout. Decoupled from DOM_CFG_AAOS_DOMAIN (the
                # upstream single-AAOS example). Also set in boards/rpi_4b.conf.
                - "CONFIG_DOM_CFG_SODEV=y"
              target_images:
                - "%{ZEPHYR_DOM0_BUILD_DIR}/zephyr/zephyr.bin"
              # No additional_deps on the DomD kernel. An earlier version listed
              # %{DOMD_BUILD_DIR}/.../Image.gz "because Zephyr Dom0 embeds/loads the
              # DomD kernel", which is not true in this topology: BUILTIN_IMAGES is
              # off so nothing is embedded, DomD is dom0less (U-Boot boot module), and
              # p1 carries the uncompressed Image, not Image.gz. The file happens to
              # exist so ninja did not fail — it just serialised a 230 KB Dom0 behind
              # DomD's whole 6.5 GiB rootfs.
        images:
          full:
            partitions:
              boot:
                items:
                  # [Zephyr Dom0] load zephyr.bin as dom0 (boot.scr selects it).
                  "zephyr.bin": "%{ZEPHYR_DOM0_DIR}/%{ZEPHYR_DOM0_BUILD_DIR}/zephyr/zephyr.bin"
    linux:
      overrides:
        variables:
          DOM0_OS: "linux"
          # DomU-kernel additional_dep (see the zephyr flavour). The linux dom0 is a
          # yocto builder with build-dir=%{YOCTOS_WORK_DIR}, and moulin JOINS
          # additional_deps onto build-dir, so this variant MUST NOT carry the
          # %{YOCTOS_WORK_DIR}/ prefix (else it doubled to yocto/yocto/build-domu/...).
          # Resolves (after the join) to yocto/build-domu/.../Image.
          DOM0_DOMU_KERNEL_DEP: "%{DOMU_BUILD_DIR}/tmp/deploy/images/%{DOMU_MACHINE}/Image"
        components:
          # Linux thin control domain body (the former base dom0 body).
          dom0:
            build-dir: "%{YOCTOS_WORK_DIR}"
            sources:
              - *COMMON_YOCTO_SOURCES
              # [wrynose] meta-raspberrypi has no wrynose branch yet; master is on
              # Linux 6.18. Pin master 6d81e22c: its linux-raspberrypi_6.18.bb =
              # LINUX_VERSION 6.18.33 / SRCREV 95b85bebbe (byte-identical to our
              # hand-ported kernel), so the stock recipe replaces the hand-host recipe.
              - type: git
                url: "https://git.yoctoproject.org/meta-raspberrypi"
                rev: &META_RPI_REV "6d81e22c38ce5ec10ea90b4d938be3044222447d"
              # meta-xt-rpi4 (this port's board layer) referenced by path in `layers`.
            builder:
              type: yocto
              work_dir: "%{DOM0_BUILD_DIR}"
              conf:
                - *LINUX_DOMAIN_CONF
                - [MACHINE, "%{MACHINE}"]
                - [RPI_SOC_FAMILY, "%{SOC_FAMILY}"]
                - [XT_DOM_NAME, "dom0"]
                - [DOM0_OS, "linux"]
                # [fullmetavirt] meta-xt-domu is shared (DomU guest recipes + the
                # Dom0-side xt-xen-cfg-domu). In build-dom0 the DomU guest apps must
                # not be parsed: cluster-refgui inherits qt6-cmake from meta-qt6, only
                # in the domu build. Mask the DomU-guest recipes; xt-xen-cfg-domu is
                # kept but ENABLE_DOMU-gated (below) so a guest-less Dom0 does not ship it.
                - [BBMASK, "meta-xt-domu/recipes-agl/"]
                # [ENABLE_DOMU gate] see rpi5-image-xt-dom0-thin.bbappend: install
                # xt-xen-cfg-domu into the Dom0 rootfs only when a DomU is built.
                - [XT_DOMU_CFG_INSTALL, "%{XT_DOMU_CFG_INSTALL}"]
                # [ENABLE_DOMZ gate] In THIS flavour Dom0 owns the xl toolstack,
                # so it is Dom0's rootfs that needs domz.cfg +
                # xl-create-domz.service. Both this conf and the domd one set the
                # two DomZ variables because meta-xt-domz is parsed by both
                # builds; a variable read by a shared layer but set in only one
                # component conf is the ExpansionError the DOMD_CAN_TYPE /
                # XEN_DT_SCMI entries below document.
                - [XT_DOMZ_CFG_INSTALL, "%{XT_DOMZ_CFG_INSTALL}"]
                # [V4H-style DomA gate] meta-xt-doma is always in `layers` (like the
                # V4H prod-devel-rcar4 yaml); ENABLE_ANDROID=no masks ALL its recipes
                # instead (%{XT_DOMA_BBMASK} = " meta-xt-common/meta-xt-doma/"), the
                # same mechanism as V4H's `BBMASK doma.bb*`. =yes expands to "".
                - [BBMASK:append, "%{XT_DOMA_BBMASK}"]
                # Required by the shared meta-xt-rpi4 linux-raspberrypi bbappend: its
                # SRC_URI:append references CAN_DT_NAME=...-can-${DOMD_CAN_TYPE}; if
                # DOMD_CAN_TYPE is unset the inline-python SRC_URI fails to expand
                # (ExpansionError). Match the domd component.
                - [DOMD_CAN_TYPE, "%{DOMD_CAN_TYPE}"]
                # NOTE(2026-07-26): XT_DEVICE_TREES has NO consumer anywhere in the
                # vendored layers or the fetched ones — grep finds only these two
                # writes. It is kept because the upstream xen-troops recipes read it
                # and dropping it would diverge from them for no gain; do not add
                # logic that depends on it without first adding a reader.
                - [XT_DEVICE_TREES, "%{XT_XEN_DTBO_NAME}"]
                # NOT SET on this board, unlike rpi5-sodev.yaml: [XEN_DT_SCMI, ...].
                # BCM2711 has no SCMI, so there is no bcm2711-*-xen-scmi.dtso to name.
                # The recipe side had to change to match: meta-xt-driver-domain's
                # linux-raspberrypi_6.18.bbappend used to add the five SCMI/WiFi .dtso
                # entries to SRC_URI unconditionally, which made do_fetch look for
                # bcm2711-raspberrypi4-64-domd-scmi.dtso and fail the parse. They are
                # now scoped to :raspberrypi5 there.
                # [Case-C] Select the Xen 4.22 recipes (xen_4.22.bb / xen-tools_4.22.bb,
                # SRCREV d45d5687f1, branch stable-4.22). [4.22] These are INTERIM
                # LOCAL recipes in meta-xt-common/meta-xt-domx (shared by both board
                # products) -- meta-virtualization master stops at 4.21.
                # instead of the xen-troops fork _git recipe. The RPi5 delta is carried
                # as a file:// patch series in the project bbappends.
                - [PREFERRED_VERSION_xen, "4.22.0+stable"]
                - [PREFERRED_VERSION_xen-tools, "4.22+stable"]
                # [Case-C] fork-specific SRC_URI:remove:pn-xen-tools no longer needed.
                - [PREFERRED_VERSION_u-boot, "2024.04"]
                - [PREFERRED_VERSION_linux-raspberrypi, "6.18.%"]
                # [rpi4 G0 fix] Force the RPi kernel provider, and cancel the SD-image
                # fstype that comes with it.
                #
                # ROOT CAUSE (RPi4-only, which is why the RPi5 reference yaml has no such
                # line): meta-virtualization/conf/layer.conf appends `meta-virt-xen-cfg` to
                # USER_CLASSES; that class does
                #   include ${@bb.utils.contains("DISTRO_FEATURES","xen","${META_VIRT_XEN_CONFIG_PATH}","",d)}
                # -> conf/distro/include/meta-virt-xen.inc, which in turn does
                #   include ${@bb.utils.contains("MACHINE","raspberrypi4-64", <xen-rpi4 inc> ,"",d)}
                # -> dynamic-layers/raspberrypi/conf/distro/include/xen-raspberrypi4-64.inc.
                # That file exists ONLY for raspberrypi4-64 (there is no rpi5 counterpart), and
                # line 22 of it reads:
                #   # Override the meta-raspberrypi default kernel preference
                #   PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
                # `?=` is applied at parse time, while meta-raspberrypi's
                # rpi-default-providers.inc only offers a WEAK `??= "linux-raspberrypi"` that
                # bitbake resolves at the END of parsing. The `?=` therefore lands first and the
                # weak default is discarded, so the build died with
                #   ERROR: Nothing PROVIDES 'virtual/kernel'
                #   linux-raspberrypi PROVIDES virtual/kernel but was skipped: Set
                #     PREFERRED_PROVIDER_virtual/kernel to linux-raspberrypi to enable it
                # (that message is linux-yocto.inc's guard, which linux-raspberrypi.inc requires).
                # A STRONG assignment here outranks `?=`/`??=` irrespective of parse order.
                - ["PREFERRED_PROVIDER_virtual/kernel", "linux-raspberrypi"]
                # Same file, lines 8-9: IMAGE_CLASSES += sdcard_image-rpi and IMAGE_FSTYPES +=
                # rpi-sdimg. This design does not use meta-raspberrypi's SD-image class - the
                # partition layout comes from moulin's own p1/p2 image lists - and
                # do_image_rpi_sdimg carries [recrdeps] = "do_build", which would pull the whole
                # recursive dependency closure into an image nobody consumes. Cancel both so the
                # RPi4 build produces exactly the artifact set the RPi5 reference does.
                - ["IMAGE_FSTYPES:remove", "rpi-sdimg"]
                - ["IMAGE_CLASSES:remove", "sdcard_image-rpi"]
                # Same file, line 25: PREFERRED_PROVIDER_u-boot-default-script ?=
                # "xen-rpi-u-boot-scr" (meta-virtualization's own generic Xen-on-RPi4 boot
                # script). meta-raspberrypi's u-boot_%.bbappend adds
                # DEPENDS:append:rpi = " u-boot-default-script", so anything that builds u-boot
                # in THIS build directory would pull in that upstream script instead of this
                # design's xt-rpi-u-boot-scr (dom0less DomD module list, static-mem map, Xen
                # bootargs). The domd component already pins it; pin it here too so both RPi4
                # build dirs agree. meta-xt-rpi4 is in this component's layer set, so the
                # recipe is available and its COMPATIBLE_MACHINE (^raspberrypi4-64$) matches.
                - [PREFERRED_PROVIDER_u-boot-default-script, "xt-rpi-u-boot-scr"]
                - [DISTRO_FEATURES:append, " xen"]
                # dom0-thin IMAGE_INSTALLs xen-tools-flask (XSM subpackage); force XSM.
                - ["PACKAGECONFIG:append:pn-xen-tools", " xsm"]
                - ["PACKAGECONFIG:append:pn-xen", " xsm"]
              build_target: "rpi5-image-xt-dom0-thin"
              layers:
                - *COMMON_YOCTO_LAYERS
                - "../meta-raspberrypi"
                - "../meta-openembedded/meta-perl"
                # [fullmetavirt] consolidated meta-xt-* layers (ws-vendored). meta-xt-rpi4
                # carries the Xen 4.22 bbappend + patch series, the shared
                # linux-raspberrypi_6.18 DT/config bbappend, CMA/USB/DVFS rpi-config,
                # and the Xen DT overlay (built in both dom0 and domd).
                - "../../meta-rpi-sodev/meta-xt-common/meta-xt-dom0-linux"
                - "../../meta-rpi-sodev/meta-xt-common/meta-xt-driver-domain"
                - "../../meta-rpi-sodev/meta-xt-common/meta-xt-qemu"
                - "../../meta-rpi-sodev/meta-xt-common/meta-xt-security"
                - "../../meta-rpi-sodev/meta-xt-rpi4"
                # DomU integration layer: provides xt-xen-cfg-domu installed into the
                # Dom0 rootfs. DomU AGL guest recipes are BBMASK'd.
                - "../../meta-rpi-sodev/meta-xt-common/meta-xt-domu"
                # DomZ integration layer: xt-xen-cfg-domz (domz.cfg +
                # xl-create-domz.service). Installed only when
                # %{XT_DOMZ_CFG_INSTALL} is non-empty, so the layer is harmless in a
                # DomZ-less build (it carries no other recipe).
                - "../../meta-rpi-sodev/meta-xt-common/meta-xt-domz"
                # DomA integration layer. Always in layers (V4H style); under
                # ENABLE_ANDROID=no all its recipes are BBMASK'd via %{XT_DOMA_BBMASK}
                # so a DomA-less build never parses the AAOS-prebuilt SRC_URI.
                - "../../meta-rpi-sodev/meta-xt-common/meta-xt-doma"
                # NOTE: xt-prod-devel-rpi5-domd is intentionally NOT here (its DomD-only
                # SRC_URI fails to expand in the Dom0 conf; dom0-thin reuses DomD kernel).
              target_images:
                - "tmp/deploy/images/%{MACHINE}/rpi5-image-xt-dom0-thin-%{MACHINE}.rootfs.cpio.gz"
              # additional_deps are resolved relative to build-dir (= %{YOCTOS_WORK_DIR}),
              # so do NOT prefix with %{YOCTOS_WORK_DIR}.
              additional_deps:
                - "%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/Image.gz"
                # [wrynose] DomU AGL kernel dep is gated by ENABLE_DOMU=yes.
        images:
          full:
            partitions:
              boot:
                items:
                  # [Linux Dom0] the dom0-thin initramfs (rootfs) loaded as dom0.
                  "initramfs-xt-dom0-thin.cpio.gz": "%{YOCTOS_WORK_DIR}/%{DOM0_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/rpi5-image-xt-dom0-thin-%{MACHINE}.rootfs.cpio.gz"

  # DomU (AGL instrument cluster) gate. The DomU is a virtio guest VM; its kernel
  # (linux-virtio-armv8, MACHINE=virtio-armv8-xt) is a guest kernel, Yocto-version
  # independent, and builds on wrynose with the V4H-aligned minimal domu layer set
  # (meta-xt-domu + meta-xt-security; NO meta-qt6 / xt-prod-devel-rpi5-domu — see the
  # `domu` component). The yaml default is "no" (V4H prod-devel-rcar4 style: the
  # orchestrator decides); build.sh keeps ENABLE_DOMU=no by default and sets it
  # to "yes" only when the V4H-style `-u`/`--domu` flag is passed — so the plain
  # `./build.sh` is DomU-less; add the DomU (p1 kernel + p3 AGL rootfs) with `-u`.
  #
  # The "yes" variant ADDS the DomU artifacts (moulin overrides can only append):
  # the dom0 component's DomU-kernel additional_dep, the p1 `linux-domu` boot item,
  # and the p3 AGL-rootfs partition. "no" builds a DomU-less SD (dom0/domd[/doma]).
  #
  # ENABLE_DOMU is defined BEFORE ENABLE_ANDROID so that, when both are "yes", moulin
  # appends the DomU p3 partition before the DomA p4 (parameters are applied in YAML
  # definition order), preserving the board-verified p3=DomU / p4=DomA SD layout.
  #
  # The p3 DomU rootfs is the AGL flutter cluster guest, built by build.sh's AGL
  # bitbake (identical provenance to the V4H AGL SoDeV); build.sh gates that step on
  # ENABLE_DOMU too.
  # ---------------------------------------------------------------------------
  # BOARD_RAM — which Raspberry Pi 4 SKU the image is for.
  # ---------------------------------------------------------------------------
  # The RPi4 firmware reports (gpu_mem=76):
  #   4 GiB SKU:  0x00000000-0x3b400000 (948 MiB) + 0x40000000-0xfc000000 (3008 MiB)
  #               = 3956 MiB. There is NO bank above 4 GiB.
  #   8 GiB SKU:  the same two + 0x100000000-0x200000000  = 8052 MiB.
  # The default map is sized for 8 GiB (DomD 1920 + Dom0 128..256 + DomU 1024 +
  # DomA 2560 + Xen 80 = 5712..5840 MiB). Dom0+DomD alone fits a 4 GiB board
  # unchanged, so 4g is not needed just to boot — it is what makes a guest fit and
  # what stops the build silently over-committing:
  #   4g:  DomD 1024 (bank2 dropped, bank0 640) + Dom0 128..256 + Xen 80
  #        = 1232..1360 MiB, leaving 2724 (zephyr) / 2596 (linux) for ONE guest.
  #        DomU 1024 fits; DomA 2560 fits ALONE; the two together (3584) do not.
  #        build.sh notes this and does not refuse -a with --ram=4g.
  # Mechanism: this only sets BOARD_RAM in the domd conf. The boot scripts carry
  # `setenv board_ram <value>` (substituted by the xt-rpi-u-boot-scr bbappend) and
  # branch on it at run time with `fdt set /chosen/domD memory|xen,static-mem`, so
  # the 4 GiB delta is a few lines in ONE file rather than a second overlay or a
  # second script. tools/check-memory-map.py validates BOTH values against Xen's
  # allocate_memory_11() placement and the real DRAM banks.
  BOARD_RAM:
    desc: "Target Raspberry Pi 4 SKU: 8g (default; all four domains up together) or 4g (DomD 1024 MiB; DomU or DomA, one at a time)"
    "8g":
      default: true
      overrides:
        variables:
          BOARD_RAM: "8g"
    "4g":
      overrides:
        variables:
          BOARD_RAM: "4g"
  ENABLE_DOMU:
    desc: "Build DomU (AGL instrument cluster) kernel + AGL rootfs and add them to the SD image (p1 kernel + p3 rootfs). yaml default no (V4H style); build.sh adds it only with -u/--domu."
    "no":
      default: true
      overrides:
        variables:
          # xt-xen-cfg-domu carries the DomU xl guest cfg AND the auto-enabled
          # xl-create-domu.service. Gate its install on ENABLE_DOMU: a guest-less
          # build (=no) must NOT ship it, or xl-create-domu fails on every boot.
          # Consumed by the DomD initramfs + dom0-thin (see their conf/recipes).
          XT_DOMU_CFG_INSTALL: ""
    "yes":
      overrides:
        variables:
          XT_DOMU_CFG_INSTALL: "xt-xen-cfg-domu"
        components:
          dom0:
            builder:
              # DomU = AGL Flutter: re-add the dependency on the Xen-aware DomU
              # kernel Image so ninja builds the domu component before dom0.
              # moulin resolves additional_deps PER BUILDER: the zephyr builder uses
              # them verbatim (workspace-root-relative), the yocto builder JOINS them
              # onto the component build-dir. The two dom0 flavours have different
              # build-dirs (zephyr / yocto), so the dep string is flavour-specific and
              # supplied via %{DOM0_DOMU_KERNEL_DEP} (set in each DOM0_OS override).
              # A single %{YOCTOS_WORK_DIR}/-prefixed string was correct for zephyr
              # but doubled to yocto/yocto/build-domu/... under the linux (yocto)
              # builder, breaking `ninja image-full --DOM0_OS linux`.
              additional_deps:
                - "%{DOM0_DOMU_KERNEL_DEP}"
        images:
          full:
            partitions:
              # p1 boot item: the DomU Xen-aware kernel Image.
              boot:
                items:
                  "linux-domu": "%{YOCTOS_WORK_DIR}/%{DOMU_BUILD_DIR}/tmp/deploy/images/%{DOMU_MACHINE}/Image"
              # p3 — DomU AGL Flutter rootfs (ext4), built by build.sh's AGL bitbake.
              domu:
                desc: "DomU AGL Flutter rootfs (ext4) as a raw partition"
                gpt_type: B921B045-1DF0-41C3-AF44-4C6F280D3FAE
                type: raw_image
                resize: false   # raw dd; AGL ext4 also carries resize2fs-1.46.5-incompatible features
                size: 2048 MiB
                image_path: "agl/build/tmp/deploy/images/%{AGL_GUEST_MACHINE}/%{AGL_GUEST_IMAGE_IC}-%{AGL_GUEST_MACHINE}.rootfs.ext4"

  # ---------------------------------------------------------------------------
  # ENABLE_DOMU_RESERVED -- keep the DomA nested GPT at SD p4 when DomU is absent.
  # ---------------------------------------------------------------------------
  # The guest configs address the SD by fixed device node, not by partlabel
  # (doma.cfg's qemu -drive opens /dev/mmcblk0p4, domd.cfg passes p3 and p4 to DomD
  # as xvdb/xvdc), and rouge numbers partitions in YAML declaration order. So
  # ENABLE_ANDROID=yes with ENABLE_DOMU=no used to put the DomA nested GPT at p3,
  # where nothing looks for it -- which is why build.sh refused that combination
  # outright and a 4 GiB board had to ship BOTH guests and pick one at run time.
  #
  # This parameter closes that hole from the layout side: "yes" inserts an EMPTY
  # 8 MiB partition where DomU's rootfs would have been, so DomA keeps p4 without a
  # DomU being built at all. Declared BETWEEN ENABLE_DOMU and ENABLE_ANDROID because
  # moulin applies parameters in definition order: DomU's p3 (when present), then
  # this filler (when DomU is absent), then DomA's p4.
  #
  # Never set both this and ENABLE_DOMU to "yes": that would push DomA to p5.
  # build.sh derives the value (yes only when ENABLE_ANDROID=yes and ENABLE_DOMU=no)
  # and rejects the contradiction; a direct moulin/rouge invocation bypasses that,
  # exactly as it bypasses the other layout guards described at the partition list.
  ENABLE_DOMU_RESERVED:
    desc: "Reserve an empty SD p3 in place of the DomU rootfs so the DomA nested GPT stays at p4 in a DomU-less build. Derived by build.sh; do not set by hand."
    "no":
      default: true
      overrides:
        variables:
          # No layout change. The variable exists so the parameter has a body and so
          # the value is visible in the generated build.ninja for a DomU-less debug.
          XT_SD_P3: "domu-rootfs-or-absent"
    "yes":
      overrides:
        variables:
          XT_SD_P3: "reserved-empty"
        images:
          full:
            partitions:
              # p3 -- placeholder only. Deliberately `empty` (zeroed, no filesystem)
              # and tiny: it exists to hold the partition NUMBER, and anything that
              # looked like a rootfs here would invite a boot attempt. domd.cfg's
              # `phy:/dev/mmcblk0p3, xvdb, w` still attaches, harmlessly, to 8 MiB of
              # zeros -- with no DomU there is no device model that opens xvdb.
              reserved:
                desc: "Reserved (empty): holds p3 so the DomA nested GPT stays p4 in a DomU-less image"
                gpt_type: 8DA63339-0007-60C0-C436-083AC8230908
                type: empty
                size: 8 MiB

  # DomA (AAOS) is assembled directly by rouge as a nested GPT (true V4H
  # android_only style) from the doma component's AOSP outputs — there is no
  # prebuilt combined-disk input anymore. ENABLE_ANDROID=yes adds it as the full
  # SD image's p4; =no omits p4 (DomA-less SD).
  ENABLE_ANDROID:
    desc: "Build Android (AAOS) as a guest VM and add it as the full SD image p4 (nested GPT)"
    # V4H-style gate (prod-devel-rcar4_new.yaml ENABLE_ANDROID): the meta-xt-doma
    # layer is ALWAYS in the dom0(linux)/domd layers; "no" masks all its recipes
    # via %{XT_DOMA_BBMASK} (the V4H `BBMASK doma.bb*` mechanism) so a DomA-less
    # build never parses the AAOS-prebuilt SRC_URI, and every DomA artifact
    # consumer (the p1 aaos boot items, the domd aaos target_images, the p4
    # android sub-image) lives in the "yes" overrides below. The default is "no",
    # following upstream sodev-demo-workspace f3f0f8f7 ("Disable Android and
    # Flatcar guests by default" — build time/storage); enable with
    # ENABLE_ANDROID=yes (build.sh) / --ENABLE_ANDROID yes (moulin).
    "no":
      default: true
      overrides:
        variables:
          # Three paths, not one: meta-xt-rpi4 carries bbappends on TWO masked
          # recipes -- xt-xen-cfg-doma (raises DomA's `memory` for the 4 GiB budget)
          # and xt-aaos-host-services (widens COMPATIBLE_MACHINE to raspberrypi4-64)
          # -- and a
          # bbappend whose recipe has been masked is a HARD bitbake error --
          #   ERROR: No recipes in default available for: .../xt-xen-cfg-doma_%.bbappend
          # not a warning. So the RPi4-side append has to be masked by the same gate
          # that masks the recipe. BBMASK is a whitespace-separated list of regexes
          # matched against the file path, so appending a second fragment is enough.
          # (BBFILES_DYNAMIC cannot be used here: the meta-xt-doma LAYER is always
          # present -- only its recipes are masked -- so there is no absent
          # collection to key on.)
          XT_DOMA_BBMASK: " meta-xt-common/meta-xt-doma/ meta-xt-rpi4/recipes-extended/xt-xen-cfg-doma/ meta-xt-rpi4/recipes-extended/xt-aaos-host-services/"
    "yes":
      overrides:
        variables:
          XT_DOMA_BBMASK: ""
        components:
          domd:
            # The AAOS guest kernel/ramdisk are deployed by the DomD bitbake
            # (meta-xt-doma's rpi5-image-xt-domd-v4h.bbappend pulls
            # aaos-guest-binaries:do_deploy for BOTH Dom0 flavours) — declare
            # them as domd outputs so the p1 aaos boot items below have a
            # producing rule. NOTE: target_images lives under builder: (the
            # yocto builder reads builder.target_images); a component-level
            # domd.target_images is a dead key that moulin silently ignores.
            builder:
              target_images:
                - "tmp/deploy/images/%{MACHINE}/aaos-android-kernel"
                - "tmp/deploy/images/%{MACHINE}/aaos-vendor-boot-ramdisk"
        images:
          full:
            partitions:
              # p1 aaos boot items — the AAOS guest kernel/ramdisk, sourced from
              # the DomD deploy (single flavour-independent producer).
              boot:
                items:
                  "aaos-android-kernel":      "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/aaos-android-kernel"
                  "aaos-vendor-boot-ramdisk": "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/aaos-vendor-boot-ramdisk"
              # p4 — DomA AAOS as a nested GPT, assembled by rouge from the doma
              # component's AOSP outputs (V4H android_only style). Only the six
              # images RPi5 AOSP actually produces are referenced (NO
              # vbmeta_system* / vbmeta_vendor_dlkm* / rpmbemul / vendor_dlkm).
              # Partition keys become GPT labels -> AAOS by-name resolution.
              android: &ANDROID_IMAGE
                desc: "Android sub-image (separate virtio block device for the AAOS VM)"
                gpt_type: A326898F-C893-4A64-9990-6F6B7BFDEF18
                type: gpt
                partitions:
                  boot_a:
                    gpt_type: 49A4D17F-93A3-45C1-A0DE-F50B2EBE2599
                    type: raw_image
                    resize: false
                    image_path: "%{DOMA_DIR}/out/target/product/%{ANDROID_DEVICE}/boot.img"
                  boot_b:
                    gpt_type: 20117F86-E985-4357-B9EE-374BC1D8487D
                    type: empty
                    size: 70 MiB
                  init_boot_a:
                    gpt_type: 49A4D17F-93A3-45C1-A0DE-F50B2EBE2599
                    type: raw_image
                    resize: false
                    image_path: "%{DOMA_DIR}/out/target/product/%{ANDROID_DEVICE}/init_boot.img"
                  init_boot_b:
                    gpt_type: 20117F86-E985-4357-B9EE-374BC1D8487D
                    type: empty
                    size: 10 MiB
                  vendor_boot_a:
                    gpt_type: DF24E5ED-8C96-4B86-B00B-79667DC6DE11
                    type: raw_image
                    resize: false
                    image_path: "%{DOMA_DIR}/out/target/product/%{ANDROID_DEVICE}/vendor_boot.img"
                  vendor_boot_b:
                    gpt_type: 7C29D3AD-78B9-452E-9DEB-D098D542F092
                    type: empty
                    size: 70 MiB
                  vbmeta_a:
                    gpt_type: 19A710A2-B3CA-11E4-B026-10604B889DCF
                    type: raw_image
                    resize: false
                    image_path: "%{DOMA_DIR}/out/target/product/%{ANDROID_DEVICE}/vbmeta.img"
                  vbmeta_b:
                    gpt_type: 19A710A2-B3CA-11E4-B026-10604B889DCF
                    type: empty
                    size: 1 MiB
                  misc:
                    gpt_type: EF32A33B-A409-486C-9141-9FFB711F6266
                    type: empty
                    filled: zeroes
                    size: 1 MiB
                  metadata:
                    gpt_type: 20AC26BE-20B7-11E3-84C5-6CFDB94711E9
                    type: ext4
                    size: 20 MiB
                  super:
                    gpt_type: 4627AE27-CFEF-48A1-88FE-99C3509ADE26
                    type: android_sparse
                    # size omitted (V4H style): rouge sizes the partition to the
                    # unsparsed image. A fixed `size:` equal to the current unsparse
                    # size (7.0 GiB) would leave zero margin and break the build the
                    # moment AOSP grows super/userdata by a byte.
                    image_path: "%{DOMA_DIR}/out/target/product/%{ANDROID_DEVICE}/super.img"
                  userdata:
                    gpt_type: 1B81E7E6-F50D-419B-A739-2AEEF8DA3335
                    type: android_sparse
                    image_path: "%{DOMA_DIR}/out/target/product/%{ANDROID_DEVICE}/userdata.img"

  # ---------------------------------------------------------------------------
  # DomZ (Zephyr guest) gate — the RTOS domain.
  # ---------------------------------------------------------------------------
  # Same idiom as ENABLE_DOMU/ENABLE_ANDROID: yaml default "no" (the orchestrator
  # decides), build.sh turns it on with --domz. "yes" adds
  #   - the p1 boot item zephyr-domz.bin (which is also what pulls the `domz`
  #     component into the ninja graph), and
  #   - xt-xen-cfg-domz (domz.cfg + xl-create-domz.service) into the rootfs of
  #     whichever domain runs the toolstack: DomD in the zephyr flavour, Dom0 in
  #     the thin-Linux one. Both component confs read %{XT_DOMZ_CFG_INSTALL}, so a
  #     guest-less build never ships the service (it would fail on every boot).
  # NO new partition: DomZ runs entirely out of the 16 MiB Xen gives it, so the
  # board-verified p2=DomD / p3=DomU / p4=DomA layout is untouched.
  #
  # Placed AFTER ENABLE_ANDROID so that, whatever the flag combination, the p3
  # (DomU) and p4 (DomA) partitions are still appended in that order.
  ENABLE_DOMZ:
    desc: "Build DomZ (Zephyr as an unprivileged DomU) and add it to the SD image (p1 zephyr-domz.bin + the DomZ xl cfg). yaml default no; build.sh adds it with --domz."
    "no":
      default: true
      overrides:
        variables:
          XT_DOMZ_CFG_INSTALL: ""
    "yes":
      overrides:
        variables:
          XT_DOMZ_CFG_INSTALL: "xt-xen-cfg-domz"
        images:
          full:
            partitions:
              boot:
                items:
                  "zephyr-domz.bin": "%{ZEPHYR_DOMZ_DIR}/%{ZEPHYR_DOMZ_BUILD_DIR}/zephyr/zephyr.bin"

components:
  # =========================================================================
  # Dom0 / DomD — RPi5 base, copied verbatim from external/meta-xt-prod-devel-rpi5/rpi5.yaml.
  # =========================================================================
  # Dom0 has two variants per upstream.txt (Dom0 Linux deviates from upstream):
  #   main branch       = Zephyr Dom0 (RPi5 upstream policy)
  #   linux-dom0 branch = Linux thin control domain (THIS — our verified Plan-B config).
  # rpi5-image-xt-dom0-thin is NOT in upstream rpi5.yaml (built manually in a standalone
  # bitbake build); MACHINE=raspberrypi5 and the layer set below are taken verbatim from
  # that verified bblayers. Layer paths remapped to the meta-xt-prod-devel-rpi5 submodule.
  # dom0 is an EMPTY base: the DOM0_OS parameter (see `parameters:` above) supplies
  # the entire dom0 body (build-dir + sources + builder) for the selected OS, because
  # the Linux (git source + yocto builder) and Zephyr (west source + zephyr builder)
  # bodies are fully disjoint and moulin overrides can only merge/append, never swap a
  # scalar builder-type or delete keys. `build-dir` is a placeholder scalar (a variant
  # replaces it via scalar-override); `sources: []` / `builder: {}` are empty so a
  # variant's full sources-sequence / builder-mapping merge cleanly onto them. DOM0_OS
  # defaults to zephyr; --DOM0_OS linux selects the Linux thin control domain instead.
  # `default: true` is kept here so the dom0 component is in the default build graph.
  dom0:
    default: true
    build-dir: "%{YOCTOS_WORK_DIR}"
    sources: []
    builder: {}

  domd:
    build-dir: "%{YOCTOS_WORK_DIR}"
    sources:
      - *COMMON_YOCTO_SOURCES
      # [wrynose] see dom0: meta-raspberrypi master 6d81e22c (Linux 6.18.33 stock);
      # meta-xt-rpi4 is this port's board layer, referenced via `layers`.
      - type: git
        url: "https://git.yoctoproject.org/meta-raspberrypi"
        rev: *META_RPI_REV
      # meta-clang: required by google-trout-agl-services (TOOLCHAIN = "clang").
      # The trout host-service sources are written against Android's toolchain and
      # their -Wno-error list is clang diagnostic names, so gcc is not a drop-in.
      # Pinned to the wrynose branch tip: upstream keeps one branch per Yocto series,
      # and the scarthgap tip the V4H SoDeV pins would be rejected by the
      # LAYERSERIES_COMPAT check in this build.
      - type: git
        url: "https://github.com/kraj/meta-clang"
        rev: "ef0d22f21910a0c30c967eeb17d8f209806e2d81"
    builder:
      type: yocto
      work_dir: "%{DOMD_BUILD_DIR}"
      conf:
        - *LINUX_DOMAIN_CONF
        - [MACHINE, "%{MACHINE}"]
        - [RPI_SOC_FAMILY, "%{SOC_FAMILY}"]
        - [XT_DOM_NAME, "domd"]
        - [XT_DEVICE_TREES, "%{XT_XEN_DTBO_NAME}"]
        - [DOM0_OS, "%{DOM0_OS}"]
        # Board SKU for the boot script's `setenv board_ram` (see the BOARD_RAM
        # parameter). Only the domd component needs it: xt-rpi-u-boot-scr is built
        # there and nothing else varies with the SKU.
        - [BOARD_RAM, "%{BOARD_RAM}"]
        # aaos-guest-binaries derives the DomA kernel/ramdisk from the AOSP product out
        # tree, whose directory name is the PRODUCT_DEVICE. Pass it rather than let the
        # recipe default point at the upstream device this board never builds.
        - [AAOS_DEVICE, "%{ANDROID_DEVICE}"]
        # aaos-guest-binaries-derive.inc defaults these to the historical
        # <workspace>/android and <workspace>/android_kernel. This board checks the
        # trees out under the DOMA_DIR / ANDROID_KERNEL_DIR names above, so pass the
        # same names here -- otherwise do_compile looks for unpack_bootimg.py in a
        # directory that does not exist (found by the clean-room cold build).
        - [AAOS_SRC_TREE, "${TOPDIR}/../../%{DOMA_DIR}"]
        - [AAOS_KERNEL_TREE, "${TOPDIR}/../../%{ANDROID_KERNEL_DIR}"]
        # The AOSP build reads the guest kernel from a copy inside its own checkout
        # (Soong will not take a path outside the tree), and that copy is made by a
        # script, not by a ninja edge, so it can go stale without the graph noticing.
        # Pass the directory name so aaos-guest-binaries can compare that copy against
        # the kernel it is about to put on p1 -- if they differ, p4's vendor_dlkm and
        # p1's kernel come from different builds and module_layout disagrees.
        - [AAOS_KERNEL_STAGE_DIR, "%{ANDROID_KERNEL_STAGE_DIR}"]
        # [Case-C] Select the Xen 4.22 recipes (INTERIM LOCAL, in meta-xt-domx); the
        # RPi5 delta is carried as a file:// patch series in the project
        # bbappends (meta-xt-rpi4/.../xen_4.22.bbappend +
        # meta-xt-dom0-linux/.../xen-tools_4.22.bbappend).
        - [PREFERRED_VERSION_xen,"4.22.0+stable"]
        - [PREFERRED_VERSION_xen-tools, "4.22+stable"]
        # [Case-C] fork-specific SRC_URI:remove:pn-xen-tools dropped (stock
        # xen-tools_4.22.bb does not require the xen-source.inc chain that
        # appended those patches). See the dom0 component comment.
        - [PREFERRED_VERSION_u-boot, "2024.04"]
        # Not set on this board: [XEN_DT_SCMI, ...]. No SCMI on BCM2711.
        - [PREFERRED_VERSION_linux-raspberrypi, "6.18.%"]
        # [rpi4 G0 fix] Force the RPi kernel provider, and cancel the SD-image
        # fstype that comes with it.
        #
        # ROOT CAUSE (RPi4-only, which is why the RPi5 reference yaml has no such
        # line): meta-virtualization/conf/layer.conf appends `meta-virt-xen-cfg` to
        # USER_CLASSES; that class does
        #   include ${@bb.utils.contains("DISTRO_FEATURES","xen","${META_VIRT_XEN_CONFIG_PATH}","",d)}
        # -> conf/distro/include/meta-virt-xen.inc, which in turn does
        #   include ${@bb.utils.contains("MACHINE","raspberrypi4-64", <xen-rpi4 inc> ,"",d)}
        # -> dynamic-layers/raspberrypi/conf/distro/include/xen-raspberrypi4-64.inc.
        # That file exists ONLY for raspberrypi4-64 (there is no rpi5 counterpart), and
        # line 22 of it reads:
        #   # Override the meta-raspberrypi default kernel preference
        #   PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
        # `?=` is applied at parse time, while meta-raspberrypi's
        # rpi-default-providers.inc only offers a WEAK `??= "linux-raspberrypi"` that
        # bitbake resolves at the END of parsing. The `?=` therefore lands first and the
        # weak default is discarded, so the build died with
        #   ERROR: Nothing PROVIDES 'virtual/kernel'
        #   linux-raspberrypi PROVIDES virtual/kernel but was skipped: Set
        #     PREFERRED_PROVIDER_virtual/kernel to linux-raspberrypi to enable it
        # (that message is linux-yocto.inc's guard, which linux-raspberrypi.inc requires).
        # A STRONG assignment here outranks `?=`/`??=` irrespective of parse order.
        - ["PREFERRED_PROVIDER_virtual/kernel", "linux-raspberrypi"]
        # Same file, lines 8-9: IMAGE_CLASSES += sdcard_image-rpi and IMAGE_FSTYPES +=
        # rpi-sdimg. This design does not use meta-raspberrypi's SD-image class - the
        # partition layout comes from moulin's own p1/p2 image lists - and
        # do_image_rpi_sdimg carries [recrdeps] = "do_build", which would pull the whole
        # recursive dependency closure into an image nobody consumes. Cancel both so the
        # RPi4 build produces exactly the artifact set the RPi5 reference does.
        - ["IMAGE_FSTYPES:remove", "rpi-sdimg"]
        - ["IMAGE_CLASSES:remove", "sdcard_image-rpi"]
        # meta-xt-qemu provides the xen-troops qemu 7.0.0-xt (xenpv machine +
        # GPEX/pcie.0 + multi-vcpu + the 0110 virtio-pci IOREQ ISR fix) — the
        # device-model qemu that libxl's `xl devd` spawns for DomU/DomA. Without
        # this pin bitbake resolves the higher poky qemu (8.2.7), whose mainline
        # hw/arm/xen_arm.c machine is "xenpvh" with max_cpus=1 and NO pcie.0, so the
        # device-model dies ("unsupported machine type" → "Invalid SMP CPUs" →
        # "Bus 'pcie.0' not found") and no DomU/DomA virtio surface is created.
        # Same class of mis-resolve as the xen-tools 4.17 issue above.
        - [PREFERRED_VERSION_qemu, "7.0.0"]
        # Remove the venus (Vulkan/V3DV) backend from virglrenderer to match a pure-GL
        # configuration. The known-working image did not link libvulkan = venus was disabled.
        # This demo's guests (AGL flutter cluster / AAOS) use only GLES-on-virgl and do not
        # use the Vulkan path, so venus is not needed — cancel the venus that poky's vulkan
        # DISTRO_FEATURE enables, to get the same pure-GL virglrenderer as the known-working
        # image. (Note: this line is NOT a fix for the V3D-D0 rendering hang #316/#319 = a
        # separate issue.)
        - ["PACKAGECONFIG:remove:pn-virglrenderer", "venus"]
        # wrynose upgrade (Phase 3a): the self-built mesa 24.2.7 / libdrm 2.4.123 /
        # wayland-protocols 1.37 recipes and their PREFERRED_VERSION pins are
        # removed. wrynose oe-core ships mesa 26.0.5 / libdrm 2.4.131 /
        # wayland-protocols 1.47, which already include the BCM2712 D0 (V3D 7.1.10)
        # shader-state packet-shuffle support that 24.2.7 was pinned for, so the
        # pins are obsolete. The 24.2.7 recipes were dropped (not disabled -- there
        # are no .bb.disabled files in-tree); re-enabling them as a Phase4 V3D-D0
        # regression fallback (if mesa 26 regresses on D0) would mean re-vendoring
        # the 24.2.7 mesa/libdrm/wayland-protocols recipes.
        # RPI specific
        - [ENABLE_UART, "1"]
        - [RPI_USE_U_BOOT, "1"]
        - [PREFERRED_PROVIDER_u-boot-default-script, "xt-rpi-u-boot-scr"]
        - [UART_BOOTLOADER, "1"]
        - [KERNEL_IMAGETYPE_UBOOT, "Image"]
        - [DISTRO_FEATURES:append, " xen"]
        # V4H domd-v4h needs: wayland/opengl (weston REQUIRED_DISTRO_FEATURES=wayland
        # + mesa/virglrenderer GL), enable_virtio (gates the qemu-system-aarch64 +
        # vhost-net IMAGE_INSTALL in domd-v4h.bb), vmsep (qemu-package-split so
        # qemu-system-aarch64 is its own package). the reference build set these in local.conf;
        # moulin writes component conf to moulin.conf so they must be declared here.
        - [DISTRO_FEATURES:append, " opengl wayland pam enable_virtio vmsep"]
        # G-3 V3D atomic page-flip workaround:
        #   cma=256M    : larger contiguous pool so V3D + VC4 can share
        #                 dma-buf without bounce
        #   swiotlb=force: every DMA goes through the bounce buffer,
        #                 stops V3D-rendered buffers being scanned out
        #                 from V3D-private pages VC4 cannot reach
        #   coherent_pool=64M : DMA coherent pool for non-cacheable maps
        #   iommu.passthrough=1 : skip IOMMU translation (RPi5/Xen has no
        #                 working IOMMU for guest DMA today)
        # cma=192M (effective): contiguous pool for V3D dma-buf transit.
        # CORRECTED(rpi4 2026-07-26): this block used to say "cma=128M" and "the
        # xen-troops dom0less DomD memory bank is 512 MiB". Both numbers were
        # wrong for this port. The real values, from the files themselves:
        #   * cma=192M in BOTH meta-xt-rpi4 boot.cmd.xen.{linux,zephyr}-dom0.in;
        #   * DomD memory = 1920 MiB, as `memory = <0x0 0x1e0000>` (KiB) in
        #     bcm2711-raspberrypi4-64-xen.dtso, backed by three static-mem banks
        #     (1 GiB @0x40000000 + 384 MiB @0x08000000 + 512 MiB @0x80000000).
        # So the 192 MiB pool is ~10% of DomD memory, not 25%. Don't push higher
        # without raising DomD memory or weston/qemu OOMs.
        # NOTE: the effective DomD cmdline (incl. this cma= value) is hard-coded in
        # the STATIC boot.cmd template (meta-xt-rpi4 xt-rpi-u-boot-scr
        # boot.cmd.xen.{zephyr,linux}-dom0.in, where cma=192M actually lives), NOT
        # in the DOMD_BOOTARGS below -- which is inert here (see the
        # DOMD_ROOTFS_DEV note in the variables block). Edit the .in template to
        # change the real value. tools/check-memory-map.py prints the authoritative
        # bank list and total.
        # Avoid swiotlb=force / iommu.passthrough=1 — those broke
        # v3d clock probe in 2026-05-06 testing.
        # 5/7 verbose: drop `quiet`, raise loglevel + ignore_loglevel +
        # printk.devkmsg=on to surface vc4_hdmi probe error messages that
        # were suppressed by audit rate-limit on previous boots.
        # 5/9 case-w: the vc_mem injection is for the new EEPROM (case-u), so revert it
        # when booting on the old EEPROM environment (to keep compatibility).
        - [DOMD_BOOTARGS, "console=ttyAMA0 earlycon=xen earlyprintk=xen clk_ignore_unused root=%{DOMD_ROOTFS_DEV} rootfstype=ext4 rootwait loglevel=8 ignore_loglevel printk.devkmsg=on no_console_suspend"]
        - [DOMD_CAN_TYPE, "%{DOMD_CAN_TYPE}"]
        # meta-xt-domu is now in this build's layers (xt-xen-cfg-domu
        # for the DomD toolstack); mask its DomU guest-side recipes like the dom0
        # build does.
        - [BBMASK, "meta-xt-domu/recipes-agl/"]
        # [ENABLE_DOMU gate] xt-xen-cfg-domu (DomU xl cfg + the auto-enabled
        # xl-create-domu.service) is installed into the DomD initramfs only when a
        # DomU is built. ENABLE_DOMU=no => "" so a guest-less build never ships the
        # service (it would fail every boot). Consumed by rpi5-image-xt-domd-vc4-initramfs.
        - [XT_DOMU_CFG_INSTALL, "%{XT_DOMU_CFG_INSTALL}"]
        # [ENABLE_DOMZ gate] Same for DomZ (Zephyr guest): in the zephyr flavour
        # DomD is the toolstack domain, so domz.cfg + xl-create-domz.service go
        # into the DomD rootfs. Set in the dom0(linux) conf as well —
        # meta-xt-domz is in both layer sets.
        - [XT_DOMZ_CFG_INSTALL, "%{XT_DOMZ_CFG_INSTALL}"]
        - [BBMASK:append, "%{XT_DOMA_BBMASK}"]
      build_target: "%{XT_DOMD_IMAGE}"
      layers:
        - *COMMON_YOCTO_LAYERS
        - "../meta-raspberrypi"
        - "../meta-openembedded/meta-perl"
        # [fullmetavirt] consolidated meta-xt-* layers (ws-vendored single source).
        # meta-xt-rpi4 carries the Xen 4.22 bbappend + patch series, the shared
        # linux-raspberrypi_6.18 DT/config bbappend, CMA/USB/DVFS rpi-config, and
        # the bcm2712-raspberrypi5-xen DT overlay. meta-xt-driver-domain carries
        # the DomD kernel body + V4H kernel/mesa/weston/qemu bbappends + all the
        # DomD recipes/images (formerly meta-rpi5-domd + linux-dom0-poc DomD half).
        - "../../meta-rpi-sodev/meta-xt-common/meta-xt-driver-domain"
        - "../../meta-rpi-sodev/meta-xt-common/meta-xt-security"
        - "../../meta-rpi-sodev/meta-xt-common/meta-xt-qemu"
        - "../../meta-rpi-sodev/meta-xt-common/meta-xt-dom0-linux"
        - "../../meta-rpi-sodev/meta-xt-rpi4"
        # xt-prod-devel-rpi5-domd is DELIBERATELY NOT HERE, unlike rpi5-sodev.yaml.
        # Its trusted-firmware-a_git.bbappend replaces SRC_URI_TRUSTED_FIRMWARE_A,
        # SRCREV_tfa and SRCBRANCH with the xen-troops arm-trusted-firmware fork's
        # rpi5_dev branch, because that fork carries the RPi5 platform and its SCMI
        # server. This board builds PLAT=rpi4 from upstream TF-A master instead
        # (meta-xt-rpi4/recipes-bsp/trusted-firmware-a/trusted-firmware-a_git.bb), so
        # letting that bbappend attach would silently swap the source tree out.
        #
        # Nothing else in that layer is needed: its include/dt_config.inc is also
        # provided by meta-xt-driver-domain, and its xt-rpi-u-boot-scr.bbappend only
        # appends SCMI overlays, which this board has none of. rpi5-image-minimal-domd
        # comes from meta-xt-rpi4, above.
        # DomU integration layer: provides xt-xen-cfg-domu
        # (domu.cfg + xl-create-domu.service), now installed into the DomD image
        # (DomD is the toolstack domain that runs xl create). The DomU AGL guest
        # recipes are BBMASK'd in conf (same mask as the dom0 build).
        - "../../meta-rpi-sodev/meta-xt-common/meta-xt-domu"
        # DomZ integration layer: xt-xen-cfg-domz (domz.cfg +
        # xl-create-domz.service), installed into the DomD rootfs because DomD is
        # the toolstack domain in the zephyr flavour. Gated by
        # %{XT_DOMZ_CFG_INSTALL}.
        - "../../meta-rpi-sodev/meta-xt-common/meta-xt-domz"
        # DomA integration layer (meta-xt-doma): stacks the vhost_xen kernel bbappend
        # on the DomD linux-raspberrypi build and installs xt-aaos-host-services
        # (VHAL/dumpstate) + domd-vhost-xen-domid into the DomD image. Always in
        # layers (V4H style); under ENABLE_ANDROID=no all its recipes are BBMASK'd
        # via %{XT_DOMA_BBMASK} so a DomA-less DomD build does not parse the
        # AAOS-prebuilt SRC_URI.
        # meta-clang: provides the clang TOOLCHAIN that google-trout-agl-services
        # (in meta-xt-doma) selects. Inert when ENABLE_ANDROID=no -- nothing else in
        # this build sets TOOLCHAIN = "clang", and that recipe is BBMASK'd anyway.
        #
        # DomD only, deliberately. The dom0(linux) builder also carries meta-xt-doma
        # (see its layers above) and therefore PARSES google-trout-agl-services, but it
        # never BUILDS it -- only the DomD image installs xt-aaos-host-services, which
        # is what RDEPENDS on it. Parsing alone is harmless: without meta-clang,
        # TOOLCHAIN = "clang" is just an unread variable. Verified on a
        # DOM0_OS=linux -a -u build: build-dom0/tmp/work has no google-trout-* entry
        # while build-domd/tmp/work has both. If anything ever pulls those recipes into
        # the Dom0 rootfs, meta-clang has to be added to the dom0 layers too, or the
        # recipes will silently fall back to gcc.
        - "../meta-clang"
        - "../../meta-rpi-sodev/meta-xt-common/meta-xt-doma"
      target_images:
        - "tmp/deploy/images/%{MACHINE}/xen-%{MACHINE}"
        # REMOVED(rpi4): xenpolicy-%{MACHINE} — this component can never produce it,
        # so declaring it kept the DomD ninja edge permanently dirty (ninja re-runs an
        # edge whose declared output is missing), making every `ninja` re-invoke
        # `bitbake rpi5-image-xt-domd-v4h`. The producer is xen-tools' do_deploy
        # (meta-virtualization/recipes-extended/xen/xen-tools.inc), gated on the `xsm`
        # PACKAGECONFIG (xen.inc); only the dom0 component enables xsm, and DomD's
        # xen-tools is configured --disable-xsmpolicy. The artifact is not wanted here
        # either: XSM Flask is off (xsm=dummy) and boot.cmd does `fdt rm /chosen/xenpolicy`.
        - "tmp/deploy/images/%{MACHINE}/%{XT_XEN_DTBO_NAME}"
        - "tmp/deploy/images/%{MACHINE}/%{XT_DOMD_DTB_NAME}"
        - "tmp/deploy/images/%{MACHINE}/%{SOC_FAMILY}-%{MACHINE}-mmc.dtbo"
        - "tmp/deploy/images/%{MACHINE}/%{SOC_FAMILY}-%{MACHINE}-usb.dtbo"
        - "tmp/deploy/images/%{MACHINE}/%{SOC_FAMILY}-%{MACHINE}-pcie1.dtbo"
        - "tmp/deploy/images/%{MACHINE}/u-boot-%{MACHINE}.bin"
        - "tmp/deploy/images/%{MACHINE}/boot.scr"
        # NOT PRODUCED on this board: the xen-scmi / domd-scmi / pcie1-scmi dtbos.
        # BCM2711 has no SCMI and this layer carries no *-scmi.dtso sources.
        - "tmp/deploy/images/%{MACHINE}/mmc-passthrough.dtbo"
        - "tmp/deploy/images/%{MACHINE}/usb-passthrough.dtbo"
        - "tmp/deploy/images/%{MACHINE}/pcie1-passthrough.dtbo"
        - "tmp/deploy/images/%{MACHINE}/bcm2711-rpi-4-b.dtb"
        # Not deployed here: bcm2712d0.dtbo. The D0-stepping overlay is BCM2712-only
        # and has no Raspberry Pi 4 equivalent.
        # [rpi4] disable-bt.dtbo — the firmware overlay that moves pl011 to GPIO14/15
        # so `dtoverlay=disable-bt` in config.txt resolves; declared here because a p1
        # item must be produced by some component. Built because the kernel bbappend
        # forces KERNEL_DEVICETREE to keep RPI_KERNEL_DEVICETREE_OVERLAYS, and deployed
        # flat (KERNEL_DTBVENDORED=0 strips the overlays/ prefix). See the p1 item.
        - "tmp/deploy/images/%{MACHINE}/disable-bt.dtbo"
        - "tmp/deploy/images/%{MACHINE}/%{XT_DOMD_IMAGE}-%{MACHINE}.rootfs.ext4"
        - "tmp/deploy/images/%{MACHINE}/Image"
        - "tmp/deploy/images/%{MACHINE}/Image.gz"
        # [full.img completeness] These two are produced by the same DomD v4h
        # bitbake (via rpi5-image-xt-domd-v4h.bbappend do_image[depends]:
        # domd-vc4 / vc4-initramfs) but were not declared as moulin outputs, so
        # `ninja image-full` failed statically with "no known rule to make it".
        # (The aaos-android-kernel / aaos-vendor-boot-ramdisk outputs are
        # declared by the ENABLE_ANDROID=yes override — DomA-gated.)
        - "tmp/deploy/images/%{MACHINE}/%{SOC_FAMILY}-%{MACHINE}-domd-vc4.dtb"
        - "tmp/deploy/images/%{MACHINE}/rpi5-image-xt-domd-vc4-initramfs-%{MACHINE}.rootfs.cpio.gz"
        # EL3 armstub = TF-A BL31 built by meta-xt-rpi4/recipes-bsp/trusted-firmware-a
        # with PLAT=rpi4. `bl31` is the only rpi4 build target and bl31.bin is itself a
        # valid armstub (4 KiB armstub8 header, magic 0x5afe570b). NOT armstub8-gic.bin:
        # that name belongs to raspberrypi/tools' own much thinner EL3 stub, which has no
        # PSCI 1.x and cannot host OP-TEE later. config.txt names it via `armstub=bl31.bin`
        # and adds `enable_gic=1` (see recipes-bsp/bootfiles/rpi-config_git.bbappend).
        - "tmp/deploy/images/%{MACHINE}/bl31.bin"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/bootcode.bin"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/config.txt"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/cmdline.txt"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/fixup.dat"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/fixup_cd.dat"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/fixup_db.dat"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/fixup_x.dat"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/fixup4.dat"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/fixup4cd.dat"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/fixup4db.dat"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/fixup4x.dat"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/start.elf"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/start_cd.elf"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/start_db.elf"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/start_x.elf"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/start4.elf"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/start4db.elf"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/start4cd.elf"
        - "tmp/deploy/images/%{MACHINE}/bootfiles/start4x.elf"

  # =========================================================================
  # DomU kernel — RPi5 Xen-aware guest kernel (virtio-armv8-xt, linux-virtio-armv8,
  # CONFIG_XEN=y). V4H-aligned: the same minimal DomU layer topology as the upstream
  # V4H AGL SoDeV domu component (meta-xt-domu + meta-xt-security over the common
  # Yocto layers) — NO meta-qt6, NO xt-prod-devel-rpi5-domu. The SD uses ONLY this
  # Image (kernel); the DomU rootfs (p3) is the AGL Flutter cluster image built by
  # build.sh's AGL bitbake (identical provenance to V4H). The moulin domu rootfs is
  # not consumed, so build_target is core-image-minimal (kernel-only harvest) and the
  # AGL guest recipes (Qt6 cluster-refgui) are BBMASK'd. (SDL2 sdl2-demo + the gfx
  # image moved to the opt-in meta-rpi-sodev-devel layer.)
  # =========================================================================
  domu:
    build-dir: "%{YOCTOS_WORK_DIR}"
    sources:
      - *COMMON_YOCTO_SOURCES
    builder:
      type: yocto
      work_dir: "%{DOMU_BUILD_DIR}"
      conf:
        - *LINUX_DOMAIN_CONF
        - [MACHINE, "%{DOMU_MACHINE}"]
        - [XT_DOM_NAME, "domu"]
        # Kernel-only harvest: the guest rootfs is the AGL flutter image (build.sh),
        # so mask the DomU guest recipes whose deps (Qt6 / SDL2) are not in this
        # V4H-minimal layer set — core-image-minimal then parse-cleans on wrynose.
        - [BBMASK:append, " meta-xt-domu/recipes-agl/"]
      build_target: "core-image-minimal"
      layers:
        - *COMMON_YOCTO_LAYERS
        # V4H-minimal DomU layer set: meta-xt-domu (DomU kernel linux-virtio-armv8 +
        # integration recipes, incl. the weston-init bbappend) + meta-xt-security.
        - "../../meta-rpi-sodev/meta-xt-common/meta-xt-domu"
        - "../../meta-rpi-sodev/meta-xt-common/meta-xt-security"
      target_images:
        - "tmp/deploy/images/%{DOMU_MACHINE}/Image"

  # =========================================================================
  # DomZ — Zephyr as an unprivileged guest (DomU), the RTOS domain.
  #
  # Zephyr's own `xenvm` board is the Xen-guest board (GICv2 - which is what this
  # board needs, the host has no usable vGICv3 - guest memory map at 0x40000000,
  # ARM generic timer read at runtime, and the Xen PV console so `xl console DomZ`
  # works). The image is a raw binary staged on SD p1 as zephyr-domz.bin and
  # started by the xl toolstack from /etc/xen/domz.cfg (meta-xt-domz), exactly like
  # DomU/DomA are - NOT a dom0less domain, so neither boot.cmd nor the static-mem
  # map changes.
  #
  # There is no rootfs and no partition of its own: DomZ is 16 MiB of RAM and a
  # single vCPU. It is a normal moulin component whose output becomes the
  # ENABLE_DOMZ=yes p1 boot item, the same way `domu` is.
  # =========================================================================
  domz:
    build-dir: "%{ZEPHYR_DOMZ_DIR}"
    sources:
      - type: west
        url: "https://github.com/xen-troops/zephyr-dom0-xt.git"
        rev: "rpi5-v0.4.0"
    builder:
      type: zephyr
      board: "%{ZEPHYR_DOMZ_MACHINE}"
      target: "%{ZEPHYR_DOMZ_APP}"
      work_dir: "%{ZEPHYR_DOMZ_BUILD_DIR}"
      target_images:
        - "%{ZEPHYR_DOMZ_BUILD_DIR}/zephyr/zephyr.bin"

  # =========================================================================
  # DomA — COPIED from V4H AGL SoDeV (prod-devel-rcar4_new.yaml). Kept in sync
  # via meta-rpi-sodev/scripts/sync-guest-pins.sh.  TARGET_BOARD_PLATFORM uses xenvm (VM), not
  # the host SoC, so it is NOT %{SOC_FAMILY} here (RPi5 deviation from V4H).
  #
  # AAOS version: Android 17 (AOSP tag android-17.0.0_r1) on the GKI android17-6.18
  # guest kernel. Both manifests are xenvm-trout manifests WITHOUT a proprietary.xml,
  # because the xen-troops "-ih-" branches for 17 pin Renesas X5H material from
  # partnergitlab.renesas.solutions (a private GitLab) and select the PowerVR DDK for
  # GPU. Neither is reachable nor useful here: this guest runs on a Raspberry Pi, whose
  # GPU path is virgl/mesa3d, and the whole point of the four-domain demo is that it
  # builds from anonymous HTTPS with no NDA (docs/BUILD.md "### 0. Check the host").
  # The manifests used here therefore keep the 15-era arrangement -- upstream Mesa for
  # the guest GPU, no vendor prebuilts -- at the 17 revisions.
  #
  # Where the manifests live. The same arrangement V4H uses: the two `type: repo`
  # components point straight at manifest repositories, pinned by commit (V4H does this
  # in meta-rcar-demo/prod-devel-rcar4_new.yaml with xen-troops/android_kernel_manifest
  # and yhamamachi/android_manifest). AGL hosts no Android manifest repository, and
  # nothing about the guest source is duplicated here.
  #
  # Three changes are needed for an Android 17 guest, and all three go UPSTREAM rather
  # than being kept downstream, because RPi5 builds the same binary as V4H and a
  # downstream-only manifest would break that:
  #   Mesa pinned at 25.3.6 -- MERGED upstream. Android 17 needs the UNREACHABLE rename
  #                            Mesa made in 25.3.0; the 24.3.0-devel revision the branch
  #                            pinned before did not compile under -std=gnu++23
  #   a pinned kernel manifest added ALONGSIDE the branch-tracking one, so a workspace
  #                            revision resolves to one tree instead of whatever the
  #                            tracked branches point at that day. The kernel component
  #                            selects it by name below; `manifest:` is `repo init -m`.
  #   the Raspberry Pi 4 device as a project in the notdefault,rpi4 group, pointing at
  #                            automotive-grade-linux/Android_device_sodev_xenvm-cf.
  #                            Only a board that asks for the group fetches it: measured
  #                            on the pinned revision, 1087 projects with -g default,rpi4
  #                            and 1086 without, the device being the difference. See
  #                            XT_DOMA_SOURCE_GROUP at the top of this file.
  #
  # Both components point at the upstream manifest repositories, pinned by commit.
  # This is the end state; the two commits after this one move each url to a fork of
  # it, because one change per manifest is not in the upstream branch. Read those
  # commits for which is which and why, and revert them to come back here.
  #
  #   git ls-remote https://github.com/yhamamachi/android_manifest        android-17-xenvm-sh-main
  #   git ls-remote https://github.com/yhamamachi/android_kernel_manifest android-17-xenvm-sh-main
  #
  # Move BOTH boards' yaml in the same change -- if one board went to upstream while
  # the other stayed on a fork they would stop sharing one revision, which is the
  # asymmetry a single pinned rev exists to avoid.
  # =========================================================================
  doma_kernel:
    build-dir: "%{ANDROID_KERNEL_DIR}"
    sources:
      - type: repo
        url: https://github.com/yuichi-kusakabe/android_kernel_manifest.git
        rev: a3dfad8b370ca1a68894e477e9d2a0fd35cb604e
        manifest: pinned-common-android17-6.18.xml
        depth: 1
        groups: "%{XT_DOMA_SOURCE_GROUP}"
        dir: "."
    builder:
      type: bazel
      tool: "tools/bazel"
      command: run
      args:
        - "--verbose_failures"
        - "--sandbox_debug"
      target: "%{ANDROID_KERNEL_BUILD_CONFIG}"
      target-patterns:
        # The dist rule changed between the 6.1 and 6.18 kernel trees, and with it the
        # flag that names the output directory. 6.1 ended in
        #     copy_to_dist_dir(dist_dir = ...) + exec(name = ..._dist)
        # whose generated script takes --dist_dir. 6.18 ends in rules_pkg:
        #     pkg_files(strip_prefix = strip_prefix.files_only()) + pkg_install(...)
        # and that pkg_install declares NO destdir attribute, so rules_pkg requires
        # --destdir (or DESTDIR in the environment) at `bazel run` time -- see
        # external/bazelbuild-rules_pkg pkg/install.bzl. moulin's bazel builder puts
        # target-patterns after `--`, i.e. they reach the generated installer as program
        # arguments, which is exactly where both flags belong. A relative path resolves
        # against BUILD_WORKSPACE_DIRECTORY (the android_kernel checkout root), the same
        # place the old relative dist_dir landed, so ANDROID_KERNEL_DEPLOY_DIR and the
        # aaos-guest-binaries recipe that reads it are unaffected.
        - "--destdir=%{ANDROID_KERNEL_DEPLOY_DIR}"
      target_images:
        - "%{ANDROID_KERNEL_DEPLOY_DIR}/Image"

  doma:
    build-dir: "%{DOMA_DIR}"
    sources:
      - type: repo
        url: https://github.com/yhamamachi/android_manifest.git
        rev: 97bc72216187c83f6fb02a33607d31feab442162
        manifest: default.xml
        depth: 1
        groups: "%{XT_DOMA_SOURCE_GROUP}"
        dir: "."
    builder:
      type: android
      env:
        - "TARGET_BOARD_PLATFORM=xenvm"
        # Both paths are relative to the AOSP checkout root and point at the staged copy of
        # the doma_kernel dist that stage-doma-kernel.sh makes there (build.sh runs it
        # between `ninja doma_kernel` and `ninja doma`). They CANNOT name the kernel
        # checkout directly any more: Android 16 moved filesystem assembly into Soong, and
        # Soong rejects a source path that starts with "../" or "/", so the pre-17 form
        # failed analysis with "Path is outside directory" once per artefact. See
        # meta-xt-doma/stage-doma-kernel.sh for where each variable ends up.
        - "TARGET_PREBUILT_KERNEL=%{ANDROID_KERNEL_STAGE_DIR}/Image"
        - "TARGET_PREBUILT_MODULES_DIR=%{ANDROID_KERNEL_STAGE_DIR}/"
      lunch_target: "%{ANDROID_LUNCH_TARGET}"
      target_images:
        - "out/target/product/%{ANDROID_DEVICE}/boot.img"
        - "out/target/product/%{ANDROID_DEVICE}/init_boot.img"
        - "out/target/product/%{ANDROID_DEVICE}/vendor_boot.img"
        - "out/target/product/%{ANDROID_DEVICE}/vbmeta.img"
        - "out/target/product/%{ANDROID_DEVICE}/super.img"
        - "out/target/product/%{ANDROID_DEVICE}/userdata.img"
      additional_deps:
        # Two edges for one input, because the AOSP build reads a COPY of the kernel that
        # this graph cannot produce (stage-doma-kernel.sh makes it; moulin owns the ninja
        # file, so the script cannot be an edge). The dist Image is what a rebuilt kernel
        # changes, so it is what re-runs this component; the staged Image is named too so a
        # checkout where the staging never ran fails with "missing and no known rule to
        # make it" instead of building against whatever is there. Neither edge can see a
        # copy that is merely STALE -- aaos-guest-binaries compares the two byte for byte
        # before shipping either, which is the check that actually closes the hole.
        - "../%{ANDROID_KERNEL_DIR}/%{ANDROID_KERNEL_DEPLOY_DIR}/Image"
        - "%{ANDROID_KERNEL_STAGE_DIR}/Image"

# =========================================================================
# images — full + rootfs copied verbatim from external/meta-xt-prod-devel-rpi5/rpi5.yaml,
# plus a DomA (AAOS) partition (see SODEV-FLUTTER-DOMU-RPI5-INTEGRATION-GAP-2026-06-14.md).
# =========================================================================
images:
  full:
    type: gpt
    desc: "Full RPi4(BCM2711)+Xen SD image (thin Linux or Zephyr Dom0 + dom0less DomD + DomU AGL + DomA AAOS)"
    sector_size: 512
    # The board-verified SD layout; moulin's image
    # builder (rouge) is userspace (mkfs.vfat/mkfs.ext4/mtools/dd — NO root/loop),
    # so `ninja image-full` produces a flashable full.img in one step (V4H-style).
    partitions:
      # p1 — FAT boot: firmware + u-boot + xen + Dom0 kernel/dtb + Dom0-thin
      # initramfs + DomD Image/dtb + DomU kernel + AAOS kernel/ramdisk +
      # boot.scr (generated by xt-rpi-u-boot-scr / prod-0020).
      # No DomD initramfs here any more: DomD's root is the p2 ext4 filesystem.
      boot:
        gpt_type: ebd0a0a2-b9e5-4433-87c0-68b6b72699c7
        type: vfat
        size: 512 MiB
        items:
          "bootcode.bin":   "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bootfiles/bootcode.bin"
          "config.txt":     "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bootfiles/config.txt"
          "cmdline.txt":    "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bootfiles/cmdline.txt"
          "fixup.dat":      "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bootfiles/fixup.dat"
          "fixup4.dat":     "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bootfiles/fixup4.dat"
          "fixup4cd.dat":   "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bootfiles/fixup4cd.dat"
          "fixup4db.dat":   "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bootfiles/fixup4db.dat"
          "fixup4x.dat":    "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bootfiles/fixup4x.dat"
          "fixup_cd.dat":   "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bootfiles/fixup_cd.dat"
          "fixup_db.dat":   "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bootfiles/fixup_db.dat"
          "start.elf":      "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bootfiles/start.elf"
          "start4.elf":     "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bootfiles/start4.elf"
          "start4cd.elf":   "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bootfiles/start4cd.elf"
          "start4db.elf":   "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bootfiles/start4db.elf"
          "start4x.elf":    "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bootfiles/start4x.elf"
          "start_cd.elf":   "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bootfiles/start_cd.elf"
          "start_db.elf":   "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bootfiles/start_db.elf"
          "bl31.bin":       "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bl31.bin"
          "u-boot":         "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/u-boot-%{MACHINE}.bin"
          "xen":            "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/xen-%{MACHINE}"
          "Image":          "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/Image"
          "bcm2711-rpi-4-b.dtb": "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bcm2711-rpi-4-b.dtb"
          # REMOVED(rpi4): overlays/bcm2712d0.dtbo — the D0-stepping overlay (uart10 SPI121->120 rewrite)
          # is BCM2712-only. RPi4 has no D0 stepping and uses pl011 serial@7e201000 directly (no poll-timer
          # workaround needed). On RPi4 the firmware auto-enables the GIC via config.txt `enable_gic=1`.
          "%{XT_XEN_DTBO_NAME}": "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/%{XT_XEN_DTBO_NAME}"
          # [rpi4] overlays/disable-bt.dtbo — REQUIRED for the Xen console.
          # config.txt carries `dtoverlay=disable-bt`; the VideoCore firmware resolves
          # that by loading overlays/<name>.dtbo from this FAT partition. Without the
          # file the overlay is silently skipped, GPIO14/15 keeps the mini UART and
          # pl011 stays wired to the Bluetooth module — so `console=dtuart
          # dtuart=/soc/serial@7e201000` would talk to the BT chip and G1 would show
          # nothing on the header. It cannot be folded into the Xen host overlay that
          # U-Boot applies, because the firmware has already muxed the pins by then.
          # Source path is the flat basename: kernel-devicetree.bbclass deploys with
          # KERNEL_DTBVENDORED=0, so `overlays/disable-bt.dtbo` in KERNEL_DEVICETREE
          # lands as `disable-bt.dtbo` in the deploy dir. Same shape as the rpi5
          # reference's overlays/bcm2712d0.dtbo item.
          "overlays/disable-bt.dtbo": "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/disable-bt.dtbo"
          # [DOM0_OS] The dom0-kernel boot item is supplied per-variant by the DOM0_OS
          # parameter (see `parameters:`): linux -> initramfs-xt-dom0-thin.cpio.gz;
          # zephyr -> zephyr.bin. It is NOT in this common base so only the selected
          # dom0's kernel is depended on (the other dom0 component is never built).
          # [v93] No DomD initramfs on p1 any more. DomD boots root=/dev/xvda from the
          # p2 ext4 (the rootfs partition below) over PV block, so the RAM initramfs
          # image recipe (rpi5-image-xt-domd-vc4-initramfs) was dropped upstream and
          # boot.cmd no longer fatloads it.
          "%{SOC_FAMILY}-%{MACHINE}-domd-vc4.dtb": "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/%{SOC_FAMILY}-%{MACHINE}-domd-vc4.dtb"
          # [wrynose] "linux-domu" (DomU Xen-aware kernel) boot item is ENABLE_DOMU=
          # yes-gated; the aaos-* boot items are likewise ENABLE_ANDROID=yes-gated
          # (see `parameters:`) so this common base carries no guest artifacts.
          "boot.scr":       "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/boot.scr"
      # p2 — DomD rootfs (ext4) as a raw partition
      domd:
        gpt_type: B921B045-1DF0-41C3-AF44-4C6F280D3FAE
        type: raw_image
        # raw dd (no resize2fs): the bitbake ext4 carries features (orphan_file,
        # metadata_csum_seed) that the rouge container's resize2fs 1.46.5 rejects
        # ("unsupported feature(s)"). The rootfs is the guest's whole disk; it does
        # not need to fill the partition, so copy it as-is.
        resize: false
        size: 9216 MiB
        image_path: "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/%{XT_DOMD_IMAGE}-%{MACHINE}.rootfs.ext4"
      # p3 — DomU AGL Flutter rootfs (ext4): added here by the ENABLE_DOMU=yes
      # parameter (see `parameters:` above), built by build.sh's AGL bitbake. With
      # ENABLE_DOMU=no (wrynose default) the SD image has no p3 (DomU-less).
      # p4 — DomA AAOS: added here as a nested GPT by the ENABLE_ANDROID=yes
      # parameter (see `parameters:` above), assembled by rouge directly from the
      # doma component's AOSP outputs. No prebuilt combined-disk input. With
      # ENABLE_ANDROID=no the SD image has no p4 (DomA-less).
      #
      # !! ENABLE_ANDROID=yes REQUIRES p3 TO EXIST -- DomU's OR the reservation !!
      # The parameters add their partitions INDEPENDENTLY and rouge numbers partitions
      # in declaration order, so `--ENABLE_ANDROID yes --ENABLE_DOMU no` on its own
      # produces an image where the DomA nested GPT is the THIRD partition. All the
      # combinations parse and rouge lists its images for each, so nothing fails at
      # build time — it fails at run time, because the guest configs address the
      # partitions by fixed device node, not by partlabel:
      #   doma.cfg:126           -drive file=/dev/mmcblk0p4      (AAOS super.img)
      #   domd.cfg:275,282       phy:/dev/mmcblk0p3 -> xvdb, phy:/dev/mmcblk0p4 -> xvdc
      #   xl-create-doma.service qemu reads /dev/mmcblk0p4 directly
      # With DomU absent, DomA's data lands on p3 while qemu still opens p4, which
      # does not exist -> DomA would fail to start with an I/O error, not a clear
      # message.
      # ENABLE_DOMU_RESERVED=yes (parameter above) covers the DomU-less case by
      # inserting an empty 8 MiB partition at p3, so DomA keeps p4. build.sh DERIVES
      # that value (yes exactly when ENABLE_ANDROID=yes and ENABLE_DOMU=no) and its
      # C2 guard refuses the remaining hole -- DomA with neither a DomU rootfs nor the
      # reservation at p3 -- for a full SD-image build; NG-2 covers --domains-only,
      # deliberately still allowing an `--aaos=source --domains-only` artifact-only
      # build. The note is kept here because the constraint lives in the PARTITION
      # ORDER defined above, not in build.sh: a direct `moulin`/`rouge` invocation
      # bypasses the derivation, so it has to pass --ENABLE_DOMU_RESERVED yes itself
      # whenever it asks for DomA without DomU.
      # The permanent fix would be to address these partitions by
      # /dev/disk/by-partlabel/<name> in doma.cfg / domd.cfg / xl-create-doma.service.

  rootfs:
    type: gpt
    desc: "DomD rootfs only (RPi4)"
    sector_size: 512
    partitions:
      rootfs:
        gpt_type: B921B045-1DF0-41C3-AF44-4C6F280D3FAE # Linux aarch64 root
        type: raw_image
        image_path: "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/%{XT_DOMD_IMAGE}-%{MACHINE}.rootfs.ext4"
