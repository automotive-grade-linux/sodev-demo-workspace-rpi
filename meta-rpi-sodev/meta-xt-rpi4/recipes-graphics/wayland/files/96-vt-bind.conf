[Service]
# Bind weston's libseat session to the VT this unit actually declares (tty7).
#
# seatd creates a VT-BOUND seat ("Created VT-bound seat seat0") and binds each
# client to whatever VT is ACTIVE at the moment the client opens the seat -- NOT to
# the client's own TTYPath. At boot the active VT is tty1 (fbcon + getty@tty1), so
# weston, whose unit sets TTYPath=/dev/tty7, ends up with its session bound to
# VT 1. Two consequences, both measured on the RPi4 bench on 2026-08-04:
#
#   * fbcon/getty@tty1 and weston share VT 1, while the VT weston claims is empty.
#   * Any switch to tty7 makes seatd disable weston --
#         seatd: Disabling client 1 on seat0
#         seatd: No clients belonging to VT 1 to activate
#         weston: Disabling seat / deactivating session
#     weston drops DRM master, the CRTC falls back to scanning out fbcon's
#     framebuffer (/sys/kernel/debug/dri/1/state: "allocated by = [fbcon]"), and
#     NOTHING brings it back: chvt 7 cannot re-activate a VT that has no client
#     registered on it. The panel stays black permanently -- including every guest
#     surface, since DomU's video reaches the panel only through this compositor.
#     That is exactly how a whole session was spent hunting a "DomU has no video"
#     bug whose real cause was one stray chvt.
#
# Activating tty7 before weston opens the seat makes the binding match the
# declaration. A VT switch away and back is then correctly handled: verified on
# hardware, chvt 1 -> master=n, chvt 7 -> "Opened client 7 on seat0", master=y.
#
# '+' runs this as root. The unit body runs as User=weston, which cannot issue
# VT_ACTIVATE on /dev/tty0.
ExecStartPre=+/usr/bin/chvt 7
