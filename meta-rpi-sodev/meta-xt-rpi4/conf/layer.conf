# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory containing .bb and .bbappend files, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb \
            ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "xt-rpi4"
BBFILE_PATTERN_xt-rpi4 := "^${LAYERDIR}/"
BBFILE_PRIORITY_xt-rpi4 = "10"

LAYERSERIES_COMPAT_xt-rpi4 = "wrynose"
# This is the RPi4 counterpart of meta-xt-rpi5 and the two are mutually exclusive:
# rpi4-sodev.yaml lists this layer where rpi5-sodev.yaml lists that one. They provide
# the same recipe names (xt-rpi-u-boot-scr, domd-vc4, the rpi5-image-* wrappers), so
# putting both in one bblayers is not a supported configuration.
#
# virtualization-layer is a real dependency, not an optional one: the sole provider of
# the xen_4.21.bb that recipes-extended/xen/xen_4.21.bbappend attaches to is
# meta-virtualization. Declaring it means a component that drops that layer fails at
# layer-resolution time instead of silently leaving the bbappend attached to nothing
# (bitbake only warns about unused bbappends).
#
# xt-security is deliberately not listed: OP-TEE is off on this board (see
# recipes-bsp/trusted-firmware-a/trusted-firmware-a_git.bb), so this layer has no
# recipes-security/optee content to append to.
LAYERDEPENDS_xt-rpi4 = "core raspberrypi virtualization-layer"

# RPI_SOC_FAMILY templates the device-tree file names (${RPI_SOC_FAMILY}-${MACHINE}-*).
#
# The build normally gets this variable from conf/moulin.conf, which moulin generates from
# the product yaml (%{SOC_FAMILY}). That is a per-build-directory constant, so changing
# only MACHINE within one configuration leaves the SoC name behind: with
# MACHINE=raspberrypi5 the parse fails with
#   Unable to get checksum for ... bcm2711-raspberrypi5-domd.dts
# i.e. it keeps bcm2711 while looking for the RPi5 device tree.
#
# Providing a machine-scoped default here makes the layer self-sufficient. It uses `?=`,
# and layer.conf is parsed before local.conf, so a value set in the build configuration
# still wins; the default only applies when the configuration does not supply one.
RPI_SOC_FAMILY:raspberrypi4-64 ?= "bcm2711"
