# DomD display-path switches for the DomA device model, created at boot. Only qemu 11.1.2
# reads them (q11-063, q11-066); with qemu 10.0.2 they do nothing. qemu checks each file at
# most once a second (media-isp: once per decode session), and removing one turns that
# feature off (isp-scanout-depth: back to the code's default of 4). Measured on the RPi4:
#   media-isp / isp-scanout / isp-skip-copy: the ISP direct-scanout path (q11-063)
#   media-sg-rw / fb-invalidate: a copy helper for virtio-media's scatter-gather buffers
#       and a GL blit that invalidates instead of clearing (q11-063)
#   sand-scanout / sand-skip-isp: the decoder's SAND buffer straight to a weston overlay
#       plane without the ISP (q11-063). Only with host-sand set (RPI4_DOMA_HOST_SAND != 0);
#       with host-sand 0 the decoder hands over NV12 and these two do nothing.
#   isp-scanout-depth 2: the depth of the fullscreen 1080p60 SAND measurement (887, 888 and
#       885 of about 895 frames shown). The code's default 4 is the best value for the ISP
#       ring alone, where 2 dropped 17%.
#   plane-handoff: the HMI case's guest planes on weston subsurfaces instead of qemu's GL
#       blend -- local 720p HMI 52 -> 57 fps, a streamed video in the HMI 33 -> 42 (q11-066)
#   plane-sand: a plane of the plane handoff whose texture the decoder filled gets the
#       decoder's SAND buffer, which the HVS scales, instead of the ISP and the TFU
#       (q11-081, with q11-097 for the proxy's scaled or padded texture). With the vc4
#       underlay and weston's gbm-format=argb8888 a local 1080p60 clip in a WebView
#       (fullscreen and HMI, DomA on 3 vCPUs) 22 -> 38-44 shown/s (2026-10-23).
# Left out: sand-scaled (q11-082, the Raspberry Pi 5's decoder mode; the proxy scales
# with the ISP).
f /run/qemu-media-isp 0644 root root -
f /run/qemu-isp-scanout 0644 root root -
f /run/qemu-isp-skip-copy 0644 root root -
f /run/qemu-media-sg-rw 0644 root root -
f /run/qemu-fb-invalidate 0644 root root -
f /run/qemu-isp-scanout-depth 0644 root root - 2
f /run/qemu-sand-scanout 0644 root root -
f /run/qemu-sand-skip-isp 0644 root root -
f /run/qemu-plane-handoff 0644 root root -
f /run/qemu-plane-sand 0644 root root -
