# Hypervisor Kconfig fragment: the passthrough quirks the disaggregated layout needs on
# BCM2711 (Raspberry Pi 4). RPi4 counterpart of v93's xen-config-rpi5-passthrough.cfg,
# derived on the v93 rebase (2026-08-04).
#
# Every symbol below defaults to n / 0 in xen/arch/arm/Kconfig, so this fragment is what
# turns it on; a build without it gets unmodified upstream ARM behaviour. All of them are
# UNSUPPORTED-gated, so the fragment only takes effect together with xen-hyp-config.cfg
# (CONFIG_UNSUPPORTED=y) and MUST be listed after it -- otherwise olddefconfig silently
# drops these lines. Same ordering note as xen-config-ioreq.cfg.
#
# WHY THIS FILE DID NOT EXIST BEFORE THE REBASE
# The v77-based port reached G1/G2/G3 on hardware without it, because a dom0less DomD
# gets its passthrough set up by XEN ITSELF at boot (handle_node() /
# map_device_irqs_to_domain() walking "xen,passthrough" in the host DT). These symbols
# matter for the OTHER path -- `xl create` forwarding host IRQs and MMIO from the control
# domain -- which is DomA (G4) and was never reached. v93 split them out of
# 4.22-0001-working-delta into a board fragment, which is what made the gap visible.

# Let the hardware domain's toolstack forward host SPIs and device MMIO to a guest.
# The devices DomD drives are marked "xen,passthrough", so they are absent from Dom0's
# irq_caps/iomem_caps and xc_domain_{irq,iomem}_permission() returns -EPERM without this.
CONFIG_XT_HWDOM_PASSTHROUGH_CAPS=y

# Every BCM2711 peripheral SPI is active-high level, which is also the GICv2 reset state.
# A passthrough device is never probed by Dom0, so nothing ever calls gic_set_irq_type()
# for its IRQ and the route would be rejected with -EINVAL ("IRQ N has not been
# configured"). Same reasoning as BCM2712; the electrical property is identical.
CONFIG_XT_GUEST_PASSTHROUGH_IRQ_TYPE_DEFAULT=y

# nr_spis floor for a guest that is handed host SPIs. Derived, not copied from the rpi5
# fragment (which uses 288 for BCM2712's 320-line GIC):
#   * highest SPI in the stock bcm2711-rpi-4-b.dtb ............ 176
#   * highest SPI this port declares for DomD passthrough ..... 158
#     (bcm2711-raspberrypi4-64-domd-vc4.dts; 148 = PCIe MSI, 147 = PCIe, 126 = SD/SDIO,
#      121 = pl011, 110 = pixelvalve, 96/97 = display L2 / hvs, 74 = v3d)
# A guest's vGIC and allocated_irqs bitmap must reach the highest SPI it is given, so the
# floor has to exceed 176; 192 is the next multiple of 32 above it and leaves room for the
# unused-but-present lines. Below this, gic_route_irq_to_guest() trips
# ASSERT(virq < vgic_num_irqs(d)) with libxl's own smaller default.
CONFIG_XT_GUEST_MIN_NR_SPIS=192

# NOT SET on this board, and both omissions are deliberate:
#
# CONFIG_XT_HWDOM_MMIO_DEVICE_ATTR
#   Maps the hardware domain's device MMIO Device-nGnRE instead of Normal-Cacheable.
#   That exists for a BCM2712 erratum: its pad-config registers raise an IMP-DEF
#   asynchronous SError (ESR=0xbffb936f) on the first cached writel(), seen at the main
#   pinctrl 0x10_7d504100 under a Linux Dom0. BCM2711 has no such report and the port
#   ran G1-G3 on hardware with the default attributes, including Dom0 touching
#   gpio@7e200000 via pinctrl-bcm2835. Enabling it "just in case" would change the
#   memory type of every hwdom MMIO mapping, so it stays off until a real symptom
#   appears.
#
# CONFIG_XT_HWDOM_IOMEM_CAP_START / _END
#   The rpi5 fragment opens 4 GiB..128 GiB because BCM2712 puts DomD's peripherals high
#   in a 40-bit space (its HVS sits at 0x10_7c580000, about 66 GiB). BCM2711 is a 35-bit
#   map and every device this port passes through is below 4 GiB -- the highest is
#   0xfef20000 (hdmi1 metadata) -- so the default window already covers them and a raised
#   START would exclude them. Confirmed against the addresses in
#   recipes-guest/domd-vc4/files/bcm2711-raspberrypi4-64-domd-vc4.dts.
