# Hypervisor Kconfig fragment for the RPi4 dom0less / disaggregated design.
#
# The stock meta-virtualization defconfig lacks all of these because they are
# EXPERT/UNSUPPORTED-gated, and without them the first hardware boot panics with
#   "direct-map is not valid for domain domD without static allocation."
CONFIG_XSM=y
# EXPERT/UNSUPPORTED unlock the gated options below. Without them merge_config
# accepts the lines but olddefconfig silently DROPS them — exactly how
# xen-config-ioreq.cfg alone failed to take effect during the RPi5 bring-up.
CONFIG_EXPERT=y
CONFIG_UNSUPPORTED=y
# The DomD node in bcm2711-raspberrypi4-64-xen.dtso uses direct-map plus three
# xen,static-mem banks, and parsing xen,static-mem requires STATIC_MEMORY.
CONFIG_STATIC_MEMORY=y

# -----------------------------------------------------------------------------
# REMOVED(rpi4): CONFIG_TEE + CONFIG_OPTEE
# -----------------------------------------------------------------------------
# They existed only to satisfy xen,tee = "optee" on the RPi5 DomD node. OP-TEE is
# disabled for this port (README.md "Known limitations" — TF-A's rpi4 platform has no SPD
# integration), the DomD node carries no xen,tee, and there is no secure
# carve-out in /reserved-memory. Re-add both together with the other steps listed
# in recipes-bsp/trusted-firmware-a/trusted-firmware-a_git.bb.

# -----------------------------------------------------------------------------
# Platform support note — no Kconfig change needed, but do not narrow it either
# -----------------------------------------------------------------------------
# Xen has a first-class RPi4 platform: xen/arch/arm/platforms/brcm-raspberry-pi.c
# declares PLATFORM_START(rpi4, "Raspberry Pi 4") with .compatible =
# {"brcm,bcm2711"}, a .reset through the PM watchdog, a device blacklist for the
# aux UART's page neighbours, and — the important one — .dma_bitsize = 30.
# There is no CONFIG_RPI4 / CONFIG_BCM2711 symbol: the object is built under
# CONFIG_ALL64_PLAT, which is the arm64 Kconfig default, so a stock build already
# includes it. Do NOT narrow the platform selection here, or Xen loses the
# dma_bitsize that keeps Dom0's bank[0] inside the low 1 GiB where the VideoCore
# mailbox and the SD controller can reach it.
#
# Deliberately NOT set anywhere: `dma_bits` on the Xen command line. That carves
# out a separate Xen-heap DMA zone, which is a different mechanism from the dom0
# 1:1 placement the platform's dma_bitsize drives.
