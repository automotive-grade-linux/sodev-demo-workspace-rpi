# =============================================================================
# BCM2711 / RPi4 hardware config for the shared Dom0 + DomD Image
# =============================================================================
# The Dom0 and DomD domains run the same Linux Image, so every driver either
# needs is enabled here. What changes versus the BCM2712 build is entirely about
# RP1 disappearing: Ethernet, USB2, GPIO and SD are on-SoC on this board, and
# USB3 is a VL805 behind the PCIe root complex.
#
# Anything already =y in bcm2711_defconfig is restated rather than assumed, so a
# defconfig drift shows up as a merge_config warning instead of a missing driver.

# --- restricted DMA -----------------------------------------------------------
# BCM2711 has no IOMMU and its legacy peripherals only reach the low 1 GiB
# through the 0xc0000000 VideoCore bus alias, so bounce buffering is mandatory.
# CONFIG_SWIOTLB_XEN is not user-selectable (def_bool y when ARM64 && XEN), but
# SWIOTLB itself and the DMA-restricted-pool support are, and xen_swiotlb_detect()
# returns true for a direct-mapped domain — which is what both Dom0 and the
# dom0less DomD are here. DMA_CMA is what vc4's display buffers come from.
CONFIG_SWIOTLB=y
CONFIG_DMA_CMA=y
CONFIG_CMA=y
CONFIG_CMA_AREAS=7

# --- Ethernet: on-SoC GENET v5 (replaces RP1's cdns,macb) ---------------------
# /scb/ethernet@7d580000, brcm,bcm2711-genet-v5, GIC SPI 157/158, internal MDIO
# at offset 0xe14 with a BCM54213PE PHY. Built in, not modular: DomD's flat L2
# bridge is what gives every other domain its network, so it must be up before
# userspace.
CONFIG_BCMGENET=y
CONFIG_MDIO_BCM_UNIMAC=y
CONFIG_BCM7XXX_PHY=y
CONFIG_BROADCOM_PHY=y
# The RP1 NIC driver is not needed on this board.
# CONFIG_MACB is not set

# --- USB2: on-SoC dwc_otg (replaces RP1's two dwc3 controllers) ---------------
# /soc/usb@7e980000 binds the Raspberry Pi downstream dwc_otg driver via
# compatible = "brcm,bcm2708-usb" (GIC SPI 73 "usb" + SPI 40 "soft"). This is the
# safe path for the HDMI-A-2 touch panel: no MSI involved at all.
CONFIG_USB_DWCOTG=y
CONFIG_USB=y
CONFIG_USB_HID=y
CONFIG_HID_MULTITOUCH=y
CONFIG_INPUT_EVDEV=y

# --- USB3: VL805 xHCI behind the BCM2711 PCIe root complex --------------------
# Unproven under Xen (see README.md "Known limitations") but the drivers must be present for the
# experiment. RESET_RASPBERRYPI provides the firmware reset that makes the
# VideoCore reload VL805's SPI firmware before enumeration.
CONFIG_PCI=y
CONFIG_PCIE_BRCMSTB=y
CONFIG_PCI_MSI=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_PCI=y
CONFIG_RESET_RASPBERRYPI=y

# --- SD card: emmc2 (sdhci-iproc), not BCM2712's sdhci-brcmstb ---------------
CONFIG_MMC=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PLTFM=y
CONFIG_MMC_SDHCI_IPROC=y
CONFIG_MMC_BCM2835=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED_VOLTAGE=y
CONFIG_REGULATOR_GPIO=y

# --- GPIO / pinctrl ----------------------------------------------------------
# pinctrl-bcm2835 covers the bcm2711 bank at /soc/gpio@7e200000; the firmware
# GPIO (expgpio) drives the SD power and IO-voltage regulators.
CONFIG_PINCTRL_BCM2835=y
CONFIG_GPIO_RASPBERRYPI_EXP=y

# --- VideoCore firmware: clocks, power domains, reset ------------------------
# HVS, V3D and both HDMI blocks take their clocks from <&firmware_clocks N> over
# the mailbox, and V3D's power domain + reset come from bcm2835-pm/-power. All
# built in, because DomD needs them before it can bind vc4/v3d.
CONFIG_BCM2835_MBOX=y
CONFIG_RASPBERRYPI_FIRMWARE=y
CONFIG_CLK_RASPBERRYPI=y
CONFIG_RASPBERRYPI_POWER=y
CONFIG_SOC_BRCMSTB=y
CONFIG_BCM2835_POWER=y

# --- Display / 3D -----------------------------------------------------------
# vc4 stays modular so Dom0's `modprobe.blacklist=vc4,v3d,simplefb` actually
# works while DomD loads it from init-vc4.sh (see xen-config-a4b-frontend.cfg).
# On BCM2711 vc4 is display-only: brcm,2711-v3d is not in vc4_v3d_dt_match[], so
# DRM_V3D is a separate driver providing renderD128 next to vc4's card0.
CONFIG_DRM=y
CONFIG_DRM_VC4=m
CONFIG_DRM_V3D=m
CONFIG_DRM_VC4_HDMI_CEC=y
CONFIG_I2C_BRCMSTB=m
# No sysfb/simplefb driver may bind the firmware framebuffer before DomD's vc4-drm
# modeset. NOTE: `=n` is the wrong spelling for a kernel .cfg fragment — kconfig
# writes disabled symbols as `# CONFIG_X is not set`, and merge_config warns about
# `=n` lines. Both symbols were already unset in bcm2711_defconfig, so this block
# never changed anything; state it the canonical way so it survives a defconfig
# change. (The real defence against a firmware framebuffer is upstream of the
# kernel: the boot scripts remove the DT nodes, `skip_board_fixup 1` stops U-Boot
# re-adding one, and CONFIG_VIDEO_BCM2835 is off so U-Boot never allocates one.)
# CONFIG_DRM_SIMPLEDRM is not set
# CONFIG_FB_SIMPLE is not set
# CONFIG_SYSFB_SIMPLEFB is not set

# --- Thermal ----------------------------------------------------------------
# The DomD DT's thermal sensor is compatible = "brcm,bcm2711-thermal" under the
# passed-through AVS syscon, and the ONLY driver with that of_match_id is
# drivers/thermal/broadcom/bcm2711_thermal.c:62 = CONFIG_BCM2711_THERMAL.
#
# This block previously named CONFIG_BRCMSTB_THERMAL, which is a different driver
# (brcmstb_thermal.c, the STB AVS-TMON block) and can never bind to
# brcm,bcm2711-thermal. It happened to be harmless only because bcm2711_defconfig
# already sets CONFIG_BCM2711_THERMAL=y — i.e. the sensor worked by defconfig
# inheritance, which is exactly the fragility this fragment exists to remove, and
# the wrong name would have survived any defconfig change unnoticed.
# BCM2711_THERMAL depends on THERMAL_OF && MFD_SYSCON (both =y here).
CONFIG_BCM2711_THERMAL=y
CONFIG_THERMAL_OF=y
# Not this SoC's sensor. It builds because ARCH_BRCMSTB=y in the arm64 defconfig,
# so it is dead weight in the Image rather than a probe hazard.
# CONFIG_BRCMSTB_THERMAL is not set

# --- Not present on BCM2711 -------------------------------------------------
# RP1 multi-function device, its clock/GPIO/PWM drivers and the BCM2712 IOMMU all
# have no hardware behind them here. Turning them off keeps the Image smaller and
# stops a driver from probing a node that only exists on the other SoC.
# CONFIG_MFD_RP1 is not set
# The clock driver's symbol is COMMON_CLK_RP1 (drivers/clk/Kconfig), not CLK_RP1 —
# CLK_RP1 is not a Kconfig symbol at all in this tree, so the old line here did
# nothing. Its SD variant is a separate symbol and is listed too.
# CONFIG_COMMON_CLK_RP1 is not set
# CONFIG_COMMON_CLK_RP1_SDIO is not set
# CONFIG_PINCTRL_RP1 is not set
# CONFIG_PWM_RP1 is not set
# CONFIG_BCM2712_IOMMU is not set

# DomD runs `xl` (it is the control domain: /chosen/domD carries capabilities = <0x1>),
# and the carried privcmd patch blocks EVERY hypercall in a non-initial domain unless
# the domain either has a `target` xenstore node or is booted with
# `xen_privcmd.unrestricted=1` — which the boot scripts do pass. But that parameter is
# silently IGNORED when the kernel is locked down:
#
#   drivers/xen/privcmd.c restrict_driver():
#       if (unrestricted) {
#               if (security_locked_down(LOCKDOWN_XEN_USER_ACTIONS))
#                       pr_warn("Kernel is locked down, parameter \"unrestricted\" ignored\n");
#
# Enabling lockdown would therefore kill the DomD toolstack (every `xl` call returning
# "Operation not permitted") with a single pr_warn as the only clue — the exact symptom
# that was observed under QEMU when a console driver typed into the wrong domain.
# The raspberrypi defconfig leaves this off today; assert it here so that a future
# hardening change collides with this fragment instead of silently breaking G2/G(Z).
# CONFIG_SECURITY_LOCKDOWN_LSM is not set

# --- vsock for DomA (built IN, not modules) -----------------------------------
# DomA (AAOS) needs three vsock paths, all terminated in DomD:
#   doma.cfg  -device vhost-vsock-pci,guest-cid=3   -> /dev/vhost-vsock
#   xt-aaos-host-services  vehicle_hal_grpc_server  -> vsock cid2:9210
#                          dumpstate_grpc_server    -> vsock cid2:9310
#
# WHY =y AND NOT =m. The raspberrypi defconfig builds these as modules, and that
# is what this board actually shipped until 2026-08-04:
#     CONFIG_VSOCKETS=m  CONFIG_VHOST=m  CONFIG_VHOST_VSOCK=m
# while xt-aaos-host-services.bb's own DESCRIPTION asserts "The DomD kernel has
# VSOCK=y / VHOST_VSOCK=y / VHOST=y (no kernel change needed)" -- an assumption
# inherited from the RPi5/V4H build that was never true here. Two independent
# problems came out of it:
#   1. The DomD image installed only kernel-module-vhost-net (for /dev/vhost-net),
#      so vhost_vsock.ko was built but never packaged. `xl create doma.cfg` would
#      have failed at qemu start with no /dev/vhost-vsock.
#   2. Fixing that by adding kernel-module-vhost-vsock to IMAGE_INSTALL is fragile
#      here: verify-all.sh step 10 prunes DEPLOY_DIR (see HANDOVER 4.3), so the
#      module RPM can be absent while bitbake still considers the kernel's
#      do_package_write_rpm up to date -- do_rootfs then fails with
#      "No match for argument: kernel-module-vhost-vsock" and no amount of
#      rebuilding the image fixes it.
# Building them in removes the packaging question entirely AND removes an autoload
# race: DomD is a driver domain whose toolstack may create DomA early, and a
# built-in vsock stack is available before any udev/modprobe has run.
#
# VIRTIO_VSOCKETS_COMMON is the transport core vhost_vsock links against;
# VSOCKETS_LOOPBACK is what the host-side daemons use to talk to CID 2 locally.
CONFIG_VSOCKETS=y
CONFIG_VSOCKETS_LOOPBACK=y
CONFIG_VIRTIO_VSOCKETS_COMMON=y
CONFIG_VHOST_MENU=y
CONFIG_VHOST=y
CONFIG_VHOST_VSOCK=y

# SIDE EFFECT, MADE EXPLICIT. Turning CONFIG_VHOST on pulled CONFIG_VHOST_XEN in with
# it (the xen-troops vhost backend defaults on once VHOST is available). Before this
# fragment existed, CONFIG_VHOST_XEN was NOT SET AT ALL on this board -- which means
# the `vhost_xen.nogrant=1` that both boot.cmd.xen.*-dom0.in put on DomD's cmdline was
# being silently ignored, and the "vhost_xen latches the first vsock guest's domid"
# behaviour that domu.cfg and doma.cfg both reason about did not exist here.
#
# It is stated rather than left implicit because the design clearly expects it: the
# cmdline parameter, doma.cfg's "DomA is created before DomU (vhost_xen domid latch)"
# ordering requirement and domu.cfg's removal of vhost-vsock-pci are all written
# against a kernel that HAS this driver. Leaving it as an accident of another symbol
# would let it disappear again with the next defconfig bump, silently.
#
# NOT YET VERIFIED ON HARDWARE: this is a behaviour change bundled with the vsock fix.
# The first boot after writing the new image must re-check that DomU's video still
# comes up (weston DRM master on VT7 + the QEMU surface on HDMI-A-1) before trusting
# anything else about the image.
CONFIG_VHOST_XEN=y
