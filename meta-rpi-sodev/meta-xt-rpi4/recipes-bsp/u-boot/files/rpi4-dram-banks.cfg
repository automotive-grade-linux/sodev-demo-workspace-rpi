# Raise the DRAM bank count so nothing about the memory layout Xen sees is
# truncated.
#
# U-Boot's default is CONFIG_NR_DRAM_BANKS=4 (top-level Kconfig). The 8 GiB
# Raspberry Pi 4 firmware device tree describes DRAM in four banks, i.e. exactly
# at the limit — and the limit bites twice:
#   fdtdec_setup_memory_banksize() fills bi_dram[], which is what the LMB
#   allocator (and therefore every fatload bounds check) is built from; and
#   arch_fixup_fdt() -> fdt_fixup_memory_banks() rewrites /memory in the DTB that
#   is handed to Xen from that same array. A truncated bi_dram silently caps the
#   RAM Xen can see.
#
# Eight banks costs a few dozen bytes of BSS and removes the cliff edge.
CONFIG_NR_DRAM_BANKS=8
