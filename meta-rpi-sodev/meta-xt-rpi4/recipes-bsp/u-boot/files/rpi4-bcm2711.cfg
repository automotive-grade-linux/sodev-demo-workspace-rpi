# Select BCM2711 instead of BCM2712 in the xen-troops u-boot fork.
#
# The fork's configs/rpi_arm64_defconfig hard-sets CONFIG_BCM2712=y because its
# only target was the Raspberry Pi 5. The MMU map itself is picked at RUN time
# from the device-tree compatible (board_ids in arch/arm/mach-bcm283x/init.c
# already lists "brcm,bcm2711"), so RPi4 would mostly work either way, but two
# things are wrong with leaving BCM2712 selected:
#
#   * board/raspberrypi/rpi/rpi.c guards board_late_init() with
#     #ifdef CONFIG_BCM2712 and uses it to probe RP1 over PCIe. RPi4 has no RP1,
#     so every boot prints "RPI: RP1 device not found".
#   * CONFIG_BCM2712 selects LINUX_KERNEL_IMAGE_HEADER, which prepends an arm64
#     Image header to u-boot.bin. TF-A/rpi4 enters BL33 at the raw load address
#     from the armstub header, so the extra header is dead weight here.
#
# CONFIG_BCM2711_64B selects both BCM2711 and ARM64 (arch/arm/mach-bcm283x/Kconfig).
CONFIG_BCM2711_64B=y
# CONFIG_BCM2712 is not set

# Dropping BCM2712 leaves board_late_init() with no implementation.
#
# configs/rpi_arm64_defconfig sets CONFIG_BOARD_LATE_INIT=y UNCONDITIONALLY
# (line 76) — it is not a `select` under BCM2712 — while the only definition of
# board_late_init() in the whole tree is board/raspberrypi/rpi/rpi.c:607, wrapped
# in #ifdef CONFIG_BCM2712. Its body is nothing but the RP1-over-PCIe probe, and
# the comment above it says so: "This initialization should be done only for RPI5
# board." So with BCM2712 off the symbol is referenced but never defined:
#
#   aarch64-poky-linux-ld.bfd: common/board_r.o:(.data.init_sequence_r+0xf8):
#       undefined reference to `board_late_init'
#   make[1]: *** [Makefile:1798: u-boot] Error 1
#
# Turning the hook off removes the call from init_sequence_r[]. Nothing else on
# RPi4 uses it — mainline u-boot's rpi board does not define board_late_init at
# all; it arrived in the xen-troops fork solely for the Pi 5's RP1.
# CONFIG_BOARD_LATE_INIT is not set

# -----------------------------------------------------------------------------
# Keep U-Boot out of the display path entirely.
# -----------------------------------------------------------------------------
# DomD owns HDMI: config.txt sets disable_fw_kms_setup=1 / disable_splash=1 so the
# VideoCore never programs the display, and the boot script deletes every
# framebuffer node before `booti`. U-Boot's own video stack undoes both halves:
#
#   * board/raspberrypi/rpi/rpi.c:577 ft_board_setup() runs during `booti`, i.e.
#     AFTER the boot script's `fdt rm`, and unconditionally adds a root-level
#     `/framebuffer` node (fdt_simplefb_add_node()). NOTE: that node is added with
#     status = "disabled" — boot/fdt_simplefb.c:63 sets it and
#     fdt_setup_simplefb_node() (boot/fdt_support.c) writes only reg/width/height/
#     stride/format, never status — so no Linux simplefb driver binds it. The
#     hazard is not driver binding but that the node carries a `reg` inside the
#     VideoCore carve-out which Xen's handle_node() then maps into Dom0's p2m,
#     and that it survives removals the boot script already performed.
#   * fdt_simplefb_configure_node() reaches that reg only via
#     uclass_first_device_err(UCLASS_VIDEO, &dev) — i.e. by probing
#     VIDEO_BCM2835, which asks the VideoCore mailbox to ALLOCATE a framebuffer.
#     That is the real damage: the firmware programs HDMI at U-Boot time,
#     defeating disable_fw_kms_setup, before DomD's vc4-drm ever modesets.
#
# Dropping only the BCM2835 video DRIVER leaves no device in UCLASS_VIDEO, so
# uclass_first_device_err(UCLASS_VIDEO, &dev) returns -ENODEV, nothing is asked of
# the VideoCore, and the injected node stays an empty disabled stub. U-Boot's
# console is the pl011 the Xen console also uses, so nothing is lost.
#
# Do NOT unset CONFIG_VIDEO to achieve this, and do NOT unset CONFIG_FDT_SIMPLEFB.
# Both were tried: clearing CONFIG_VIDEO makes Kconfig drop FDT_SIMPLEFB with it,
# and include/fdt_simplefb.h declares fdt_simplefb_add_node() /
# fdt_simplefb_enable_and_mem_rsv() with NO !CONFIG stubs while rpi.c:585,587
# calls both unguarded — so the link fails exactly the way CONFIG_BOARD_LATE_INIT
# did above:
#   ld.bfd: rpi.c:585:(.text.ft_board_setup+0x38): undefined reference to
#           `fdt_simplefb_add_node'
#   ld.bfd: rpi.c:587:(.text.ft_board_setup+0x60): undefined reference to
#           `fdt_simplefb_enable_and_mem_rsv'
# The boot scripts additionally set `skip_board_fixup 1`, which stops
# ft_board_setup() from running at all — that is the primary defence; this line is
# the second one, and it is what keeps the VideoCore out of the display path.
# CONFIG_VIDEO_BCM2835 is not set
