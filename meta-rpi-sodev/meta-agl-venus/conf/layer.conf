# A layer for the AGL guest build only -- NOT part of the moulin/sodev Yocto series.
#
# build.sh's DomU(AGL) step adds this to the AGL build's bblayers.conf for --gpu=vulkan
# (the default) and removes it again for --gpu=gl. It exists because the four conf lines
# that give the AGL cluster rootfs a Venus ICD are necessary but not sufficient:
# scarthgap's mesa 24.0.7 cannot create a Vulkan instance on a QEMU virtio-gpu, and it
# suballocates host-visible memory in a way that corrupts it on this board. Fixing those
# needs source patches, which need a layer -- three against mesa and, for the cluster
# itself, a second Flutter embedder binary with the Vulkan backend, three Impeller patches
# and the systemd drop-in that actually runs that binary. See docs/VULKAN-VENUS.md
# section 7. It also sets the cluster's Virtual-1 output to the 1920x720 the device
# model shows (weston-ini-conf), with the dashboard filling it (its 0002) and the
# receiver window fitted into it (cluster-demo-config), and lets the compositor scan
# the cluster and the receiver out instead of composing them with the GPU: a fourth
# mesa patch (0004), libweston's LINEAR for virtio-gpu, the Vulkan embedder's 0002
# and the receiver's dma-buf window. Two more mesa patches (0005, 0006) let GL on zink
# import those buffers, for a compositor on zink (opt-in).
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rpi-sodev-agl-venus"
BBFILE_PATTERN_rpi-sodev-agl-venus := "^${LAYERDIR}/"
BBFILE_PRIORITY_rpi-sodev-agl-venus = "20"

# scarthgap: the AGL manifest's poky series. bitbake refuses a layer whose
# LAYERSERIES_COMPAT does not name the running series, so this pins the layer to the
# only build it is meant for.
LAYERSERIES_COMPAT_rpi-sodev-agl-venus = "scarthgap"

# This layer is bbappends plus one recipe (flutter-auto-vulkan, which requires
# meta-flutter's flutter-auto), so it is useless -- and its appends dangling --
# without the layers that own the recipes: oe-core for mesa, and meta-flutter
# (collection name "flutter-layer", agl/external/meta-flutter) for flutter-auto
# / flutter-engine, which is also where the flutter-auto-vulkan recipe's base
# version comes from.
# meta-agl-demo (collection "agldemo") owns flutter-cluster-dashboard, whose service
# this layer drops a Vulkan override into, cluster-receiver and cluster-demo-config;
# meta-agl-core ("aglcore") owns weston-ini-conf.
LAYERDEPENDS_rpi-sodev-agl-venus = "core flutter-layer agldemo aglcore"
