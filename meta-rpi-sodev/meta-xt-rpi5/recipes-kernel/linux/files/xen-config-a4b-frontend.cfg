# Kernel CONFIG override for the shared Dom0/DomD Image.
#
# The same Linux Image is used for both Dom0 and DomD. We need
# bidirectional Xen PV (both backend and frontend) plus modular GPU stack so
# Dom0 can blacklist vc4 while DomD loads it.

# === 1. Xen PV frontend (forced by xen-frontend-force.cfg, NOT set here) ===
# DomD = Linux PVH guest needs xen-blkfront + xen-netfront to mount root
# (phy:/dev/mmcblk0p2,xvda) and reach network (vif -> xenbr0), so both must be
# =y. NOT set in this fragment: upstream meta-xt-rpi5 xen-kernel-config.cfg sets
# them =n (old Zephyr Dom0 + dom0less DomD model) and, being appended from this
# recipe's __anonymous() at parse finalization, lands AFTER this fragment in
# SRC_URI -- so a =y here is unconditionally overridden to =n under merge_config
# (last-wins). The frontend =y is therefore forced from a SINGLE authoritative
# fragment, xen-frontend-force.cfg, appended strictly LAST (immediately after
# xen-kernel-config.cfg). Duplicating =y here only re-created the fragile 3-way
# override chain (a4b =y -> xen-kernel =n -> force =y), so the frontend symbols
# live solely in xen-frontend-force.cfg.

# === 2. Make vc4-drm modular (GPU audit) ===
# CONFIG_DRM_VC4=y in upstream rpi5 kernel makes modprobe.blacklist=vc4 a
# no-op — Dom0 binds HVS/HDMI/MOP/MOPLET via vc4-drm at boot, contradicting
# passthrough design. =m allows the Dom0 cmdline blacklist to actually work.
# DomD will modprobe vc4 at runtime via udev once the iomem/irq passthrough
# devices are exposed.
CONFIG_DRM_VC4=m

# === 3. Foreign-grant map on a direct-map DomD ===
# When the qemu virtio backend in DomD mmaps a DomU grant page,
# gnttab_alloc_pages() falls back to the balloon if CONFIG_XEN_UNPOPULATED_ALLOC
# is disabled. On a direct-map (GPA=PA 1:1) domain, a foreign grant cannot be
# overlaid on a balloon-out GFN (which is pinned to real RAM), so gntdev_mmap
# returns EINVAL ("gnttab: error: mmap failed: Invalid argument"). Enabling
# UNPOPULATED_ALLOC lets it use the hypervisor node's extended regions (our
# DomD already advertises 8) as scratch GPA (ZONE_DEVICE) for foreign maps,
# which succeeds even on direct-map. V4H DomD enables the same four configs.
# The unpopulated-alloc.c code is already merged upstream in 6.12 (which is
# why patches 0001-0003 are skipped); only the config enablement was missing.
# Dependency chain: XEN_UNPOPULATED_ALLOC -> ZONE_DEVICE -> MEMORY_HOTPLUG.
# All four must be =y in the same fragment, otherwise merge_config silently
# drops them on an unmet dependency (a trap). Does not affect direct-map / GPU
# passthrough (extended regions use unused GPA outside real RAM, so they do
# not clash with the 1:1 RAM mapping).
CONFIG_MEMORY_HOTPLUG=y
CONFIG_MEMORY_HOTREMOVE=y
CONFIG_ZONE_DEVICE=y
CONFIG_XEN_UNPOPULATED_ALLOC=y

# NOTE: CONFIG_RASPBERRYPI_FIRMWARE and CONFIG_BCM2835_MBOX are kept =y.
# Making them =m breaks the link of other built-in drivers (gpio-bcm-virt,
# clk-bcm2835, vc_mem, rtc-rpi, mmc-bcm2835) which call rpi_firmware_*
# symbols. Those built-in drivers do not bind to GPU devices, so leaving
# the firmware driver built-in is safe — only vc4-drm needs to be
# absent from Dom0, and =m + blacklist achieves that.

# === 4. Page size 16KB -> 4KB (gnttab grant mmap fix) ===
# Xen grants are always 4KB pages, and qemu/libxengnttab hardcode
# XC_PAGE_SIZE=4096. With a 16KB-page DomD kernel (ARM64_16K_PAGES=y, the
# bcm2712_defconfig default), kernel gntdev_mmap matches grant counts using
# vma_pages (16K units), the count mismatches, gntdev_find_map_index returns
# NULL, and mmap fails immediately with EINVAL, so the DomU virtio backend
# cannot map DomU grant pages and no video appears. The V4H DomD kernel runs
# ARM64_4K_PAGES=y, as does the stock RPi OS kernel with the same
# DRM_V3D/DRM_VC4 drivers; no 16K dependency exists in the GPU patch/dtso/recipe.
# Note: ARM64_VA_BITS_47 depends on PAGE_SIZE_16KB and cannot be selected at
# 4K, so it must move to VA_BITS_48 (V4H-proven); otherwise alldefconfig
# behaves nondeterministically. PGTABLE_LEVELS(=4)/PAGE_SHIFT(=12) are derived
# automatically by Kconfig from the page size.
CONFIG_ARM64_4K_PAGES=y
# CONFIG_ARM64_16K_PAGES is not set
# CONFIG_ARM64_VA_BITS_47 is not set
CONFIG_ARM64_VA_BITS_48=y

# === 5. i2c-brcmstb must stay modular (6.18 drift) ===
# 6.18 flips CONFIG_I2C_BRCMSTB to =y (its Kconfig "default ARCH_BCM2835||..."
# resolves true on rpi5), whereas 6.12 had it =m. Built-in means no
# kernel-module-i2c-brcmstb package, so the DomD image IMAGE_INSTALL of that
# module fails do_rootfs ("Unable to find a match"). Keep it modular to match
# the existing image package list and domd-gpu-init.service's ordered modprobe
# (i2c-brcmstb=DDC -> vc4 -> v3d). It is tristate, so =m is valid.
CONFIG_I2C_BRCMSTB=m

# === 6. Transparent Hugepage -> unlock V3D 64KB/1MB Super Pages ===
# kernel 6.13 added V3D MMU Big(64KB)/Super(1MB) page support (Maira Canal,
# TLB-miss reduction). The V3D driver gets those huge GEM buffers from gemfs,
# which it mounts with "huge=within_size" — but that mount option is a NOP
# unless CONFIG_TRANSPARENT_HUGEPAGE is enabled, so on our DomD .config
# (# CONFIG_TRANSPARENT_HUGEPAGE is not set) Super Pages are dead code. The
# bcm2712_defconfig leaves THP off; this fragment turns it on for the shared
# Dom0/DomD Image. Deps are already satisfied (CONFIG_MMU=y,
# CONFIG_HAVE_ARCH_TRANSPARENT_HUGEPAGE=y on arm64, # CONFIG_PREEMPT_RT is not
# set), so merge_config will not silently drop it. COMPACTION/XARRAY_MULTI/MM_ID
# are auto-selected by the menuconfig symbol.
#
# Pick the MADVISE sysfs default (huge pages only on explicit madvise(MADV_HUGEPAGE)
# / shmem huge= mounts), NOT ALWAYS: ALWAYS would let THP back arbitrary anon
# allocations system-wide and inflate the memory footprint of every domain. The
# sysfs default is a Kconfig "choice", so we must both set MADVISE=y and clear
# the other two members, otherwise the choice default (ALWAYS) wins / merge_config
# warns. gemfs uses huge= (shmem), which is honoured under MADVISE, so V3D Super
# Pages are reachable. THP MADVISE is opt-in only and does not touch the DomD
# direct-map (GPA==PA 1:1) layout: huge folios are allocated inside the existing
# RAM mapping via the page allocator, not new GPA regions, so there is no clash
# with Xen static-mem / GPU passthrough (which use unused GPA outside real RAM).
CONFIG_TRANSPARENT_HUGEPAGE=y
CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=y
# CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS is not set
# CONFIG_TRANSPARENT_HUGEPAGE_NEVER is not set
