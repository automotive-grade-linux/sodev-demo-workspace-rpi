# Force the Xen PV frontends ON, LAST-MERGED.
#
# Root cause (both screens black): merge_config consumes config fragments in final
# SRC_URI order, last-wins. The upstream meta-xt-rpi5 xen-kernel-config.cfg sets
#   CONFIG_XEN_BLKDEV_FRONTEND=n / CONFIG_XEN_NETDEV_FRONTEND=n
# and is appended to SRC_URI from this recipe's python __anonymous() at parse
# finalization, which lands it AFTER the static `SRC_URI:append` for
# xen-config-a4b-frontend.cfg (frontend=y). Verified via `bitbake -e`:
#   100: xen-config-a4b-frontend.cfg  (=y)
#   105: xen-config-a4b-frontend.cfg  (=y)
#   180: xen-kernel-config.cfg               (=n)  <- last, overrode =y to =n
# Result: DomD (Linux PVH guest) had no xen-blkfront -> cannot mount
# phy:/dev/mmcblk0p3 root, and no xen-netfront -> no vif/network. Both guest
# display paths depend on these (blkfront=guest disk, netfront=vif), so both
# screens stayed black.
#
# Fix: this 2-line fragment is appended INSIDE the same __anonymous(), strictly
# AFTER xen-kernel-config.cfg, so it is the very last frontend statement merge_config
# sees -> =y wins deterministically. Keep this minimal (only the two frontend
# symbols) so it cannot perturb any other config.
CONFIG_XEN_BLKDEV_FRONTEND=y
CONFIG_XEN_NETDEV_FRONTEND=y
