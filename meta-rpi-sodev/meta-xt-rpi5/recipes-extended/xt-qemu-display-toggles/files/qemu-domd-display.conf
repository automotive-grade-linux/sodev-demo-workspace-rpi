# DomD display-path switches for the DomA device model, created at boot. Only qemu 11.1.2
# reads them (q11-063, q11-066, q11-071, q11-081); with qemu 10.0.2 they do nothing. qemu
# checks each file at most once a second, and removing one turns that feature off. The
# Raspberry Pi 4 layer's copy of this file has nine; this board gets the eight that do not
# depend on the Pi 4's hardware, and one of its own:
#   plane-handoff: the HMI case's guest planes on weston subsurfaces instead of qemu's GL
#       blend -- on the RPi4, local 720p HMI 52 -> 57 fps, a streamed video in the HMI
#       33 -> 42 (q11-066)
#   media-sg-rw: virtio-media copies the guest's scatter-gather buffers through the
#       mapcache instead of mapping and unmapping each entry (q11-063)
#   fb-invalidate: qemu's GL blit invalidates a destination it fully covers instead of
#       clearing it, when v3d draws the blit -- one clear job and a full tile load less
#       in Mesa's v3d (q11-063)
#   isp-scanout, isp-scanout-depth, sand-scanout: the decoder's NV12 SAND buffer goes on
#       an HVS plane when DomA shows a frame alone, full screen and unscaled (sand-scanout
#       is q11-071's, in decoder mode; the other two are q11-063's display side); depth 2
#       frames queued, as on the Pi 4.
#   isp-skip-copy, sand-skip-isp: while that holds, the GPU conversion of the frame into
#       DomA's buffer is skipped and made late if the display stops taking the buffers
#       (sand-skip-isp is q11-071's, isp-skip-copy q11-063's).
#   Measured on the Raspberry Pi 5 8GB (2026-10-15, HEVC 1080p60 full screen, DomA on GL,
#   codec -T): V3D render 62.9% -> 41.7% with the first three, 17.9-18.3% with all five
#   (17.1% with nothing playing), 60.9-61.2 fps.
#   plane-sand: a plane of the plane handoff whose texture the decoder filled gets the
#       decoder's SAND buffer instead of the texture's export (q11-081), so the video of
#       the WebView layout, under the app's window or among the HMI, goes on an HVS plane
#       and its conversion can be skipped as in the full-screen case.
#   With plane-sand, should DomA's own GPU composition take the video meanwhile (a
#   screenshot, a client composition), it sees, for a frame whose conversion was skipped,
#   what the texture was last converted to, an older frame. A second video DomA composes
#   on its GPU, on no plane, is not skipped: only a decoder whose buffer the display took
#   skips.
# Left out: media-isp drives the Pi 4's bcm2835 ISP over VCHIQ, which this SoC's device
# tree has no node for.
f /run/qemu-media-sg-rw 0644 root root -
f /run/qemu-fb-invalidate 0644 root root -
f /run/qemu-plane-handoff 0644 root root -
f /run/qemu-isp-scanout 0644 root root -
f /run/qemu-isp-scanout-depth 0644 root root - 2
f /run/qemu-sand-scanout 0644 root root -
f /run/qemu-isp-skip-copy 0644 root root -
f /run/qemu-sand-skip-isp 0644 root root -
f /run/qemu-plane-sand 0644 root root -
