# DomD display-path switches for the DomA device model, created at boot. Only qemu 11.1.2
# reads them (q11-063, q11-066); with qemu 10.0.2 they do nothing. qemu checks each file at
# most once a second, and removing one turns that feature off. The Raspberry Pi 4 layer's
# copy of this file has nine; this board gets the three that act on it:
#   plane-handoff: the HMI case's guest planes on weston subsurfaces instead of qemu's GL
#       blend -- on the RPi4, local 720p HMI 52 -> 57 fps, a streamed video in the HMI
#       33 -> 42 (q11-066)
#   media-sg-rw: virtio-media copies the guest's scatter-gather buffers through the
#       mapcache instead of mapping and unmapping each entry (q11-063)
#   fb-invalidate: qemu's GL blit invalidates a destination it fully covers instead of
#       clearing it, when v3d draws the blit -- one clear job and a full tile load less
#       in Mesa's v3d (q11-063)
# Left out: media-isp drives the Pi 4's bcm2835 ISP over VCHIQ, which this SoC's device
# tree has no node for, and the other five act only on a buffer the Pi 4's proxy hands
# over (the ISP's, or SAND with its host-sand): the decoder mode this board uses hands
# none to the display. Not measured on this board yet.
f /run/qemu-media-sg-rw 0644 root root -
f /run/qemu-fb-invalidate 0644 root root -
f /run/qemu-plane-handoff 0644 root root -
