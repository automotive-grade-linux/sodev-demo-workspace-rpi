# Hypervisor Kconfig fragment: the BCM2712 (Raspberry Pi 5) passthrough quirks
# added by 4.22-0001-working-delta-rebased.patch. Every one of them defaults to
# n / 0 in xen/arch/arm/Kconfig, so this fragment is what turns them on; a build
# without it gets unmodified upstream ARM behaviour.
#
# All four are UNSUPPORTED-gated, so this fragment only takes effect together
# with xen-hyp-config.cfg (CONFIG_UNSUPPORTED=y) and must be listed after it --
# otherwise olddefconfig silently drops these lines. See the same note on
# xen-config-ioreq.cfg.

# Map the hardware domain's device MMIO Device-nGnRE instead of
# Normal-Cacheable. BCM2712 pad-config registers raise an IMP-DEF asynchronous
# SError (ESR=0xbffb936f) on the first cached writel(); the main pinctrl at
# 0x10_7d504100 is where it shows up under a Linux Dom0.
CONFIG_XT_HWDOM_MMIO_DEVICE_ATTR=y

# Let the hardware domain's toolstack forward host SPIs and device MMIO to DomD.
# The devices DomD drives are marked "xen,passthrough", so they are absent from
# Dom0's irq_caps/iomem_caps and xc_domain_{irq,iomem}_permission() returns
# -EPERM without this.
CONFIG_XT_HWDOM_PASSTHROUGH_CAPS=y

# The window granted above: 4 GiB (just past the top of RAM) to 128 GiB. BCM2712
# puts the peripherals DomD needs high in a 40-bit space -- the HVS sits at
# 0x10_7c580000, about 66 GiB -- so a window that stops at 8 GiB covers none of
# them.
CONFIG_XT_HWDOM_IOMEM_CAP_START=0x100000000
CONFIG_XT_HWDOM_IOMEM_CAP_END=0x2000000000

# BCM2712's GIC-400 implements 320 lines, so a guest that is handed host SPIs
# needs nr_spis >= 288 for its vGIC and allocated_irqs bitmap to reach them.
# DomA's xl.cfg forwards absolute IRQ 282 (V3D core0); with libxl's own smaller
# nr_spis, gic_route_irq_to_guest() trips ASSERT(virq < vgic_num_irqs(d)).
CONFIG_XT_GUEST_MIN_NR_SPIS=288

# Every BCM2712 SPI is active-high level, which is also the GICv2 reset state.
# A passthrough device is never probed by Dom0, so nothing ever calls
# gic_set_irq_type() for its IRQ and the route would be rejected with -EINVAL
# ("IRQ 65 has not been configured").
CONFIG_XT_GUEST_PASSTHROUGH_IRQ_TYPE_DEFAULT=y
