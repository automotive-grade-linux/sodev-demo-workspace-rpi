# Hypervisor Kconfig fragment for the RPi5 dom0less/disaggregated design.
# Matches the hardware-proven xen-troops fork (xen-4.21-xt-gen5) .config; the
# stock meta-virtualization defconfig lacks all of these (they are EXPERT/
# UNSUPPORTED-gated), and without them the first hardware boot panics:
#   "direct-map is not valid for domain domD without static allocation."
CONFIG_XSM=y
# EXPERT/UNSUPPORTED unlock the gated options below. Without them,
# merge_config.sh accepts the lines but olddefconfig silently DROPS them
# (this is exactly how xen-config-ioreq.cfg alone failed to take effect).
CONFIG_EXPERT=y
CONFIG_UNSUPPORTED=y
# The DomD dom0less node (bcm2712-raspberrypi5-xen.dtso) uses direct-map +
# xen,static-mem banks; parsing xen,static-mem requires STATIC_MEMORY.
CONFIG_STATIC_MEMORY=y
# The DomD node also sets xen,tee = "optee".
CONFIG_TEE=y
CONFIG_OPTEE=y
