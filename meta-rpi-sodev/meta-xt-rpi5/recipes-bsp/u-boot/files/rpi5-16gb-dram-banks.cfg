# RPi5 16GB: firmware DT lists DRAM above 4GB in 2GB-sized banks
# (observed on real board: 0x0-0x3fbfffff / 0x40000000-0xffffffff /
#  0x100000000-0x17fffffff / 0x180000000-0x1ffffffff / ...).
# The default CONFIG_NR_DRAM_BANKS=4 makes both
#   - fdtdec_setup_memory_banksize() (lib/fdtdec.c, fills bd->bi_dram), and
#   - arch_fixup_fdt() -> fdt_fixup_memory_banks() (arch/arm/lib/bootm-fdt.c,
#     re-writes /memory in the DTB passed to Xen via booti)
# truncate the memory node to the first 4 banks = exactly 8GB on the 16GB
# SKU. Raise the limit so all firmware banks are propagated to Xen.
CONFIG_NR_DRAM_BANKS=16
