# Keep U-Boot out of the display path: DomD's vc4-drm owns HDMI from boot.
#
# During `booti`, board/raspberrypi/rpi/rpi.c ft_board_setup() adds a /framebuffer
# node and, to fill its reg, probes the first UCLASS_VIDEO device: VIDEO_BCM2835,
# which asks the VideoCore mailbox to allocate a framebuffer, so the firmware
# programs HDMI before DomD modesets. Without the driver there is no video device,
# nothing is asked of the VideoCore, and the node stays an empty disabled stub.
# The boot scripts also set `skip_board_fixup 1`, which stops ft_board_setup().
#
# Do NOT unset CONFIG_VIDEO or CONFIG_FDT_SIMPLEFB instead: rpi.c calls
# fdt_simplefb_add_node() and fdt_simplefb_enable_and_mem_rsv() unguarded, and
# the link fails (the same as meta-xt-rpi4's rpi4-bcm2711.cfg).
# CONFIG_VIDEO_BCM2835 is not set
