# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory containing .bb and .bbappend files, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb \
            ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "xt-rpi5"
BBFILE_PATTERN_xt-rpi5 := "^${LAYERDIR}/"
BBFILE_PRIORITY_xt-rpi5 = "10"

LAYERSERIES_COMPAT_xt-rpi5 = "wrynose"
# [4.22] xt-domx is a real dependency: meta-virtualization master stops at
# xen_4.21.bb, so the xen_4.22.bb that recipes-extended/xen/xen_4.22.bbappend
# attaches to is the interim local copy in meta-xt-common/meta-xt-domx. Without
# this a component that drops xt-domx would leave the bbappend attached to
# nothing, and bitbake only warns about unused bbappends. Drop it again once the
# 4.22 recipes are accepted upstream and the local copies are deleted.
LAYERDEPENDS_xt-rpi5 = "core xt-security raspberrypi xt-domx"
