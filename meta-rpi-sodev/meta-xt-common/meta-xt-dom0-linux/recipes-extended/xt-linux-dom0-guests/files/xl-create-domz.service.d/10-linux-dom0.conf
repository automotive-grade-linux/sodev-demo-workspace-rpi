# SPDX-License-Identifier: Apache-2.0
# [DOM0_OS=linux] Override for the thin-Linux control Dom0. Shipped ONLY into the
# Dom0-thin image (via xt-linux-dom0-guests), so the DomD-rootfs copy of
# xl-create-domz.service used by the zephyr flavour is untouched.
#
# The base unit requires domd-toolstack-prep.service, which seeds the non-standard
# Zephyr xenstore and exists only in the DomD rootfs; a Linux Dom0 runs the real
# toolstack instead. As for xl-create-domu/doma, a drop-in cannot remove the base
# Requires=, so xt-linux-dom0-guests also ships a no-op domd-toolstack-prep stub
# that keeps it satisfiable.
#
# Unlike the DomU/DomA drop-ins there is no xl-attach-disks dependency: DomZ has no
# disk at all (domz.cfg: disk = []), it boots the raw Zephyr binary that xl reads
# from SD p1 in the toolstack domain itself.
[Unit]
Requires=xenstored.service
After=xenstored.service
