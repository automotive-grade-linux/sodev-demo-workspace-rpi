# SPDX-License-Identifier: Apache-2.0
# [DOM0_OS=linux] Override for the thin-Linux control Dom0. This drop-in is shipped
# ONLY into the Dom0-thin image (via xt-linux-dom0-guests), so the DomD-rootfs
# copy of xl-create-domu.service used by the zephyr flavour is untouched.
#
# The base unit has Requires=domd-toolstack-prep.service, which seeds the
# non-standard Zephyr xenstore and exists only in the DomD rootfs. A Linux Dom0
# instead runs the real toolstack (xenstored) and, because it owns the SD while
# DomD is dom0less, must block-attach the DomU rootfs partition to DomD first
# (xl-attach-disks.service). Add those deps here.
#
# NOTE: a drop-in cannot *remove* the base unit's Requires=domd-toolstack-prep
# (an empty "Requires=" reset does not clear a main-file entry -- verified on
# systemd 255). So xt-linux-dom0-guests also ships a no-op domd-toolstack-prep.service
# stub for the thin-Linux Dom0, which keeps that requirement satisfiable.
[Unit]
Requires=xenstored.service xl-attach-disks.service
After=xenstored.service xl-attach-disks.service
