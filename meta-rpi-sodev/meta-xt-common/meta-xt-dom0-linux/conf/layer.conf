# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "xt-dom0"
BBFILE_PATTERN_xt-dom0 := "^${LAYERDIR}/"
# Priority 17: this layer's xen-tools/systemd/libsdl2
# bbappends must apply after the meta-virtualization / oe-core bases they
# override. Kept below meta-xt-driver-domain (20) / meta-xt-doma (21).
BBFILE_PRIORITY_xt-dom0 = "17"

# [4.22] xt-domx is a real dependency: meta-virtualization master stops at
# xen-tools_4.21.bb, so the xen-tools_4.22.bb that
# recipes-extended/xen-tools/xen-tools_4.22.bbappend attaches to is the interim
# local copy in meta-xt-common/meta-xt-domx. Without this a component that drops
# xt-domx would leave the bbappend attached to nothing, and bitbake only warns
# about unused bbappends. Drop it again once the 4.22 recipes are accepted
# upstream and the local copies are deleted.
LAYERDEPENDS_xt-dom0 = "core virtualization-layer xt-domx"
LAYERSERIES_COMPAT_xt-dom0 = "wrynose"
