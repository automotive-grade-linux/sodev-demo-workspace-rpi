# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "xt-dom0"
BBFILE_PATTERN_xt-dom0 := "^${LAYERDIR}/"
# Priority 17: this layer's xen-tools/systemd/libsdl2
# bbappends must apply after the meta-virtualization / oe-core bases they
# override. Kept below meta-xt-driver-domain (20) / meta-xt-doma (21).
BBFILE_PRIORITY_xt-dom0 = "17"

LAYERDEPENDS_xt-dom0 = "core virtualization-layer"
LAYERSERIES_COMPAT_xt-dom0 = "wrynose"
