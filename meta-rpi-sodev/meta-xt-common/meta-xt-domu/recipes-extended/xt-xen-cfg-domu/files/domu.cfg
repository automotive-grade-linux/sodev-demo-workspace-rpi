# DomU (AGL Cluster IC) xl configuration.
# CONFIG_IOREQ_SERVER=y is required in the RPi5 Xen build so the qemu virtio-pci
# backend reaches the guest.

seclabel='system_u:system_r:domU_t'

name = "DomU"
# Split kernel + ext4 rootfs layout:
#   kernel = build-domu Image (torvalds 6.8.0-rc1, the DomU kernel V4H AGL SoDeV
#       historically used — the current V4H submodule moved to 6.12 — plus
#       RPi5 FORCE_GRANT; MACHINE=virtio-armv8-xt)
#       copied to SD p1 (FAT) as linux-domu; xl-create-domu.service mounts /mnt.
#   rootfs = core-image-weston ext4 dd'd to SD p3; domd.cfg phy:mmcblk0p3 -> xvdb
#       -> qemu virtio-blk -> DomU /dev/vda (root=/dev/vda + device_model_args
#       -drive xvdb below).
kernel = "/mnt/linux-domu"
memory = 1024
vcpus = 1
# Boot-time CPU map: DomU -> pcpu 1 (shares cpu1 with DomD; AAOS gets 2-3,
# Dom0 gets 0). Pinning at create keeps DomU off the AAOS cores so the two
# guests stop thrashing each other during the parallel boot.
cpus = "1"
device_model_version = "qemu-xen"
on_crash = 'preserve'

extra = "root=/dev/vda rw rootwait console=hvc0 cma=256M"

# 7 virtio devices on PCIe bus 0. transport=pci goes through xen-troops xt0.2
# libxl make_vpci_node so Xen emulates the ECAM bus and forwards MMIO traps to
# qemu via IOREQ.
virtio = [
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:01.0, grant_usage=1, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:02.0, grant_usage=1, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:03.0, grant_usage=1, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:04.0, grant_usage=1, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:06.0, grant_usage=1, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:05.0, grant_usage=1, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:07.0, grant_usage=1, backend_type=qemu',
]

# DomU rootfs = SD p3 (GPT partlabel "domu", ext4). The DomD-side qemu backs the
# virtio-blk directly from /dev/mmcblk0p3 (see -drive below).
device_model_args = [
    '-device', 'virtio-net-pci,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=1,romfile=,id=nic0,netdev=net0,mac=08:00:27:ff:cb:c2',
    '-netdev', 'type=tap,id=net0,ifname=vif-emu2,br=xenbr0,script=no,downscript=no,vhost=off',
    '-device', 'virtio-keyboard-pci,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=2',
    '-audiodev', 'none,id=snd0',
    '-device', 'virtio-snd-pci,audiodev=snd0,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=3',
    '-device', 'virtio-gpu-gl-pci,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=4,xres=1920,yres=720',
    '-display', 'sdl,gl=es',
    # '-full-screen' removed: SDL sends set_fullscreen for wl_output@0 (HDMI-A-1),
    # overriding the kiosk-shell app-id output routing (weston.ini app-ids=).
    # kiosk-shell configures every window to the full output, so full-screen
    # display is preserved without it.
    '-vga', 'std',
    # vhost-vsock-pci (guest-cid=4, addr=6) removed: cluster does not use vsock,
    # and the vhost_xen kernel module permanently latches the first vsock guest's
    # domid, so a vsock-equipped DomU starting first would break DomA's vsock
    # (AAOS VHAL requires vsock CID2). The bdf 0000:00:06.0 entry in virtio=[] is
    # kept: DomU boots fine with no matching qemu device (it is only a libxl vpci
    # node reservation and is harmless).
    '-device', 'virtio-tablet-pci,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=7',
    '-d', 'guest_errors',
    # LAB/DEMO ONLY: the qemu monitor is unauthenticated. It is bound to
    # loopback (127.0.0.1) inside DomD so it is not reachable off-board; do not
    # expose it on a routable address in any non-lab build.
    '-monitor', 'telnet:127.0.0.1:1235,server,nowait',
    '-global', 'virtio-mmio.force-legacy=false',
    '-device', 'virtio-blk-pci,scsi=off,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=5,drive=image',
    '-drive', 'if=none,id=image,format=raw,file=/dev/mmcblk0p3',
    '-name', 'DomU',
]

qemu_envs = [
    'WAYLAND_DISPLAY=wayland-0',
    'XDG_RUNTIME_DIR=/run',
    'SDL_VIDEODRIVER=wayland',
    'SDL_VIDEO_WAYLAND_WMCLASS=qemu-system-aarch64-domu',
]

disk = []

# DomU's NIC is the virtio-net-pci above (MAC 08:00:27:ff:cb:c2 -> DomD dnsmasq
# lease 192.168.10.12). A PV vif with the same MAC would be redundant/conflicting.
vif = []
