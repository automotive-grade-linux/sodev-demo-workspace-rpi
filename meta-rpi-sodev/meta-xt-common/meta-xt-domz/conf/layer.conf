# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "xt-domz"
BBFILE_PATTERN_xt-domz := "^${LAYERDIR}/"
BBFILE_PRIORITY_xt-domz = "8"

LAYERDEPENDS_xt-domz = "core"
LAYERSERIES_COMPAT_xt-domz = "wrynose"
