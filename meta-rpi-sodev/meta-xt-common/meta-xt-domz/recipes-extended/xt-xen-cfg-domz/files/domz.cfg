# SPDX-License-Identifier: Apache-2.0
# DomZ (Zephyr RTOS domain) xl configuration.
#
# DomZ is Zephyr built for its own Xen-guest board (`xenvm`) and started as an
# ordinary unprivileged guest by the xl toolstack -- DomD in the Zephyr-Dom0
# flavour, Dom0 in the thin-Linux one. It is deliberately the simplest domain in
# the cockpit: no display, no block device, no network, no device model.

seclabel='system_u:system_r:domU_t'

name = "DomZ"

# The Zephyr image, staged on SD p1 (FAT) by the moulin domz component as
# zephyr-domz.bin; xl-create-domz.service mounts p1 at /mnt first.
#
# Why a .bin works here, rather than an ELF: libxc probes the kernel with four
# loaders (elf / arm-zimage / bin / arm), and Zephyr's arm64 output carries a
# Linux arm64 Image header - "ARM\x64" (0x644d5241) at offset 0x38 - so
# xc_dom_probe_zimage64_kernel() claims it. Verified on the built artifact:
#   $ xxd -s 0x38 -l 4 zephyr.bin  ->  41 52 4d 64
# (The multiboot `bin` loader would NOT take it: it requires a multiboot header.
# So do not replace this with some other raw blob and expect it to load.) The
# image is linked to run at 0x40000000, which is Xen's GUEST_RAM0_BASE, so it
# lands where the header asks to be loaded.
kernel = "/mnt/zephyr-domz.bin"

# 16 MiB, matching the xenvm board's memory@40000000 (label `ram`) node (DT_SIZE_M(16)). Zephyr
# uses a static memory map, so this is not a tunable: raising it here alone would
# just leave the extra memory unused, and lowering it would put the guest RAM
# bank below what the image was linked for.
memory = 16
vcpus = 1

# pCPU 0 carries Dom0 and DomD's first vCPU, and that is deliberately where DomZ
# goes: Dom0 in the Zephyr flavour is an xenstore server and nothing else (it spent
# 6 s of CPU in a session measured on 2026-08-19), so the only real competition on
# this core is DomD's own vCPU 0.
#
# It used to be pCPU 3, which is one of DomA's cores, and that was the wrong
# neighbour. Measured on rpi5 on 2026-08-19: while the AAOS guest boots it wants
# 1.6-2.3 cores and the four-core board reaches 370-380% busy, so a domain sharing
# a core with it inherits the scheduling latency of the heaviest guest in the
# cockpit. DomZ needs almost nothing (0.1 s of CPU for a whole session at the
# default 10 s heartbeat), so what matters for it is not throughput but not sitting
# behind Android.
#
# THE REST OF THE MAP IS NOT THE SAME ON BOTH BOARDS, so do not read a fixed
# layout out of this file:
#   rpi5: Dom0 -> 0, DomD -> 0-1, DomU -> 1,  DomA -> 2-3,  DomZ -> 0
#   rpi4: Dom0 -> 0, DomD -> 0-1, DomU -> 2,  DomA -> 2-3,  DomZ -> 0
#         (meta-xt-rpi4's xt-xen-cfg-domu bbappend moves DomU off DomD's cores;
#          its measurements are in that file)
#
# pCPU 0 is not a real-time-clean core either -- DomD's backends and interrupt work
# run on 0-1. If DomZ is ever given hard real-time work it needs a core no one else
# has, and how to get one differs per board: on rpi5 narrow DomA to "2" and put DomZ
# on 3; on rpi4 core 3 is DomA's second core and 2 is DomU's, so move DomU back to 1
# first. Move exactly one domain at a time -- the same rpi4 bbappend suggests giving
# DomA "3 only", and doing both at once would put DomZ back on DomA's single core.
cpus = "0"

# Both boards are GIC-400, i.e. GICv2 (BCM2712 and BCM2711 alike), and neither
# host has usable vGICv3 emulation (Xen: "vGICv3 is not supported on this
# platform" -> create rc=-19). This is also why the DomZ image is built for the
# plain `xenvm` board rather than `xenvm_gicv3`.
gic_version = "v2"

# preserve keeps a crashed DomZ around for `xl dmesg`/`xl console` post-mortem,
# and that has a cost worth stating: Zephyr's fatal path ends in
# arch_system_halt(), which SPINS. A crashed DomZ therefore keeps its vCPU
# runnable and pegs pCPU 3 at 100% -- and with -a that is a core DomA is also
# scheduled on, so one of DomA's two vCPUs loses half its CPU until someone runs
# `xl destroy DomZ`. Change to 'destroy' if unattended behaviour matters more
# than the post-mortem.
on_crash = 'preserve'
on_reboot = 'restart'
on_poweroff = 'destroy'

# No device model. Zephyr on this board uses only the Xen PV console (the
# xen,hvc-uart node), so libxl has no reason to spawn qemu -- and must not: a
# device model would just be an idle process holding DomD memory. Leaving all
# three lists empty is what keeps `xl create` from starting one.
# Console access: `xl console DomZ` from the toolstack domain.
virtio = []
disk = []
vif = []
