# This layer vendors the OE-core qemu 7.0.0 recipe set with its SRC_URI
# re-pinned to the xen-troops qemu fork (gitsm://github.com/xen-troops/qemu.git,
# branch v7.0.0-xt, fixed SRCREV) so the qemu used as the guest device-model
# (DomD) stays at that fork's 7.0.0. That is the version the
# xen-troops / V4H AGL SoDeV reference validated and against which the DomD
# qemu patch series (virtio-input BTN_TOUCH etc. in
# meta-xt-driver-domain/recipes-qemu/qemu/qemu_%.bbappend) applies cleanly; the
# newer wrynose-base qemu changed hw/input/virtio-input-hid.c so those patches
# do not apply. Reducing this to a bbappend on the base qemu is a follow-up that
# requires re-porting the patch series and a full build+HW re-verify.
#
# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "xt-qemu"
BBFILE_PATTERN_xt-qemu := "^${LAYERDIR}/"
BBFILE_PRIORITY_xt-qemu = "10"

LAYERDEPENDS_xt-qemu = "core"
LAYERSERIES_COMPAT_xt-qemu = "wrynose"
