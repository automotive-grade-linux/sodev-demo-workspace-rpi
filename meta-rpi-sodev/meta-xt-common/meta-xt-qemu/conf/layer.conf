# This layer carries the guest device model (DomD's qemu) in three versions, all
# in recipes-qemu/qemu/, chosen by PREFERRED_VERSION_qemu in the domd conf (the
# moulin yaml writes it; XT_DOM0_QEMU_VERSION does the same for a linux Dom0):
#   - qemu_7.0.0.bb: the vendored OE-core 7.0.0 recipe set (qemu.inc and its
#     includes) with SRC_URI re-pinned to the xen-troops fork, branch v7.0.0-xt,
#     fixed SRCREV. The version the xen-troops / V4H AGL SoDeV reference
#     validated; its DomD patches are the 0101..0112 set that
#     meta-xt-driver-domain/recipes-qemu/qemu/qemu_%.bbappend adds for PV 7.x.
#   - qemu_10.0.2.bb: the same fork's v10.0.2-xt branch, for Venus (virtio-gpu-gl's
#     venus= property exists from 9.2.0), carrying the 0NNN patches in qemu/.
#   - qemu_11.1.2.bb: the upstream 11.1.2 release tarball with the q11-NNN patches
#     in qemu-11.1.2/, the port of the 0NNN series plus everything written since;
#     the default for both boards' vulkan lanes.
# The 10.0.2 and 11.1.2 recipes take their body from oe-core's qemu_10.2.0.bb
# through BBPATH; each recipe's header says what it changes. qemu_%.bbappend here
# sets QEMU_TARGETS and the vmsep package split for all three.
#
# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "xt-qemu"
BBFILE_PATTERN_xt-qemu := "^${LAYERDIR}/"
BBFILE_PRIORITY_xt-qemu = "10"

LAYERDEPENDS_xt-qemu = "core"
LAYERSERIES_COMPAT_xt-qemu = "wrynose"
