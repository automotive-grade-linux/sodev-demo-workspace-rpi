# Local copy of meta-raspberrypi's recipes-kernel/linux/files/android-drivers.cfg
# (MIT), duplicated for the same FILESPATH reason as powersave.cfg.
# Delta from upstream: `#CONFIG_ANDROID_BINDERFS` is written as
# `# CONFIG_ANDROID_BINDERFS is not set`. The space is functional -- merge_config
# only honours the spaced form, so upstream's spelling left the symbol at its
# default instead of disabling it.
# CONFIG_ANDROID_BINDERFS is not set
CONFIG_ANDROID_BINDER_IPC=y
CONFIG_ANDROID_BINDER_DEVICES="binder"
