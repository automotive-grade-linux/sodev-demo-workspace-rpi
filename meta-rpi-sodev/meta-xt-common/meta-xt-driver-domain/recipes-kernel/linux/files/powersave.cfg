# Local copy of meta-raspberrypi's recipes-kernel/linux/files/powersave.cfg (MIT).
# It has to be duplicated here because linux-raspberrypi.inc adds it to SRC_URI
# unconditionally while FILESPATH is rooted at this recipe's own directory.
# Delta from upstream: the hibernation symbols (HIBERNATION, HIBERNATE_CALLBACKS,
# PM_STD_PARTITION, ARCH_HIBERNATION_HEADER, PM_AUTOSLEEP) are dropped -- a Xen
# guest or driver domain cannot hibernate the machine.
CONFIG_SUSPEND=y
CONFIG_SUSPEND_FREEZER=y
# Hibernation (suspend-to-disk) is intentionally disabled: this is the shared
# Dom0/DomD kernel and mmcblk0p2 is the live rw DomD rootfs, so a hibernation
# image written there would risk filesystem corruption. Suspend-to-RAM stays on.
# CONFIG_HIBERNATION is not set
CONFIG_PM_SLEEP=y
CONFIG_PM_SLEEP_SMP=y
# CONFIG_PM_AUTOSLEEP is not set
CONFIG_PM_WAKELOCKS=y
CONFIG_PM_WAKELOCKS_LIMIT=100
CONFIG_PM_WAKELOCKS_GC=y
CONFIG_PM_GENERIC_DOMAINS_SLEEP=y
