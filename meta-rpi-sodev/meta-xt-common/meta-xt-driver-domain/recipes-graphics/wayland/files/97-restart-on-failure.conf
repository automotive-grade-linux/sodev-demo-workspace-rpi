[Unit]
# The window must exceed the worst-case attempt duration, otherwise the burst
# counter is reset before it can ever fill and the unit restarts for ever. With
# 98-no-watchdog.conf's TimeoutStartSec=120, a start that times out takes ~122 s,
# so a 60 s window could never accumulate two failures: weston would have
# re-taken and released DRM master and re-run TTYVTDisallocate on tty7 every two
# minutes, indefinitely. 600 s covers four timed-out attempts.
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
# Weston startup SEGV workaround.
#
# On boot, weston.service can crash with SIGSEGV (~541ms) when:
#   1. the kernel allocates a 1920x1200 fbcon framebuffer at boot
#   2. systemd graphical.target starts weston.service
#   3. weston acquires DRM master -> atomic modeset conflicts with fbcon -> SEGV
# A manual `systemctl start weston.service` always succeeds once fbcon is
# inactive.
#
# Workaround: auto-restart 2 seconds after the SEGV; the second attempt
# succeeds reliably because fbcon has settled. A proper fix belongs upstream
# (weston fbcon detach) or in systemd unit sequencing.
Restart=on-failure
RestartSec=2
