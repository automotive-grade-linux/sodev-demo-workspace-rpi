[Service]
# A delayed vc4-drm atomic page-flip can trip weston's systemd watchdog and get
# the compositor SIGKILLed. With a fake clock and start.elf-managed HDMI an
# atomic commit can take a while, so disable the watchdog as a safeguard.
WatchdogSec=0
# Generous but FINITE start timeout. This must not be 0 ("no timeout logic"):
# the unit is Type=notify and weston.socket gates graphical.target, so a
# compositor that never reaches ready would block that target for ever instead
# of failing and letting the 97-restart-on-failure drop-in retry.
TimeoutStartSec=120
