# DomD compositor config (V4H meta-xen-domd-virtio pattern).
#
# kiosk-shell app-ids routing: each [output] lists app-ids=X and kiosk-shell
# binds a surface to that output when its app-id matches the
# SDL_VIDEO_WAYLAND_WMCLASS the guest's qemu exports:
#   SDL_VIDEO_WAYLAND_WMCLASS=qemu-system-aarch64-domu  -> HDMI-A-1 (DomU cluster)
#   SDL_VIDEO_WAYLAND_WMCLASS=qemu-system-aarch64-doma  -> HDMI-A-2 (DomA / AAOS)
# In domu.cfg the WMCLASS is overridden explicitly via qemu_envs.

[core]
backend=drm-backend.so
shell=kiosk-shell.so
# DomD's own libinput seat can legitimately be empty at start-up: the RP1 USB
# touch controller enumerates asynchronously and, in a guest-less or headless
# bring-up, is not present at all. Without this weston exits instead of waiting.
# It does NOT mean DomD never sees input -- when the touchscreen is attached DomD
# is exactly where it lands, and 72-rp1-touch-output.rules (rp1-touch-bridge)
# tags it WL_OUTPUT=HDMI-A-2 so weston forwards the events to DomA's surface.
require-input=false
# weston's default 300s idle would DPMS-off both HDMI outputs and never wake them
# again when no input arrives (the demo is watched, not touched, for minutes at a
# time) -- that was the "NO SIGNAL" cause.
idle-time=0
# NB: no renderer= line. Leaving it unset selects gl-renderer, which is what
# routes the guest surfaces through Mesa V3D. Setting renderer=pixman here would
# silently drop the whole demo onto the CPU rasteriser.

[keyboard]
keymap_layout=us

# BOTH outputs pin an explicit modeline rather than selecting a mode by size, and
# that is load-bearing: `mode=<WxH>` only matches a mode that is already in the
# connector's list when weston enumerates it, and it fails SILENTLY to the first
# fallback mode when it is not. Forcing a modeline creates the mode unconditionally,
# so neither output depends on when the EDID happens to arrive.
#
# HDMI-A-1 has no EDID at all (modetest reports an empty EDID blob), so its list is
# just the generic DRM fallback set headed by 1024x768 -- 1920x720 can only exist
# here as a forced modeline.
#
# HDMI-A-2 does have a valid 256-byte EDID (make PNP(RTD), model "12.3FHD") whose
# preferred DTD is exactly the 93.24 MHz timing below, but reading it loses a race
# against weston's start-up. Observed on hardware: weston enumerated the head at
# t=14.824 with "EDID make 'unknown'" and only the no-EDID fallback list, so
# `mode=1920x720` matched nothing and the output came up at 1024x768; the real EDID
# arrived 3.6 s later at t=18.451 and weston logged "Detected a monitor change on
# head 'HDMI-A-2', not bothering to do anything about it", after which every atomic
# commit failed with "Invalid argument". The panel is fixed-timing 1920x720, so it
# showed nothing, and the wrong output size also propagated into the Android guest
# through virtio-gpu ui_info (`wm size` reported 1024x768).
#
# Do not replace either of these with `mode=<WxH>` or `mode=preferred`.
#
# CORRECTION (measured 2026-08-03): pinning the modeline does NOT remove the race,
# which is what this comment used to claim. It removes only the mode-SELECTION half.
# The output does now come up correctly -- weston enabled HDMI-A-2 at
# 1920x720@93.240 from the pre-EDID list -- but the late EDID still makes the kernel
# rebuild the connector's mode list underneath it (5 modes -> 17), weston still logs
# "not bothering to do anything about it", and every atomic commit still fails with
# EINVAL for the rest of the session. The guest cannot detect this (virtio-gpu has no
# present fences), so AAOS reports a healthy display while the panel is dark.
# The remaining half is handled outside this file, by holding weston's start until
# the mode lists have settled: see the 96-wait-drm-modes.conf drop-in and
# weston-wait-drm-modes.sh in this same recipe.

[output]
name=HDMI-A-1
# There is no EDID to transcribe here, so this timing is computed: it is the
# output of `cvt 1920 720 60` verbatim (VESA CVT, normal blanking) -- 59.86 Hz,
# hsync 44.77 kHz, 111.75 MHz pixel clock. Reproduce with:
#   $ cvt 1920 720 60
#   Modeline "1920x720_60.00" 111.75 1920 2016 2208 2496 720 723 733 748 -hsync +vsync
mode=111.75 1920 2016 2208 2496 720 723 733 748 -hsync +vsync
app-ids=qemu-system-aarch64-domu,DomU

[output]
name=HDMI-A-2
# The panel's own preferred DTD, transcribed from its EDID:
#   1920x720@60, 93.24 MHz, h 1920 1968 2010 2100, v 720 723 733 740, +hsync +vsync
mode=93.24 1920 1968 2010 2100 720 723 733 740 +hsync +vsync
app-ids=qemu-system-aarch64-doma,DomA
