[Service]
# Do not enumerate DRM heads until their mode lists have stopped changing.
#
# HDMI-A-2's panel delivers its EDID 3.7 s late (measured), which makes the kernel
# rebuild that connector's mode list after weston has already enabled the output.
# weston does not re-read it ("Detected a monitor change on head 'HDMI-A-2', not
# bothering to do anything about it") and every atomic commit then fails with
# EINVAL, leaving the panel dark for the rest of the session. See the header of
# weston-wait-drm-modes for the full measurement and why weston.ini's pinned
# modeline does not cover this case.
#
# The helper is bounded and always exits 0, so it can only delay weston, never
# prevent it from starting. 98-no-watchdog.conf's TimeoutStartSec=120 covers the
# 25 s ceiling plus weston's own start-up.
ExecStartPre=/usr/libexec/weston-wait-drm-modes
