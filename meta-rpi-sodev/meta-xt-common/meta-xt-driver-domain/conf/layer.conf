# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "xt-driver-domain"
BBFILE_PATTERN_xt-driver-domain := "^${LAYERDIR}/"
# Priority 20 is load-bearing. This layer carries the
# custom linux-raspberrypi_6.18.bb (pinned SRCREV 95b85bebbe + wrynose DT
# staging + configcheck disable) which must WIN recipe selection over
# meta-raspberrypi's stock linux-raspberrypi_6.18.bb (priority 9); at the old
# priority 8 the stock recipe won and failed do_compile ("No rule to make
# target bcm2712-raspberrypi5-xen-scmi.dtbo" — no DT staging). 20 also puts the
# driver-domain qemu/weston/mesa/systemd bbappends last, as they were designed
# to (stack after the meta-xt-{qemu,rpi5} bases at priority 10).
BBFILE_PRIORITY_xt-driver-domain = "20"

LAYERSERIES_COMPAT_xt-driver-domain = "wrynose"

# The board layer is NOT named here, deliberately.
#
# rpi5-image-xt-domd-vc4.bb in this layer does
#     require recipes-core/images/rpi5-image-minimal-domd.bb
# and that file lives in the board layer — meta-xt-rpi5 for a Raspberry Pi 5 build,
# meta-xt-rpi4 for a Raspberry Pi 4 one. The two are mutually exclusive (they provide
# the same recipe names) and each product yaml lists exactly one, so no single
# collection name can be required here: naming xt-rpi5 makes every RPi4 build fail
# layer resolution, and naming xt-rpi4 does the same to RPi5.
#
# Nothing is silently lost by leaving it out. If a component's layers omit the board
# layer entirely, the `require` above fails at parse time with the missing file named,
# which is as clear as the layer-resolution error it replaces.
LAYERDEPENDS_xt-driver-domain = "core"

