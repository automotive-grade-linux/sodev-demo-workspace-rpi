# Load the legacy nat table's modules at boot.
#
# WHY. Since 6.18 the legacy iptables tables are separate modules (IP_NF_NAT=m
# -> IP_NF_IPTABLES_LEGACY=m -> NETFILTER_XTABLES_LEGACY=y). domd-flatbridge-up
# adds the MASQUERADE rule while the guests are being created, and on a freshly
# booted board that add was measured to fail: the nat table was not there yet
# and the on-demand modprobe from inside iptables did not happen, so DomA had no
# route out (ping 8.8.8.8 100% loss, DNS still fine because dnsmasq answers
# locally). Loading the modules here removes the ordering question entirely.
#
# nf_conntrack is listed because the nat table pulls it in anyway; naming it makes the
# dependency visible to whoever reads this file next.
iptable_nat
xt_MASQUERADE
nf_conntrack
# The MSS cap in domd-flatbridge-up (filter table, FORWARD): the TCPMSS target and the
# tcp match its -p tcp --tcp-flags needs.
xt_TCPMSS
xt_tcpudp
