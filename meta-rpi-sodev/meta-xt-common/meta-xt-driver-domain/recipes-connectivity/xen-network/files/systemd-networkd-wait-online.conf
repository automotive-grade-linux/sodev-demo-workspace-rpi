[Service]
# DO NOT wait on end0 (it does not exist on DomD -> --interface=end0 blocks
# ~120s and stalls the graphical boot before guests start). Wait on ANY interface
# with a short cap: eth0 (static .10.11) comes online in ~1-2s.
ExecStart=
ExecStart=/lib/systemd/systemd-networkd-wait-online --any --timeout=15
