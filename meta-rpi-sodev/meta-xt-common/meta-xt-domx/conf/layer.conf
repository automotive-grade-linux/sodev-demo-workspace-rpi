# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "xt-domx"
BBFILE_PATTERN_xt-domx := "^${LAYERDIR}/"
BBFILE_PRIORITY_xt-domx = "8"

# [4.22] virtualization-layer is a real dependency now: this layer carries the
# interim xen_4.22.bb / xen-tools_4.22.bb (meta-virtualization master stops at
# 4.21) and they `require recipes-extended/xen/xen.inc` from it. They live here
# rather than in a board layer because meta-xt-rpi4 and meta-xt-rpi5 are never
# loaded together and a version recipe is not board-specific. Drop this again
# once the 4.22 recipes are accepted upstream and the local copies are deleted.
LAYERDEPENDS_xt-domx = "core virtualization-layer"
LAYERSERIES_COMPAT_xt-domx = "wrynose"

