# Layer configuration: xt-doma
#
# Additive overlay providing Android Automotive OS (AAOS/DomA) support:
#   - xt-xen-cfg-doma: DomA Xen guest domain config (domu.cfg equivalent)
#   - aaos-guest-binaries: AAOS guest kernel/ramdisk artifacts from moulin doma component
#   - xt-aaos-host-services: Dom0/DomD host-side VHAL/dumpstate services for AAOS guest
#   - recipes-kernel/linux: DomD vhost_xen kernel bbappend + xen_patchset (foreign/grant
#     mappings, and the guest-domid binding used by vhost-vsock/vhost-net for DomA)
#   - DomA kernel config (vhost_xen support in DomD)
#
# Dependencies:
#   - xt-driver-domain: Required for DomD kernel (vhost_xen support), qemu device-model
#   - core: Standard Yocto dependencies
#
# Layer priority = 21: doma's
# linux-raspberrypi_6.18.bbappend (vhost_xen backend patches for AAOS) must
# stack LAST on the driver-domain custom kernel .bb, so it needs the highest
# overlay precedence, above meta-xt-driver-domain (20).

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "xt-doma"
BBFILE_PATTERN_xt-doma := "^${LAYERDIR}/"
BBFILE_PRIORITY_xt-doma = "21"

LAYERSERIES_COMPAT_xt-doma = "wrynose"
LAYERDEPENDS_xt-doma = "core raspberrypi xt-driver-domain"
