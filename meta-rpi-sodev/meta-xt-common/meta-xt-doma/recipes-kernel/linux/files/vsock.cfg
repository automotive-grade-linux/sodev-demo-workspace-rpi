# DomD kernel options required by the DomA (Android Automotive) guest.
#
# AF_VSOCK core plus the virtio transport. The AAOS VHAL, dumpstate and GNSS host
# agents talk to the guest over vsock, so DomD needs both the address family and
# the virtio transport.
CONFIG_VSOCKETS=y
CONFIG_VSOCKETS_LOOPBACK=y
CONFIG_VIRTIO_VSOCKETS=m
CONFIG_VIRTIO_VSOCKETS_COMMON=y

# vhost moves the datapath into the kernel instead of bouncing every packet
# through the qemu device model. VHOST_XEN is the out-of-tree Xen backend added by
# the xen_patchset series; it is built in (=y) rather than modular because it has
# to be available before the first guest is created.
CONFIG_VHOST=y
CONFIG_VHOST_IOTLB=y
CONFIG_VHOST_NET=y
CONFIG_VHOST_VSOCK=y
CONFIG_VHOST_RING=y
CONFIG_VHOST_XEN=y

# TAP is the backing device type for the guest network taps that the qemu device
# model creates and domd-flatbridge-up enslaves into xenbr0.
CONFIG_TAP=y

# Diagnostics, not required for the demo to run: VSOCKETS_DIAG exposes vsock
# state through sock_diag(7) and VSOCKMON provides a capture interface for
# tcpdump. Both are cheap and make a non-working vsock path debuggable on the
# board, which is why they are kept.
CONFIG_VSOCKETS_DIAG=y
CONFIG_VSOCKMON=y
