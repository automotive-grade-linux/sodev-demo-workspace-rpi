# SPDX-License-Identifier: MIT
# =====================================================================
# DomA (AAOS) xl configuration.
#
# Requires a CONFIG_XEN=y / XEN_VIRTIO=y GKI kernel (xenbuilt), the virtio
# modules, AVB removed and a 4096-byte-padded ramdisk.
#
# kernel/ramdisk operating assumptions:
#   - The xenbuilt artifacts are placed in DEPLOY_DIR_IMAGE by the
#     aaos-guest-binaries recipe as aaos-android-kernel / aaos-vendor-boot-ramdisk
#     (md5 check is opt-in via AAOS_KERNEL_MD5/AAOS_RAMDISK_MD5, off by default;
#     with a 4096-multiple assert). rouge (ninja image-full) grafts
#     them onto SD p1:
#       /mnt/aaos-android-kernel        = xenbuilt 6.18.32 Image
#       /mnt/aaos-vendor-boot-ramdisk   = xenbuilt padded vendor_boot ramdisk
#   - The ramdisk MUST be the padded version whose total size is a multiple of
#     4096: libxl xg_dom_arm.c rounds initrd up so the bootconfig trailer ends up
#     offset from initrd_end; padding before bootconfig avoids this.
#   - In the shipping (Zephyr Dom0) flavour DomD owns the SD via SDHCI
#     passthrough, so the DomD-side qemu backs the DomA disk directly from
#     /dev/mmcblk0p4 (SD p4 = android super.img); there is no xl block-attach step.
#   - DomA is created by the DomD toolstack (`xl create`; see xl-create-doma.service),
#     before DomU (vhost_xen domid latch; see below). (In the thin-Linux Dom0
#     flavour Dom0 owns the SD instead.)
# =====================================================================

# domU_t, not a DomA-specific type: the Flask policy this series ships (patch
# 0004) declares dom0_t/domD_t/domU_t only, and DomA has the same unprivileged
# guest posture as DomU. The label is inert in the shipping configuration anyway
# -- the hypervisor boots with xsm=dummy, so Flask is not enforcing.
seclabel = 'system_u:system_r:domU_t'
name = "DomA"
# Set explicitly so auto-detect does not fall back to "traditional".
device_model_version = "qemu-xen"

# Standard SD p1 paths (contents must be the xenbuilt 6.18.32 build, see above).
kernel = "/mnt/aaos-android-kernel"
ramdisk = "/mnt/aaos-vendor-boot-ramdisk"

vcpus = 2
# Boot-time CPU map: AAOS -> dedicated pcpu 2-3 (Dom0=0, DomD=0-1, DomU=1).
# Giving Android its own two cores stops it from contending with Dom0/DomD/DomU
# during the heavy first-boot (zygote/SystemServer), and pins it away from the
# GPU/weston cores (0-1) so the compositor stays responsive.
cpus = "2-3"
# LAB/DEMO debug default: 'preserve' keeps the crashed/rebooting domain
# (console + memory state) for post-mortem instead of restarting, and stops a
# crash/reboot loop from masking the root cause. Intentional for this lab/demo
# build. For unattended/production operation switch BOTH to 'restart' so DomA
# self-recovers (an in-guest AAOS reboot then re-creates the domain).
on_crash = 'preserve'
on_reboot = 'preserve'

# Measured guest usage is ~2GB (AAOS idle); 4096 leaves headroom while
# cutting the HVM construction time and freeing ~4GB of host memory. Raise back
# to 8192 only for memory-heavy in-guest workloads.
#
# BOARD-DEPENDENT. The line below is SUBSTITUTED AT BUILD TIME by the
# xt-xen-cfg-doma recipe from the moulin BOARD_RAM parameter:
#     16g -> 4096      8g -> 3072
# The recipe fails the build if the placeholder is still here, because an
# unsubstituted `memory` line makes `xl create` reject the config outright.
#
# Why 8g takes DomA down as well, when the 8g map was originally meant to shrink
# only DomD: DomD 2048 does not work. Measured on hardware 2026-08-03 -- with
# DomD at 2048 and DomA at 4096 the AAOS userspace crash-looped
# ("binder: cannot find target node" / "undelivered transaction, process died",
# 16 occurrences, sys.boot_completed never set) while DomD itself still had
# 1.3 GiB free and no OOM kill, i.e. the limit is not DomD's RAM but what its
# device model can map of a 4 GiB guest. bcm2712-raspberrypi5-xen.dtso already
# recorded 2048 as a size that had been measured to fail with all four domains
# up; the 8g map reintroduced it and reproduced exactly that. DomD 3072 + DomA
# 3072 keeps the same 7680 MiB total and boots all four domains cleanly
# (verified: 0 binder errors, sys.boot_completed=1, both panels lit).
memory = DOMA_MEM_PLACEHOLDER

#   - bootconfig + androidboot.boot_devices=33000000.pcie is required for boot
#     (androidboot.* is supplied via the vendor_boot bootconfig trailer).
#   - console=hvc0 (V4H parity, = V4H doma-virtio.cfg). On this platform hvc0 is
#     the *Xen PV console*, not a virtio-console -- measured on hardware, and the
#     opposite of what this comment used to claim. xl gives every guest it creates
#     a PV console ring, and its frontend registers before the PCI bus is walked:
#         printk: console [hvc0] enabled      @ 0.000425 s
#         printk: console [ttynull0] enabled  @ 0.554459 s
#         /proc/consoles: hvc0  -W- (EC p) 229:0
#     virtio_console probes far later and, finding hvc0 taken, exposes its six
#     ports as generic virtio-serial ports (/sys/class/virtio-ports/vport2p0..p5)
#     rather than /dev/hvcN. Nothing in the guest opens them, so the sockets under
#     device_model_args accept a client and then carry no data in either direction.
#     AAOS init's `console` service (/system/bin/sh, class core, started when
#     ro.debuggable=1) opens /dev/console -> hvc0, so the interactive shell is on
#     the PV console. Reach it from DomD with:
#         xl console 2
#     xenconsole calls tcsetattr() on stdin, so it needs a tty: over ssh use
#     `ssh -tt`, otherwise it hangs with no output. Verified: the prompt is
#     `console:/ $` as uid 2000(shell) -- an unprivileged shell, not root.
#     No vuart, no vpl011, no androidboot.console, no earlycon (all matching V4H).
#     logcat: the `seriallogging` service is `stopped` in this image, so
#     /dev/hvc2 carries nothing either -- use `adb logcat`.
#   - loglevel=4 (KERN_ERR and above). 8 was a debugging leftover and it costs
#     real time here: DomA's console is the Xen PV console, Android's init and
#     logd write through /dev/kmsg, and every line is copied by the toolstack
#     domain. Measured on hardware 2026-08-18 while driving three
#     Settings<->Home transitions in DomA, together with turning Bluetooth off:
#     DomD 120.4 % -> 89.6 % of a core. Raise it back to 7 or 8 (or set it live
#     with `echo 8 > /proc/sys/kernel/printk` in DomA) when diagnosing a boot;
#     at 4 the init log that this file's printk.devkmsg note relies on is gone.
#   - printk.devkmsg=ratelimit, NOT off. `off` makes every userspace write to
#     /dev/kmsg return -EPERM, and on this board that stops AAOS from booting:
#     init reboots the guest with
#         reboot: Restarting system with command 'bpfloader-failed'
#     Measured on RPi4 hardware 2026-08-17, AAOS17 (SDK 37):
#         printk.devkmsg=off        -> failed at 46 s, 12.7 s and 13.4 s (3/3)
#         printk.devkmsg=on         -> reached sys.boot_completed=1 (2/2)
#         printk.devkmsg=ratelimit  -> reached sys.boot_completed=1 and
#                                      CarLauncher resumed
#     WHY `off` breaks the bpfloader is NOT understood; the correlation is what
#     was measured. Note that `off` also hides the failure it causes: init logs
#     through /dev/kmsg, so with `off` there is not a single `init:` line on the
#     console and the reason for the reboot is invisible. `ratelimit` is the
#     kernel's own default, so `off` was the deviation. Do not set it back to
#     `off` without re-running the boot on hardware. This file is shared with
#     RPi5 (it lives in meta-xt-common); the change only lifts a restriction
#     back to the kernel default, and it has NOT been re-measured on RPi5.
extra = "loglevel=4 init=/init ro rootwait printk.devkmsg=ratelimit console=hvc0 bootconfig androidboot.boot_devices=33000000.pcie cma=256M androidboot.force_normal_boot=1 androidboot.slot_suffix=_a"

# V4H parity: no vuart/vpl011. DomA's console is the Xen PV console (hvc0);
# reach it from DomD via `xl console 2` (needs a tty -- `ssh -tt`).

device_tree = "/usr/lib/xen/boot/doma.dtb"

# Pass host /firmware through to DomA.
# Note: on RPi5 /firmware is the rpi firmware node; if xl create fails or AAOS
# misbehaves, comment this block out (the AAOS firmware/android node already
# exists in doma.dtb, so operation continues).
dt_passthrough_nodes = [
    "/firmware",
]

# =====================================================================
# DomA virtio virtual devices (backend=1 = DomD, grant_usage=0 for Android).
# backend=1 + grant_usage=0 are proven values; do not change.
# =====================================================================
virtio = [
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:01.0, grant_usage=0, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:02.0, grant_usage=0, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:03.0, grant_usage=0, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:04.0, grant_usage=0, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:05.0, grant_usage=0, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:06.0, grant_usage=0, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:07.0, grant_usage=0, backend_type=qemu',
]

# qemu device model.
# addr layout: blk1 / vsock2 / serial3 (+virtconsole x5 + gnss-uart) / net4 (vif-emu)
#              / tablet5 / net6 (vif-emu1) / gpu7
# All six virtconsoles use a socket backend (server=on,wait=off, so qemu only
# creates the socket even with no client and does not block DomA boot) -- V4H
# parity (matches V4H doma-virtio.cfg; the previous file backend on virts4 is
# dropped).
#
# These six ports are inert on this platform and are kept only for V4H parity.
# The intended V4H mapping was virts1 -> guest hvc0 (shell) and virts4 -> guest
# hvc2 (logcat via seriallogging.rc), but the Xen PV console takes hvc0 before
# virtio_console probes (see the `extra` comment above), so the guest exposes all
# six as vport2p0..p5 and opens none of them. Measured: the sockets go st=01
# LISTENING -> st=03 on connect, qemu holds them, and socat then reads 0 bytes.
# Do not delete them without re-verifying DomA: the virtio device count and PCI
# addr layout are proven values, and DomA cannot be destroyed and recreated
# without a full reboot (the vhost_xen domid latch).
# Use `xl console 2` for the shell and `adb logcat` for logcat instead.
device_model_args = [
    '-device', 'virtio-blk-pci,scsi=off,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=1,drive=image',
    # DomD owns the SD via SDHCI passthrough (Zephyr Dom0 flavour), so the
    # DomD-side qemu backs the disk directly from SD p4 (android, super.img).
    '-drive', 'if=none,id=image,format=raw,file=/dev/mmcblk0p4',
    '-device', 'vhost-vsock-pci,guest-cid=3,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=2',
    '-device', 'virtio-serial-pci,disable-legacy=on,iommu_platform=on,addr=3',
    '-chardev', 'socket,path=/run/android_vm_virtconsole1,server=on,wait=off,id=virts_chardev1',
    '-device', 'virtconsole,chardev=virts_chardev1,id=virts1',
    '-chardev', 'socket,path=/run/android_vm_virtconsole2,server=on,wait=off,id=virts_chardev2',
    '-device', 'virtconsole,chardev=virts_chardev2,id=virts2',
    '-chardev', 'socket,path=/run/gnss-uart,server=on,wait=off,id=virts_chardev3',
    '-device', 'virtserialport,chardev=virts_chardev3,id=virts3',
    '-chardev', 'socket,path=/run/android_vm_virtconsole4,server=on,wait=off,id=virts_chardev4',
    '-device', 'virtconsole,chardev=virts_chardev4,id=virts4',
    '-chardev', 'socket,path=/run/android_vm_virtconsole5,server=on,wait=off,id=virts_chardev5',
    '-device', 'virtconsole,chardev=virts_chardev5,id=virts5',
    '-chardev', 'socket,path=/run/android_vm_virtconsole6,server=on,wait=off,id=virts_chardev6',
    '-device', 'virtconsole,chardev=virts_chardev6,id=virts6',
    '-device', 'virtio-net-pci,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=4,romfile=,id=nic0,netdev=net0,mac=08:00:27:ff:cb:ce',
    '-netdev', 'type=tap,id=net0,ifname=vif-emu,br=xenbr0,script=no,downscript=no,vhost=on',
    '-device', 'virtio-net-pci,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=6,romfile=,id=nic1,netdev=net1,mac=08:00:27:ff:cb:cf',
    # net1 = eth1 inside AAOS = the dhcpclient target (dhcpclient.rc: `dhcpclient -i eth1`).
    # Enslave it into DomD's flat xenbr0 so AAOS gets its DHCP lease (DomD dnsmasq
    # binds 08:00:27:ff:cb:cf -> 192.168.10.13), making DomA reachable on the flat
    # L2 segment (PC adb connect 192.168.10.13:5555). Was br= unset (isolated) ->
    # DHCP went nowhere and DomA had no IP.
    '-netdev', 'type=tap,id=net1,ifname=vif-emu1,br=xenbr0,script=no,downscript=no,vhost=on',
    '-device', 'virtio-tablet-pci,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=5',
    '-device', 'virtio-gpu-gl-pci,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=7,xres=1920,yres=720',
    '-display', 'sdl,gl=es',
    # '-full-screen' removed: SDL sends set_fullscreen for wl_output@0 (HDMI-A-1),
    # overriding the kiosk-shell app-id output routing (weston.ini app-ids= ->
    # HDMI-A-2) so DomA would land on A-1. kiosk-shell configures every window to
    # the full output, so full-screen display is preserved without it.
    '-vga', 'std',
    '-d', 'guest_errors',
    # LAB/DEMO ONLY: the qemu monitor is unauthenticated. It is bound to
    # loopback (127.0.0.1) inside DomD so it is not reachable off-board; do not
    # expose it on a routable address in any non-lab build.
    '-monitor', 'telnet:127.0.0.1:1234,server,nowait',
    # Without '-name', libxl's default "domain-<id>" becomes the SDL window app_id
    # (qemu wrapper 0008 exports -name to SDL_VIDEO_WAYLAND_WMCLASS), which does not
    # match weston.ini app-ids and so is not routed to HDMI-A-2.
    '-name', 'DomA',
    '-global', 'virtio-mmio.force-legacy=false',
]

# DomD weston kiosk-shell routes by app-id (= WMCLASS) to HDMI-A-2 (1920x720).
# weston.ini (weston-init.bbappend): app-ids=qemu-system-aarch64-doma,DomA -> HDMI-A-2.
# The 0008 wrapper exports the -name argument (DomA) to WMCLASS, so both values are
# registered in app-ids (redundant safety).
qemu_envs = [
    'WAYLAND_DISPLAY=wayland-0',
    'XDG_RUNTIME_DIR=/run',
    'SDL_VIDEODRIVER=wayland',
    'SDL_VIDEO_WAYLAND_WMCLASS=qemu-system-aarch64-doma',
]
