# SPDX-License-Identifier: MIT
# =====================================================================
# DomA (AAOS) xl configuration.
#
# Requires a CONFIG_XEN=y / XEN_VIRTIO=y GKI kernel (xenbuilt), the virtio
# modules, AVB removed and a 4096-byte-padded ramdisk.
#
# kernel/ramdisk operating assumptions:
#   - The xenbuilt artifacts are placed in DEPLOY_DIR_IMAGE by the
#     aaos-guest-binaries recipe as aaos-android-kernel / aaos-vendor-boot-ramdisk
#     (md5 check is opt-in via AAOS_KERNEL_MD5/AAOS_RAMDISK_MD5, off by default;
#     with a 4096-multiple assert). rouge (ninja image-full) grafts
#     them onto SD p1:
#       /mnt/aaos-android-kernel        = xenbuilt 6.18.32 Image
#       /mnt/aaos-vendor-boot-ramdisk   = xenbuilt padded vendor_boot ramdisk
#   - The ramdisk MUST be the padded version whose total size is a multiple of
#     4096: libxl xg_dom_arm.c rounds initrd up so the bootconfig trailer ends up
#     offset from initrd_end; padding before bootconfig avoids this.
#   - In the shipping (Zephyr Dom0) flavour DomD owns the SD via SDHCI
#     passthrough, so the DomD-side qemu backs the DomA disk directly from
#     /dev/mmcblk0p4 (SD p4 = android super.img); there is no xl block-attach step.
#   - DomA is created by the DomD toolstack (`xl create`; see xl-create-doma.service),
#     before DomU (vhost_xen domid latch; see below). (In the thin-Linux Dom0
#     flavour Dom0 owns the SD instead.)
# =====================================================================

# domU_t, not a DomA-specific type: the Flask policy this series ships (patch
# 0004) declares dom0_t/domD_t/domU_t only, and DomA has the same unprivileged
# guest posture as DomU. The label is inert in the shipping configuration anyway
# -- the hypervisor boots with xsm=dummy, so Flask is not enforcing.
seclabel = 'system_u:system_r:domU_t'
name = "DomA"
# Set explicitly so auto-detect does not fall back to "traditional".
device_model_version = "qemu-xen"

# Standard SD p1 paths (contents must be the xenbuilt 6.18.32 build, see above).
kernel = "/mnt/aaos-android-kernel"
ramdisk = "/mnt/aaos-vendor-boot-ramdisk"

# Both lines are SUBSTITUTED AT BUILD TIME by the xt-xen-cfg-doma recipe
# (DOMA_VCPUS / DOMA_CPUS): 2 vCPUs on pcpu 2-3 on every board.
#
# Boot-time CPU map: Dom0=0, DomD=0-1, DomA=2-3. DomU is on pcpu 1 (domu.cfg),
# except on the Raspberry Pi 4, whose layer moves it to pcpu 2. pcpu 2-3 keep
# Android off DomD and its device model, which is where the ioreq path and the V3D
# work run, and give it its own cores for the heavy first boot
# (zygote/SystemServer). On an 8 GiB Pi 4, where DomA and DomU both run, they share
# pcpu 2.
#
# On the 4 GiB RPi4 a third PHYSICAL core was measured to help 60 fps video
# playing in a WebView (2026-09-06, effective fps from the page's presented
# counter, 720p60 / 1080p60 H.264 hardware decode):
#   2 vCPU / pcpu 2-3   35.8-38.3 / 21.6, DomA 150% of 200%
#   3 vCPU / pcpu 1-3   39.9      / 21.5
#   4 vCPU / pcpu 1-3   42.0-42.7 / 22.7-23.6
# 2 on pcpu 2-3 is the value because 1080p30 hardware decode (VideoView,
# full Vulkan, 1280x720) measures the same on both layouts and costs less on
# this one: 22.0-22.2 fps with 3 vCPUs on pcpu 1-3 and 19.8-23.8 fps with 2 on
# pcpu 2-3, with DomA at 140% vs 114% and V3D render at 91% vs 73%
# (2026-09-23). The price is the 60 fps WebView case above, and a DomA with
# little idle left (18% of 200% during that playback).
# Watch DomA's first boot. An "abnormal_reset" during it was measured to be
# CPU starvation (2026-08-19, on a Pi 5 running a different AAOS image), and
# there it stopped with 3 vCPUs on pcpu 1-3 plus a 60 s delay before DomU is
# created; this tree has neither. With 2 vCPUs on pcpu 2-3 the 4 GiB board
# booted cleanly on every boot of 2026-09-23 (boot.reason=reboot,
# boot_completed in ~3 min).
vcpus = DOMA_VCPUS_PLACEHOLDER
cpus = "DOMA_CPUS_PLACEHOLDER"
# LAB/DEMO debug default: 'preserve' keeps the crashed/rebooting domain
# (console + memory state) for post-mortem instead of restarting, and stops a
# crash/reboot loop from masking the root cause. Intentional for this lab/demo
# build. For unattended/production operation switch BOTH to 'restart' so DomA
# self-recovers (an in-guest AAOS reboot then re-creates the domain).
on_crash = 'preserve'
on_reboot = 'preserve'

# Measured guest usage is ~2GB (AAOS idle); 4096 leaves headroom while
# cutting the HVM construction time and freeing ~4GB of host memory. Raise back
# to 8192 only for memory-heavy in-guest workloads.
#
# BOARD-DEPENDENT. The line below is SUBSTITUTED AT BUILD TIME by the
# xt-xen-cfg-doma recipe from the moulin BOARD_RAM parameter:
#     16g -> 4096      8g -> 3072
# The recipe fails the build if the placeholder is still here, because an
# unsubstituted `memory` line makes `xl create` reject the config outright.
#
# Why 8g takes DomA down as well, when the 8g map was originally meant to shrink
# only DomD: DomD 2048 does not work. Measured on hardware 2026-08-03 -- with
# DomD at 2048 and DomA at 4096 the AAOS userspace crash-looped
# ("binder: cannot find target node" / "undelivered transaction, process died",
# 16 occurrences, sys.boot_completed never set) while DomD itself still had
# 1.3 GiB free and no OOM kill, i.e. the limit is not DomD's RAM but what its
# device model can map of a 4 GiB guest. bcm2712-raspberrypi5-xen.dtso already
# recorded 2048 as a size that had been measured to fail with all four domains
# up; the 8g map reintroduced it and reproduced exactly that. DomD 3072 + DomA
# 3072 keeps the same 7680 MiB total and boots all four domains cleanly
# (verified: 0 binder errors, sys.boot_completed=1, both panels lit).
memory = DOMA_MEM_PLACEHOLDER

#   - bootconfig + androidboot.boot_devices=33000000.pcie is required for boot
#     (androidboot.* is supplied via the vendor_boot bootconfig trailer).
#   - console=hvc0 (V4H parity, = V4H doma-virtio.cfg). On this platform hvc0 is
#     the *Xen PV console*, not a virtio-console -- measured on hardware, and the
#     opposite of what this comment used to claim. xl gives every guest it creates
#     a PV console ring, and its frontend registers before the PCI bus is walked:
#         printk: console [hvc0] enabled      @ 0.000425 s
#         printk: console [ttynull0] enabled  @ 0.554459 s
#         /proc/consoles: hvc0  -W- (EC p) 229:0
#     virtio_console probes far later and, finding hvc0 taken, puts the five
#     virtconsole ports on hvc1..hvc5; which of them the guest opens is in the
#     virtio-serial note under device_model_args.
#     AAOS init's `console` service (/system/bin/sh, class core, started when
#     ro.debuggable=1) opens /dev/console -> hvc0, so the interactive shell is on
#     the PV console. Reach it from DomD with:
#         xl console 2
#     xenconsole calls tcsetattr() on stdin, so it needs a tty: over ssh use
#     `ssh -tt`, otherwise it hangs with no output. Verified: the prompt is
#     `console:/ $` as uid 2000(shell) -- an unprivileged shell, not root.
#     No vuart, no vpl011, no androidboot.console, no earlycon (all matching V4H).
#     logcat: the `seriallogging` service is `stopped` in this image, so
#     /dev/hvc2 carries nothing either -- use `adb logcat`.
#   - loglevel=4 (KERN_ERR and above). 8 was a debugging leftover and it costs
#     real time here: DomA's console is the Xen PV console, Android's init and
#     logd write through /dev/kmsg, and every line is copied by the toolstack
#     domain. Measured on hardware 2026-08-18 while driving three
#     Settings<->Home transitions in DomA, together with turning Bluetooth off:
#     DomD 120.4 % -> 89.6 % of a core. Raise it back to 7 or 8 (or set it live
#     with `echo 8 > /proc/sys/kernel/printk` in DomA) when diagnosing a boot;
#     at 4 the init log that this file's printk.devkmsg note relies on is gone.
#   - printk.devkmsg=ratelimit, NOT off. `off` makes every userspace write to
#     /dev/kmsg return -EPERM, and on this board that stops AAOS from booting:
#     init reboots the guest with
#         reboot: Restarting system with command 'bpfloader-failed'
#     Measured on RPi4 hardware 2026-08-17, AAOS17 (SDK 37):
#         printk.devkmsg=off        -> failed at 46 s, 12.7 s and 13.4 s (3/3)
#         printk.devkmsg=on         -> reached sys.boot_completed=1 (2/2)
#         printk.devkmsg=ratelimit  -> reached sys.boot_completed=1 and
#                                      CarLauncher resumed
#     WHY `off` breaks the bpfloader is NOT understood; the correlation is what
#     was measured. Note that `off` also hides the failure it causes: init logs
#     through /dev/kmsg, so with `off` there is not a single `init:` line on the
#     console and the reason for the reboot is invisible. `ratelimit` is the
#     kernel's own default, so `off` was the deviation. Do not set it back to
#     `off` without re-running the boot on hardware. This file is shared with
#     RPi5 (it lives in meta-xt-common); the change only lifts a restriction
#     back to the kernel default, and it has NOT been re-measured on RPi5.
#   - snd_aloop.index=1 is load-bearing for audio, and getting it wrong is SILENT.
#     The audio HAL's ALSA card number is a compile-time constant of 0, but
#     snd-aloop.ko is listed before virtio_snd.ko in the vendor_ramdisk
#     modules.load, so the loopback driver would take card 0 and virtio-snd
#     card 1. The blocklist that would stop snd-aloop applies only in
#     second-stage init, and this product sets no first-stage blocklist file.
#     The failure mode is the bad kind: pcm_open(0, 0) SUCCEEDS against the
#     loopback card, every write succeeds, nothing drains the capture side and
#     logcat shows no error at all -- just no sound. First-stage init loads
#     those modules through libmodprobe, which reads /proc/cmdline and passes
#     a `module.param=value` to that module when it loads it, so this pushes
#     snd-aloop to card 1 and leaves card 0 for virtio-snd with no image
#     change. The proper fix is a first-stage blocklist on the AOSP side.
extra = "loglevel=4 init=/init ro rootwait printk.devkmsg=ratelimit console=hvc0 bootconfig androidboot.boot_devices=33000000.pcie cma=256M androidboot.force_normal_boot=1 androidboot.slot_suffix=_a snd_aloop.index=1"

# V4H parity: no vuart/vpl011. DomA's console is the Xen PV console (hvc0);
# reach it from DomD via `xl console 2` (needs a tty -- `ssh -tt`).

device_tree = "/usr/lib/xen/boot/doma.dtb"

# Pass host /firmware through to DomA.
# Note: on RPi5 /firmware is the rpi firmware node; if xl create fails or AAOS
# misbehaves, comment this block out (the AAOS firmware/android node already
# exists in doma.dtb, so operation continues).
dt_passthrough_nodes = [
    "/firmware",
]

# =====================================================================
# DomA virtio virtual devices (backend=1 = DomD, grant_usage=0 for Android).
# backend=1 + grant_usage=0 are proven values; do not change.
# =====================================================================
virtio = [
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:01.0, grant_usage=0, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:02.0, grant_usage=0, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:03.0, grant_usage=0, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:04.0, grant_usage=0, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:05.0, grant_usage=0, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:06.0, grant_usage=0, backend_type=qemu',
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:07.0, grant_usage=0, backend_type=qemu',
    # 08.0 = virtio-snd. This list and the -device addr=N values below have to
    # stay 1:1, and that is not a convention: xl devd walks THIS list and only
    # spawns the qemu backend for entries whose backend_type is qemu
    # (0015-libxl-Update-xl-devd-to-also-spawn-Qemu-for-Virtio-d.patch),
    # while backend_type itself comes from
    # 0014-libxl-Add-backend_type-property-for-the-Virtio-devic.patch. So an
    # entry here with no matching -device gets no backend, and a -device with no
    # entry here gets no libxl plumbing; either way the device does not reach the
    # guest.
    'backend=1, type=virtio,device, transport=pci, bdf=0000:00:08.0, grant_usage=0, backend_type=qemu',
    # XT_DOMA_HWDEC_VIRTIO_PLACEHOLDER is SUBSTITUTED AT BUILD TIME by xt-xen-cfg-doma:
    # on the hardware-decode lane it becomes the 09.0 entry that backs the
    # virtio-media device added to device_model_args below, and it is DELETED
    # otherwise. The two tokens are driven by one variable so the guest can never
    # be given a host slot with no device on it, or a device with no slot.
    #
    # Slot 09.0 needs xen-tools patch 4.22-0010 (VIRTIO_PCI_HOST_NUM_SPIS 16). With
    # eight the interrupt-map wraps and slot 9 lands on slot 1 = virtio-blk = DomA's
    # rootfs.
    XT_DOMA_HWDEC_VIRTIO_PLACEHOLDER
]

# qemu device model.
# addr layout: blk1 / vsock2 / serial3 (+virtconsole x5 + gnss-uart) / net4 (vif-emu)
#              / tablet5 / net6 (vif-emu1) / gpu7 / snd8 / media9 (hardware decode only)
# The virtconsoles use a socket backend (server=on,wait=off, so qemu only
# creates the socket even with no client and does not block DomA boot) -- V4H
# parity (matches V4H doma-virtio.cfg; the previous file backend on virts4 is
# dropped). virts6 is the exception: it connects to a socket DomD serves, see
# there.
#
# The Xen PV console takes hvc0 before virtio_console probes (see the `extra`
# comment above), so the five virtconsoles land on hvc1..hvc5 in port order.
# The guest opens two of them: virts5 (/dev/hvc4) carries the Wi-Fi relay's
# link to DomD, and virts6 (/dev/hvc5) the Bluetooth HCI. The rest are inert
# and kept for V4H parity, whose intended mapping was virts1 -> guest hvc0
# (shell) and virts4 -> guest hvc2 (logcat via seriallogging.rc). Measured on
# those: the sockets go st=01 LISTENING -> st=03 on connect, qemu holds them,
# and socat then reads 0 bytes.
# Do not delete them without re-verifying DomA: the virtio device count and PCI
# addr layout are proven values, and DomA cannot be destroyed and recreated
# without a full reboot (the vhost_xen domid latch).
# Use `xl console 2` for the shell and `adb logcat` for logcat instead.
#
# ioeventfd=off on every virtio-pci device that has the property and defaults
# it to on. vhost-vsock-pci and virtio-tablet-pci have no such property and
# would refuse to start with it, and virtio-gpu-gl-pci already defaults to
# off. Under Xen there is no KVM ioeventfd acceleration: with the default on,
# a virtqueue kick is an MMIO write that only sets an eventfd, which the device
# model's main loop then has to find among ~150 polled fds. perf on the RPi4
# DomD (2026-09-04) put 20 % of the device model's CPU into
# ppoll/fdget/eventfd_poll; off dropped the fd count 158 -> 81 and DomA+DomD
# CPU by 7 points, for hardware and software video decode alike.
device_model_args = [
    '-device', 'virtio-blk-pci,scsi=off,disable-legacy=on,ioeventfd=off,iommu_platform=on,bus=pcie.0,addr=1,drive=image',
    # DomD owns the SD via SDHCI passthrough (Zephyr Dom0 flavour), so the
    # DomD-side qemu backs the disk directly from SD p4 (android, super.img).
    '-drive', 'if=none,id=image,format=raw,file=/dev/mmcblk0p4',
    '-device', 'vhost-vsock-pci,guest-cid=3,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=2',
    '-device', 'virtio-serial-pci,disable-legacy=on,ioeventfd=off,iommu_platform=on,addr=3',
    '-chardev', 'socket,path=/run/android_vm_virtconsole1,server=on,wait=off,id=virts_chardev1',
    '-device', 'virtconsole,chardev=virts_chardev1,id=virts1',
    '-chardev', 'socket,path=/run/android_vm_virtconsole2,server=on,wait=off,id=virts_chardev2',
    '-device', 'virtconsole,chardev=virts_chardev2,id=virts2',
    '-chardev', 'socket,path=/run/gnss-uart,server=on,wait=off,id=virts_chardev3',
    '-device', 'virtserialport,chardev=virts_chardev3,id=virts3',
    '-chardev', 'socket,path=/run/android_vm_virtconsole4,server=on,wait=off,id=virts_chardev4',
    '-device', 'virtconsole,chardev=virts_chardev4,id=virts4',
    '-chardev', 'socket,path=/run/android_vm_virtconsole5,server=on,wait=off,id=virts_chardev5',
    '-device', 'virtconsole,chardev=virts_chardev5,id=virts5',
    # virts6 is DomA's Bluetooth HCI, not a spare console. DomD's btproxy opens
    # hci0 as an HCI user channel and serves raw H4 on /run/bt-hci.sock
    # (xt-domd-bt-proxy); the guest reads the same stream on /dev/hvc5, where
    # cuttlefish's Bluetooth HAL already expects it, so A2DP (ACL) and HFP (SCO)
    # both ride this one port and the guest needs no addition of its own.
    #
    # server=off,reconnect=1, not server=on, and all four halves of that matter:
    #   * btproxy --unix IS the server. Two servers on one path is not a
    #     configuration -- whichever binds first owns the socket and the other
    #     talks to nothing.
    #   * reconnect=1 makes start order irrelevant. A client chardev whose socket
    #     does not exist yet is a fatal error for qemu, which would take DomA's
    #     rootfs disk down with it, since one device model serves every DomA
    #     virtio device. With reconnect qemu retries once a second instead, so the
    #     domain boots whether or not DomD's proxy is up, and on a board with no
    #     Bluetooth it simply keeps retrying. It is spelled `reconnect`
    #     (seconds) because the 7.0.0 device model has no `reconnect-ms`;
    #     10.0.2 still takes `reconnect`, deprecated there since qemu 9.2.
    #     11.1.2 no longer has it (removed in qemu 10.2), and xt-xen-cfg-doma
    #     rewrites it to reconnect-ms=1000 for that device model.
    #   * the same retry is what lets btproxy be restarted -- or the adapter be
    #     reset -- underneath a running DomA.
    #   * it must be a virtconsole rather than a virtserialport: the HAL calls
    #     tcgetattr on the fd and propagates the error, so a generic
    #     /dev/vport2pN character device makes it fail with ENOTTY. Only ports the
    #     host declares as console ports get an hvc, and the Xen PV console has
    #     already taken hvc0, so the five virtconsoles land on hvc1..hvc5 in port
    #     order -- which is what puts this, the last one, on /dev/hvc5.
    '-chardev', 'socket,path=/run/bt-hci.sock,server=off,reconnect=1,id=virts_chardev6',
    '-device', 'virtconsole,chardev=virts_chardev6,id=virts6',
    '-device', 'virtio-net-pci,disable-legacy=on,ioeventfd=off,iommu_platform=on,bus=pcie.0,addr=4,romfile=,id=nic0,netdev=net0,mac=08:00:27:ff:cb:ce',
    '-netdev', 'type=tap,id=net0,ifname=vif-emu,br=xenbr0,script=no,downscript=no,vhost=on',
    '-device', 'virtio-net-pci,disable-legacy=on,ioeventfd=off,iommu_platform=on,bus=pcie.0,addr=6,romfile=,id=nic1,netdev=net1,mac=08:00:27:ff:cb:cf',
    # net1 = eth1 inside AAOS = the dhcpclient target (dhcpclient.rc: `dhcpclient -i eth1`).
    # Enslave it into DomD's flat xenbr0 so AAOS gets its DHCP lease (DomD dnsmasq
    # binds 08:00:27:ff:cb:cf -> 192.168.10.13), making DomA reachable on the flat
    # L2 segment (PC adb connect 192.168.10.13:5555). Was br= unset (isolated) ->
    # DHCP went nowhere and DomA had no IP.
    '-netdev', 'type=tap,id=net1,ifname=vif-emu1,br=xenbr0,script=no,downscript=no,vhost=on',
    '-device', 'virtio-tablet-pci,disable-legacy=on,iommu_platform=on,bus=pcie.0,addr=5',
    # AAOS audio -> DomD ALSA -> HDMI. Both the HDMI media path and the downlink
    # of a Bluetooth HFP call land on this one device. The guest half was
    # complete before the device existed: virtio_snd.ko ships in vendor_dlkm and
    # in the vendor_boot ramdisk and is listed in both modules.load files, and
    # the tinyalsa writer behind ro.hardware.audio.primary mixes the eight AAOS
    # buses into ONE pcm and opens it with a compile-time card/device of 0/0. So
    # the device has to come up as ALSA card 0 in the guest, which is what
    # snd_aloop.index=1 on the `extra` line above is for.
    #
    # Measured on hardware (RPi5 + AAOS17 2026-08-25, RPi4 2026-09-13 and
    # 2026-09-16), audible with the host PCM's hw_ptr advancing continuously at
    # 48 kHz. Every value below is load-bearing:
    #
    # out.dev=plughw:vc4hdmi1
    #   Not 'default', and not 'hw:'. The vc4-hdmi PCM only accepts
    #   IEC958_SUBFRAME_LE, so a plain hw: device rejects the s16 stream --
    #   plughw: inserts the conversion. The card NAME rather than an index, so
    #   it survives a change in probe order.
    #
    #   WHICH vc4hdmiN IS CONNECTED DEPENDS ON THE CABLE, AND ON WHICH HDMI NODES
    #   DomD's DT GIVES `dmas`: only those get a card (see below). vc4hdmi1 is
    #   HDMI-A-2, the output weston routes DomA's window to (see the app-ids note
    #   below), so it is the value for a rig cabled that way; on a rig cabled to
    #   HDMI-A-1 the connected port is vc4hdmi0 instead. Pointing at the dead
    #   port is silent in the bad way: qemu ends up with zero sound file
    #   descriptors and DomA plays nothing while AudioFlinger writes frames at a
    #   real-time 48 kHz. /usr/libexec/doma-pick-hdmi-audio reads the ELDs at
    #   boot, picks the card whose sad_count is greater than zero and rewrites
    #   this out.dev. It runs as the last ExecStartPre of xl-create-doma.service
    #   and keeps a .hdmiaudio.bak.
    #
    #   What that choice covers, and what it does not:
    #   - Only the cards DomD has. vc4-hdmi registers a card for an HDMI node
    #     only when DomD's DT gives that node `dmas`, so a port without them has
    #     no card to pick, whichever port the cable is on.
    #   - Only where the script can see those cards. It runs where
    #     xl-create-doma runs: in DomD in the zephyr flavour, but in Dom0 in the
    #     linux one, and Dom0 has no vc4hdmi card. There it finds nothing, says
    #     "no HDMI port can take audio; leaving the cfgs alone" and DomA opens
    #     the literal below. So the literal has to name the port the board's
    #     DomA output is on; a board layer whose DomA is on another port
    #     rewrites it at build time.
    #
    # out.try-poll=off      <-- WITHOUT THIS, PLAYBACK STALLS
    #   try-poll defaults to true, and the qemu ALSA backend then registers a
    #   POLLOUT fd handler on the device. When the guest stops feeding, that fd
    #   stays write-ready forever, so alsa_poll_handler() fires continuously:
    #   measured 62,873 output-callback invocations per second and 42% CPU in the
    #   device model. That starves qemu's main loop, the guest's write hits the
    #   ALSA wait_for_avail() timeout (-EIO), tinyalsa then loses sync with the
    #   kernel (kernel RUNNING, tinyalsa "not running") and every subsequent
    #   SNDRV_PCM_IOCTL_PREPARE returns EBUSY -- the HAL wedges permanently with
    #   "mixer_thread_loop error[-1] writing data to pcm". With try-poll=off:
    #   0 callbacks/s idle, 5% CPU, 0 HAL errors.
    #
    # out.period-length=20000 / out.buffer-length=60000 (20 ms period, 60 ms
    # buffer)
    #   The buffer length is the one value that had to be measured rather than
    #   derived, because the ALSA backend answers "my own emulated buffer is
    #   free" instead of reporting what the host PCM has consumed:
    #     160 ms  the backend swallows 160 ms of guest TX at once and reports
    #             completion, so the guest's hw_ptr catches up with its appl_ptr
    #             and it XRUNs, cycling STOP/PREPARE/START about every 42 ms (the
    #             host does snd_pcm_drop on each STOP) and the output breaks up.
    #      40 ms  the HOST PCM XRUNs while a 1080p video plays, because
    #             virtio-media's QBUF work holds the same main loop for up to
    #             36.7 ms and 40 ms of buffer does not cover it: 1-2 times per
    #             20 s in the run that chose this value, 125 times in 25 s in
    #             the later run that measured qemu 0242's levers, with them
    #             off (see XT_DOMA_HWDEC_DEVARG in xt-xen-cfg-doma). The two
    #             runs' other conditions were not recorded.
    #     100 ms  the host stream stays RUNNING but is SILENT.
    #      60 ms  26 s of continuous playback, 0 restarts, 0 stalls, 47,621
    #             frames/s = 99.2% of nominal.
    #   DomD's Xen scheduler weight is not a factor: 256 and 512 gave identical
    #   results, so it is not changed for audio.
    #
    # streams=1
    #   The upstream default is 2 (one playback plus one capture). There is no
    #   capture backend to give the second one: both vc4hdmi cards are
    #   playback-only (card0 and card1 expose pcm0p and no pcm0c), and with a
    #   capture stream qemu fails outright with "alsa: Could not initialize ADC"
    #   / "audio: Failed to create voice 'virtio-sound.in'". The consequence is
    #   that a HFP call's UPLINK has no path -- the guest is given no capture PCM
    #   and the board has no microphone to feed one. The DOWNLINK (SCO on the HCI
    #   port virts6 -> the guest's HFP client -> this device -> HDMI) is served,
    #   as is A2DP sink playback.
    #
    # The HDMI path also depends on DomD kernel patch
    # 0016-xen-swiotlb-translate-MMIO-resource-through-dma-ranges.patch: without
    # it the DMA never reaches the MAI FIFO and these values produce silence.
    '-audiodev', 'alsa,id=snd0,out.dev=plughw:vc4hdmi1,out.frequency=48000,out.channels=2,out.format=s16,out.period-length=20000,out.buffer-length=60000,out.try-poll=off',
    # XT_DOMA_SND_PROPS_PLACEHOLDER is SUBSTITUTED AT BUILD TIME by xt-xen-cfg-doma:
    # on the qemu 10 device model it becomes "tx-poll-us=10000," and on 7.0.0 it
    # becomes the empty string, because that device model has no such property and
    # EXITS on it. What the property buys, and why the value is 10000, is recorded
    # at the substitution in xt-xen-cfg-doma.
    '-device', 'virtio-snd-pci,audiodev=snd0,streams=1,XT_DOMA_SND_PROPS_PLACEHOLDERdisable-legacy=on,ioeventfd=off,iommu_platform=on,bus=pcie.0,addr=8',
    # XT_VENUS_GPU_OPTS_PLACEHOLDER is SUBSTITUTED AT BUILD TIME by this recipe:
    # GPU=vulkan (the default) -> ",hostmem=256M,blob=true,venus=true",
    # GPU=gl -> the empty string, leaving this line exactly as
    # it was before Venus existed. The recipe fails the build if the token is
    # still here, because qemu rejects an unknown -device property outright.
    # See docs/VULKAN-VENUS.md.
    # XT_DOMA_GPU_PROPS_PLACEHOLDER is SUBSTITUTED AT BUILD TIME by xt-xen-cfg-doma:
    # it becomes XT_DOMA_GPU_PROPS ("refresh_rate=60000," by default) on the qemu 10
    # device model and the empty string on 7.0.0, which has no such property
    # and EXITS on it. What the value buys is recorded at XT_DOMA_GPU_PROPS in
    # xt-xen-cfg-doma.
    '-device', 'virtio-gpu-gl-pci,XT_DOMA_GPU_PROPS_PLACEHOLDERdisable-legacy=on,iommu_platform=on,bus=pcie.0,addr=7,xres=1920,yres=720XT_VENUS_GPU_OPTS_PLACEHOLDER',
    # XT_DOMA_HWDEC_DEVICE_PLACEHOLDER is SUBSTITUTED AT BUILD TIME by xt-xen-cfg-doma:
    # on the hardware-decode lane it becomes
    #     '-device', 'virtio-media-pci,<backend>,disable-legacy=on,ioeventfd=off,
    #                 iommu_platform=on,bus=pcie.0,addr=9',
    # and it is DELETED otherwise. This is what puts /dev/videoN in the guest, which
    # is what the c2 HAL the AAOS device installs under XT_DOMA_HWDEC=true opens; a
    # declared HAL that cannot start leaves init crash-looping the service and VINTF
    # advertising a HAL the device does not have.
    #
    # The backend argument differs per board and that difference is the whole of the
    # hardware-decode design on each -- see XT_DOMA_HWDEC_DEVARG in xt-xen-cfg-doma.
    #
    # Only the qemu 10.0.2 device model has a virtio-media device at all, so the
    # token is tied to the same GPU lane that selects that device model: substituted
    # when XT_DOMA_HWDEC is true, which only GPU=vulkan gives, and deleted otherwise;
    # on GPU=gl the line would make the device model
    # exit on an unknown -device and DomA would never start.
    XT_DOMA_HWDEC_DEVICE_PLACEHOLDER
    '-display', 'sdl,gl=es',
    # '-full-screen' removed: SDL sends set_fullscreen for wl_output@0 (HDMI-A-1),
    # overriding the kiosk-shell app-id output routing (weston.ini app-ids= ->
    # HDMI-A-2) so DomA would land on A-1. kiosk-shell configures every window to
    # the full output, so full-screen display is preserved without it.
    '-vga', 'std',
    '-d', 'guest_errors',
    # LAB/DEMO ONLY: the qemu monitor is unauthenticated. It is bound to
    # loopback (127.0.0.1) inside DomD so it is not reachable off-board; do not
    # expose it on a routable address in any non-lab build.
    '-monitor', 'telnet:127.0.0.1:1234,server,nowait',
    # Without '-name', libxl's default "domain-<id>" becomes the SDL window app_id
    # (qemu wrapper 0008 exports -name to SDL_VIDEO_WAYLAND_WMCLASS), which does not
    # match weston.ini app-ids and so is not routed to HDMI-A-2.
    '-name', 'DomA',
    '-global', 'virtio-mmio.force-legacy=false',
]

# DomD weston kiosk-shell routes by app-id (= WMCLASS) to HDMI-A-2 in the shared
# weston.ini (weston-init.bbappend): app-ids=qemu-system-aarch64-doma,DomA -> HDMI-A-2.
# A board layer's weston-init.bbappend can move DomA to another output and change its
# mode; the virtio-gpu xres/yres above has to follow it.
# The 0008 wrapper exports the -name argument (DomA) to WMCLASS, so both values are
# registered in app-ids (redundant safety).
qemu_envs = [
    'WAYLAND_DISPLAY=wayland-0',
    'XDG_RUNTIME_DIR=/run',
    'SDL_VIDEODRIVER=wayland',
    'SDL_VIDEO_WAYLAND_WMCLASS=qemu-system-aarch64-doma',
    # Touch. qemu's SDL frontend has no touch handling at all: SDL_FINGERDOWN,
    # SDL_FINGERUP and SDL_FINGERMOTION appear zero times in ui/sdl2.c and
    # ui/sdl2-input.c (both 7.0.0 and 10.0.2), and qemu sets no touch hint. A touch
    # can therefore reach virtio-tablet-pci only as mouse motion/button events,
    # which qemu's mouse path feeds to qemu_input_queue_abs() like a real tablet.
    # Measured on RPi4 2026-08-26: before, the guest's "QEMU Virtio Tablet" saw zero
    # events while DomD's own evdev node was collecting the taps; with this hint AND
    # the touch routed to the output this window is on, it produced EV_ABS
    # ABS_X/ABS_Y plus BTN_TOUCH DOWN/UP for a few taps and the UI responded. The
    # hint on its own, with the routing still wrong, left zero events; the hint's
    # own share was not measured.
    # WHY this hint would matter is NOT established. In SDL 2.32.10, the SDL in
    # DomD, SDL_MOUSE_TOUCH_EVENTS controls the other direction -- mouse events
    # generating synthetic touch events, off by default on desktop platforms
    # (include/SDL_hints.h) -- and touch to mouse is SDL_TOUCH_MOUSE_EVENTS, which
    # is on by default (src/events/SDL_mouse.c, src/events/SDL_touch.c). The hint
    # is kept because it is what was measured; measure without it before removing
    # it. The routing is 72-rp1-touch-output.rules, which routes the touchscreen to
    # the output this window is on.
    'SDL_MOUSE_TOUCH_EVENTS=1',
    # XT_VENUS_QEMU_ENV_PLACEHOLDER is SUBSTITUTED AT BUILD TIME by xt-xen-cfg-doma:
    # it becomes 'VIRGL_EXTERNAL_GBM=1' and the two memory knobs (V3DV_MAX_BO_CACHE_SIZE,
    # VKR_DEVICE_HEAP_MIB) in the Venus lane and is DELETED otherwise.
    #
    # WHY THIS EXISTS. virglrenderer patch 0002 gates its global gbm initialisation on
    # this variable. A non-NULL global gbm is what backs every VIRGL_BIND_SHARED guest
    # resource with a GBM buffer object, and only such a resource can be exported as a
    # dma-buf -- which is exactly what a venus context needs to import a guest gralloc
    # buffer. Without it, AAOS's SkiaVk compositing fails in
    # vkGetMemoryResourcePropertiesMESA and the guest's Venus aborts in vn_relax.
    #
    # WHY IT IS PER DEVICE MODEL and not a build-time switch: the same virglrenderer
    # serves both guests as separate processes. DomU, whose compositor is GL and
    # never hands a guest resource to a Venus context, leaves it unset, because on
    # V3D a GBM-backed resource is forced linear and that costs the instrument
    # cluster half its frame rate. A guest that composites with GL has no use for
    # the export path, so it leaves the switch unset; the default-off behaviour is
    # the one upstream will converge on.
    # See docs/VULKAN-VENUS.md.
    XT_VENUS_QEMU_ENV_PLACEHOLDER
]
