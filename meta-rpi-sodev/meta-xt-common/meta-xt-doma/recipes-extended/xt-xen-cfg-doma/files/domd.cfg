# SPDX-License-Identifier: MIT
# DomD VC4 (graphics driver domain) xl configuration
#
# Architecture: Dom0 control + Linux DomD GPU + DomU AGL cluster + DomA AAOS
#
# Mailbox option: DomD direct passthrough.
# Notes:
#   - phy: partition direct passthrough (no file image)
#   - HDMI/HVS interrupts routed via the L2 controller (disp_intr/aon_intr)
#   - iomem ranges are strictly sized
#   - root=/dev/xvda (whole device, no partition table)

name = "DomD"
type = "pvh"
uuid = "00000000-0000-0000-0000-000000000d44"

# driver_domain=1 applies the Flask domD_t label, allowing xl devd's privileged
# hypercalls (e.g. xc_physinfo) so the qvirtio backend dispatch works.
driver_domain = 1
seclabel = "system_u:system_r:domD_t"

#
# Explicit `passthrough = "disabled"` keeps libxl from setting the
# XEN_DOMCTL_CDF_iommu flag. Xen common code (xen/common/domain.c:551) returns
# -EINVAL when that flag is set while iommu_enabled = false. On ARM, iomem + irqs
# passthrough does not need an IOMMU, so disabled works. PCI passthrough is not
# used (the BCM2712 IOMMU is unsupported by Xen, which logs
# `I/O virtualisation disabled`).
#
# Refer: libxl_create.c:675-676 (CDF_iommu set condition), domain.c:550-554 (EINVAL)
#
passthrough = "disabled"

#
# Kernel + DTB
# (no initramfs needed; xen-blkfront is built into the kernel and mounts xvda directly)
#
kernel = "/usr/lib/xen/boot/linux-domd-vc4"
device_tree = "/usr/lib/xen/boot/bcm2712-raspberrypi5-domd-vc4.dtb"

# Root is a real block device. A ramdisk-only root caused libxl_arm.c
# copy_partial_fdt to warn on the over-complicated partial DT (many GPU devices in
# /passthrough), so linux,initrd-start/end were not written correctly into the DomD
# DT and the kernel failed to unpack the initramfs ("Unable to mount root fs on
# unknown-block(0,0)" panic).
# On RPi5 there is no SD IOMMU and the current xl-create does not support
# direct-map, so SD-controller passthrough (as done on R-Car, which has an IPMMU)
# is not viable. Instead Dom0 owns the SD and exposes phy:/dev/mmcblk0p2 via
# xen-blkback as xvda, which DomD mounts directly with built-in xen-blkfront. No
# ramdisk/initramfs is needed for blkfront-direct mount.
# On RPi5, dd rpi5-image-xt-domd-v4h.rootfs.ext4 onto SD /dev/mmcblk0p2 (ext4).

#
# CPU + memory
#
# NOTE: this xl-create cfg is REFERENCE-ONLY in the shipping build. The
# shipping DomD is dom0less (booted as boot.cmd /chosen/domD/module@0, and
# domd.service is masked to /dev/null in the DomD image), so DomD's real CPU pin
# comes from domain-cpu-pin.service (the single source of the boot-time CPU map),
# NOT from this file. domd-vc4.cfg uses cpus="2-3" but belongs to a different,
# DomA-less topology (see that file) so the two do not collide at runtime.
# cpus="0-1" here matches the README Domain/CPU map and domain-cpu-pin.service
# (Dom0=0, DomD=0-1, DomU=1, DomA=2-3). Keeping DomD off pcpu 2-3 avoids
# contending with DomA's dedicated cores.
# DomD memory raised to 4096 MB: the qemu virtio backend allocates the DomU
# mach-virt RAM (1024 MB) from its own host process (qemu -M virt allocates guest
# RAM in the host process), so DomD 1024 + qemu DomU RAM 1024 hit OOM (Cannot
# allocate memory). 4096 MB lets DomD weston and the qemu DomU run together.
memory = 4096
vcpus = 2
cpus = "0-1"

#
# Kernel command line
# root=/dev/xvda (whole device, GPT not present in image)
#
# /dev/xvda = SD /dev/mmcblk0p2 (phy passthrough via disk=).
# rw rootwait waits for xen-blkfront probe to complete.
# No rdinit: the real rootfs /sbin/init (systemd) starts by default.
# swiotlb=force is intentionally NOT used: on the current xt0.1 fork (direct-map +
# CMA helper integrated) forcing all DMA through swiotlb bounces the V3D 2MB dmabuf
# (max IO_TLB_SEGSIZE=256KB per mapping) and yields `swiotlb buffer is full` ->
# `Failed to get v3d handle for dmabuf`, breaking GL rendering. vc4 uses a DT
# fixed-clock so display works even with the firmware-clock -22, and swiotlb=force
# is unnecessary.
# vhost_xen.nogrant=1 runs the EPAM vhost_xen module in foreign-mapping mode rather
# than grant-mapping mode. DomA's qemu device-model uses `-netdev type=tap,vhost=on`
# (vhost-net) and vhost_xen maps the guest vring; grant mode (default) fails on
# RPi5/Xen and crashes qemu during device realize (readiness state never written ->
# "Qdisk backend not ready"). Foreign mapping uses the driver-domain's privileged
# direct map instead.
# cma=256M: without an explicit cma=, the kernel-default CMA pool is too small for
# vc4 dumb/scanout buffers (1080p 8MB up to 4K 33MB), so drm_gem_dma_create returns
# -ENOMEM ("failed to create dumb buffer") and weston scans out an uninitialized fb
# (noise). 256M lets the kernel place CMA dynamically in guest RAM.
# Note: even without swiotlb, V3D GL is ~1fps (buffer DMA overhead under Xen);
# practical use needs direct-map (GPA=PA).
extra = "console=hvc0 root=/dev/xvda rw rootwait clk_ignore_unused vhost_xen.nogrant=1 cma=256M"

#
# === Device passthrough (iomem MFN) ===
#
# Identity mapping (host PA = guest IPA). MFN = byte_addr >> 12.
# All entries are page-aligned (1 MFN = 4 KiB).
#
iomem = [
    # Mailbox (1 page, contains 0x107c013880-0x107c0138bf)
    "0x107c013,1",
    # HVS: 0x107c580000-0x107c599fff (0x1a000 = 26 pages)
    "0x107c580,26",
    # V3D hub (4 pages = 0x4000)
    "0x1002000,4",
    # V3D core0 (6 pages = 0x6000)
    "0x1002008,6",
    # V3D sms (1 page covers 0x700)
    "0x1002030,1",
    # HDMI shared csc page (0x107c700100/180 reside on same page 0x107c700000)
    "0x107c700,1",
    # HDMI0 hdmi+dvp+phy+rm+packet (0x107c701000-0x107c703fff, 3 pages)
    "0x107c701,3",
    # HDMI0 metadata (0x107c704000-0x107c704fff)
    "0x107c704,1",
    # HDMI1 hdmi+dvp+phy+rm+packet (0x107c706000-0x107c708fff, 3 pages)
    "0x107c706,3",
    # HDMI1 metadata (0x107c709000-0x107c709fff)
    "0x107c709,1",
    # HDMI shared hd (0x107c720000)
    "0x107c720,1",
    # aon_intr (HDMI parent, L2 controller) + HDMI0 cec page shared (0x107d510000-0x107d510fff)
    "0x107d510,1",
    # HDMI1 cec page (0x107d511000-0x107d511fff)
    "0x107d511,1",
    # disp_intr (HVS parent, L2 controller) on 0x107c502000-0x107c502fff
    "0x107c502,1",
    # IOMMU4 + IOMMUC (shared page 0x1000005000-0x1000005fff covers both 0x5200 and 0x5b00)
    "0x1000005,1",
    # PixelValve0/1 - pixel stream generation stage of the HDMI output path.
    # Left unspecified, Dom0 would actively claim them and DomD vc4-drm could not
    # take HDMI control (the Dom0 framebuffer would stay on HDMI). Combined with the
    # boot.cmd passthrough flag, bind these to DomD. "0x107c41x,1" is 1 page (a
    # 0x100-byte register block).
    "0x107c410,1",
    "0x107c411,1",
    # MOP/MOPlet (TXP for writeback) + ddc i2c
    "0x107c500,1",      # MOP (Display Transposer)
    "0x107c501,1",      # MOPlet
    "0x107d508,1",      # ddc0/ddc1 (HDMI EDID i2c, same page)

    # --- RP1 / PCIe RC passthrough (ITERATION 2: RC + MSI + RP1 aperture) ---
    # Toward the Zephyr-Dom0 architecture: move USB (touch) + Ethernet (both in RP1,
    # a PCIe endpoint behind pcie2) from Dom0 to DomD. Maps the PCIe RC, the MIP0 MSI
    # controller + doorbell, and the full RP1 peripheral MMIO aperture so DomD can
    # both link up (lspci sees RP1) and reach RP1's USB/Eth registers.
    # pcie2 RC regs: 0x10_00120000 size 0x9310 -> 0xa000 (10 pages). MFN=0x1000120
    "0x1000120,10",
    # MIP0 MSI controller regs: 0x10_00130000 (1 page). MFN=0x1000130
    "0x1000130,1",
    # MIP0 MSI doorbell: 0xff_fffff000 (1 page). MFN=0xfffffff
    "0xfffffff,1",
    # RP1 peripheral MMIO aperture: pcie2 outbound maps PCIe bus mem 0x0 -> host
    # 0x1f_00000000; RP1's internal ranges size is 0x410000 (SYSCFG@8000,
    # clocks@18000, gpio@d0000.., eth@100000, usb0@200000, usb1@300000=touch,
    # fw sram@400000). rp1_usb1 -> host 0x1f_00300000 ("1f00300000.usb" confirms).
    # 16 MiB window (not just the 0x410000 peripheral region) so the RP1 MSI-X-table
    # BAR -- which the guest assigns just above the 4 MiB BAR1 -- is also p2m-mapped;
    # otherwise rp1_probe's pci_alloc_irq_vectors(PCI_IRQ_MSIX) faults reading the
    # table. Matches the DomD DT pcie2 ranges/xen,reg (both trimmed to 16 MiB).
    # MFN = 0x1f00000000 >> 12 = 0x1f00000; size 0x1000000 (16 MiB) >> 12 = 4096 pages.
    # (NOTE: domd.cfg is the xl-create path; the live DomD is dom0less and uses the
    # DT xen,reg, but keep this consistent.)
    "0x1f00000,4096",
    # PCIe reset controllers so DomD brcm-pcie can rescal + bridge-reset the RC.
    # bcm_reset:    host 0x10_01504000 >> 12 = MFN 0x1001504 (reg 0x1504318/0x30).
    # pcie_rescal:  host 0x10_00119000 >> 12 = MFN 0x1000119 (reg 0x119500/0x10).
    "0x1001504,1",
    "0x1000119,1",
]

#
# IRQ passthrough (absolute GIC IRQ numbering)
#
# xl/Xen processes these as absolute GIC IRQ (= SPI + 32), confirmed by UART trace:
#   (XEN) xt-irq-grant: map_irq_to_domain(d0, IRQ65, dev=mailbox)
#   (XEN) xt-irq-grant: map_irq_to_domain(d0, IRQ281, dev=v3d)
#   (XEN) xt-irq-grant: map_irq_to_domain(d0, IRQ282, dev=v3d)
#   (XEN) xt-irq-grant: map_irq_to_domain(d0, IRQ129, dev=interrupt-controller)
# SPI-relative numbering (e.g. "33") would try to bind SPI 1 (an unused IRQ) and
# fail with "IRQ 33 has not been configured" rc=-5 (EIO); each IRQ needs the +32
# offset.
#
# - mailbox: SPI 33 -> abs IRQ 65
# - V3D core0: SPI 250 -> abs IRQ 282
# - V3D hub: SPI 249 -> abs IRQ 281
# - disp_intr (HVS parent): SPI 97 -> abs IRQ 129
# - aon_intr (HDMI0/1 parent): SPI 239 -> abs IRQ 271
#
# The individual HDMI lines (cec-tx/cec-rx/cec-low/hpd-connected/hpd-removed) are
# child lines of aon_intr and have no direct SPI to the GIC (no passthrough needed).
#
irqs = [
    65,     # mailbox (SPI 33 + 32)
    282,    # V3D core0 (SPI 250 + 32)
    281,    # V3D hub (SPI 249 + 32)
    129,    # disp_intr / HVS parent (SPI 97 + 32)
    271,    # aon_intr / HDMI0|1 parent (SPI 239 + 32)
    # PixelValve0/1 IRQ
    133,    # PixelValve0 (SPI 101 + 32)
    142,    # PixelValve1 (SPI 110 + 32)

    # --- RP1 / PCIe RC passthrough (ITERATION 1) ---
    265,    # pcie2 "pcie" (SPI 233 + 32)
    266,    # pcie2 "msi"  (SPI 234 + 32)
    261,    # pcie2 INTA   (SPI 229 + 32)
    262,    # pcie2 INTB   (SPI 230 + 32)
    263,    # pcie2 INTC   (SPI 231 + 32)
    264,    # pcie2 INTD   (SPI 232 + 32)
    # --- RP1 / MIP0 MSI lines (ITERATION 2) ---
    # The BCM2712 MIP maps 64 MSIs to GIC SPI 128..191 (abs 160..223, msi-ranges =
    # <&gic 0 128 1 64>). RP1's USB/Eth interrupts reach DomD as these MSIs (RP1
    # peripheral IRQs eth=6/usb0=31/usb1=36 are internal to RP1's own irqchip; only
    # the upstream MSI hits the GIC). Grant the whole block.
    # (Guest MSI via the BCM2712 MIP on Xen/ARM is unproven = the main HW go/no-go.)
    160, 161, 162, 163, 164, 165, 166, 167,
    168, 169, 170, 171, 172, 173, 174, 175,
    176, 177, 178, 179, 180, 181, 182, 183,
    184, 185, 186, 187, 188, 189, 190, 191,
    192, 193, 194, 195, 196, 197, 198, 199,
    200, 201, 202, 203, 204, 205, 206, 207,
    208, 209, 210, 211, 212, 213, 214, 215,
    216, 217, 218, 219, 220, 221, 222, 223,
]

#
# Block device backend
# DomD rootfs is GPT partition 2.
# Real partition layout: p1=boot, p2=DomD, p3=DomU, p4=DomA (android).
#
# Inside DomD this is /dev/xvda (whole device, no partition table on it).
#
# phy:/dev/mmcblk0p2 = SD partition 2 (rpi5-image-xt-domd-v4h.ext4 dd'd).
# Dom0 exposes /dev/mmcblk0p2 via xen-blkback; DomD sees it as /dev/xvda.
# Note: mounted read-write ('w') since DomD systemd needs to write.
#
# mmcblk0p3 (domu partlabel, 2GB ext4) is also passed through to DomD as
# /dev/xvdb, which the qemu DomU device-model uses as the virtio-blk-pci backend
# file (domu.cfg `-drive file=/dev/xvdb`).
disk = [
    'phy:/dev/mmcblk0p2, xvda, w',
    'phy:/dev/mmcblk0p3, xvdb, w',
    # DomA AAOS storage path: SD p4 (android partition, AAOS super.img) exposed to
    # DomD via blkback as xvdc. DomA's qemu virtio-blk uses DomD's /dev/mmcblk0p4 as
    # the backing (doma.cfg -drive file=/dev/mmcblk0p4).
    # Prerequisite: SD p4 (android) must exist (create p4 + dd super.img at deploy).
    # Booting DomD without p4 fails the blkback disk attach and DomD startup. To
    # test DomU alone before p4 is deployed, comment this line out temporarily.
    'phy:/dev/mmcblk0p4, xvdc, w',
]

#
# Network (via Dom0 ethernet)
# vif backend = Dom0 (backend=0), bridge xenbr0 (Dom0 is the host).
# Inside DomD this appears as eth0 = xen-netfront; the DomD network config assigns
# 192.168.10.11/24 (IP kept separate from Dom0).
#
vif = [
    'mac=00:16:3e:00:01:00,bridge=xenbr0,backend=0',
]

#
# Console
#
serial = "pty"

#
# Lifecycle
#
on_poweroff = "destroy"
on_reboot = "restart"
on_crash = "restart"
