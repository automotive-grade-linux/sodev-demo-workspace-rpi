#
# Seed for /data/vendor/wifi/shadow/aps.conf.
#
# /vendor/bin/doma-shadow-ap MERGES this file into aps.conf on every boot,
# adding only the SSIDs aps.conf does not have yet, so a PSK the user typed on
# screen is never overwritten.
#
# FORMAT: one AP per line, <SSID>TAB<PSK>. An empty PSK makes the shadow AP
# open. The first row of aps.conf becomes the primary BSS.
#
# THIS FILE SHIPS WITH NO ROW. The Wi-Fi screen lists what DomD's scan finds:
# doma-wifi-relay fills aps.conf from it within a publication or two (~20 s).
# Until then -- and whenever aps.conf has no usable row -- doma-shadow-ap and
# the relay beacon one hidden idle BSS, which the screen never lists, so that
# hostapd still starts. A build may add rows for real APs -- the SSID only:
# a secured one with the relay's placeholder passphrase
# (doma-relay-unprovisioned-0000, PLACEHOLDER_PSK in doma-wifi-relay), an open
# one with an empty PSK -- and NEVER with a real passphrase (see the end of this
# header). Such a row is protected: it is merged back at every boot, beaconed
# before DomD's first scan, and kept while DomD's scan does not name it, unless
# the rows ranked above it (the APs the scan names, then the one DomA's station
# is on) fill the 20; the passphrase is still typed on the screen.
#
# To join a real secured AP, type its passphrase on the DomA Wi-Fi settings
# screen. The shadow AP validates that handshake locally and cannot learn a PSK
# from it -- only a MIC crosses the air -- and one failed handshake disables the
# network permanently (config_wifiDisableReasonByWrongPasswordThreshold is 1 and
# ...DurationMs is -1 in ServiceWifiResources/res/values/config.xml).
# DomaWifiRelay then reads the typed passphrase, hands it to the shadow AP and
# to DomD, and calls WifiManager.connect(), which clears the disable. An open AP
# needs nothing typed. Editing the copy on the device --
# /data/vendor/wifi/shadow/aps.conf, one "SSID<TAB>PSK" per line -- works as
# well.
#
# Never put a real passphrase into this file, and never commit a real SSID into
# this source tree, as a row or in a comment: the file is published inside the
# vendor image.
