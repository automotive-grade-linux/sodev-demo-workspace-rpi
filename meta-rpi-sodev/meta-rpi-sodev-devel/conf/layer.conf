# SPDX-License-Identifier: Apache-2.0
# Diagnostic / debug / prototype assets, isolated from the shipping PR image
# (maintainer recommendation, meta-agl-devel style). Opt-in: add this layer to
# bblayers to build the tools; the shipping build does not reference it.

# We have a conf directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory containing .bb and .bbappend files, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rpi-sodev-devel"
BBFILE_PATTERN_rpi-sodev-devel := "^${LAYERDIR}/"
BBFILE_PRIORITY_rpi-sodev-devel = "20"

# The driver-domain diagnostics need xt-driver-domain. The DomU-side tools
# (sdl2-demo / domu-network / rpi5-image-domu-gfx) additionally need
# meta-xt-common/meta-xt-domu (its virtio-armv8-xt MACHINE); add that layer too
# when building the DomU tools (see README). It is not a hard LAYERDEPENDS here so
# the driver-domain tools can be opted in without pulling in meta-xt-domu.
LAYERDEPENDS_rpi-sodev-devel = "xt-driver-domain"
LAYERSERIES_COMPAT_rpi-sodev-devel = "wrynose"
