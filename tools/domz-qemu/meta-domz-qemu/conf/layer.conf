# Verification-only layer: adds Xen dom0 kernel options to the qemuarm64 Dom0 used
# for checking that `xl create domz.cfg` works. It is committed under tools/domz-qemu/
# and copied by hand into yocto/ (gitignored) for the build-qemu build only
# (meta-xt-domz/README.md); it is added ONLY to the build-qemu bblayers -- it must
# never enter the SD image build.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "domz-qemu"
BBFILE_PATTERN_domz-qemu := "^${LAYERDIR}/"
BBFILE_PRIORITY_domz-qemu = "12"
LAYERDEPENDS_domz-qemu = "core"
LAYERSERIES_COMPAT_domz-qemu = "wrynose"
