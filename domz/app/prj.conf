# DomZ: unprivileged Zephyr guest (DomU) under Xen 4.22 on Raspberry Pi 4/5.
#
# The board (xenvm) already supplies the guest memory map, GICv2, the ARM generic
# timer with CONFIG_TIMER_READS_ITS_FREQUENCY_AT_RUNTIME=y (so the 8.32 MHz
# default in soc/arm64/xenvm/Kconfig.defconfig does not have to match BCM2712's
# 54 MHz counter) and the Xen PV console node. What is left here is the Xen guest
# support itself plus a small-footprint logging setup: the domain gets 16 MiB.

# NOTE: no CONFIG_XEN here. It is a promptless symbol
# (arch/arm64/core/xen/Kconfig): `default y` gated on ARMV8_A and
# DT_HAS_XEN_XEN_ENABLED, so the xen,xen `hypervisor` node in xenvm.dts already
# turns it on - and assigning it in a .conf file is a hard Kconfig error
# ("assigned in a configuration file, but is not directly user-configurable").
# The same applies to the PV console driver that `xl console DomZ` attaches to:
# UART_XEN_HVC is `default y` once the xen,hvc-uart node is enabled and
# XEN && !XEN_DOM0 holds, which is exactly this configuration.

CONFIG_LOG=y
# Minimal mode: no log thread, no deferred buffers. The Zephyr Dom0 application
# in this workspace uses the same mode for the same reason (memory).
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_PRINTK=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# NOTE: no MP_*_NUM_CPUS override here. xenvm.dts declares a single cpu@0 and
# domz.cfg gives the domain one vCPU, so the board default already matches; the
# symbol was renamed (MP_NUM_CPUS -> MP_MAX_NUM_CPUS) around Zephyr 3.5 and
# hard-coding either name would break on the other side of that rename.
