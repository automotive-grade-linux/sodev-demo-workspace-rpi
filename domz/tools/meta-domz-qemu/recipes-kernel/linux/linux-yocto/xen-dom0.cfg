# Xen dom0 support. poky's features/xen/xen.cfg only covers the guest side, so a
# Dom0 kernel built from it has no /dev/xen/gntdev and xenstored dies with
# "Failed to open connection to gnttab", which in turn makes `xl create` block
# forever after "Parsing config from ...".
CONFIG_XEN_DOM0=y
CONFIG_XEN_PRIVCMD=y
CONFIG_XEN_GNTDEV=y
CONFIG_XEN_GRANT_DEV_ALLOC=y
CONFIG_XEN_BACKEND=y
CONFIG_XEN_BLKDEV_BACKEND=y
CONFIG_XEN_NETDEV_BACKEND=y
CONFIG_XENFS=y
CONFIG_XEN_SYS_HYPERVISOR=y
CONFIG_XEN_GNTDEV_DMABUF=y
